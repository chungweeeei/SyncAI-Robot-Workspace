# Merge the two diagonal MiR250 lidars from Isaac Sim (SyncAI-Omniverse) into a
# single 360deg LaserScan for amcl + costmaps.
#
#   /<robot_id>/scan_front ─┐
#                           ├─ ros2_laser_scan_merger ─(PointCloud2 /<robot_id>/cloud_in)─┐
#   /<robot_id>/scan_rear  ─┘                                                             │
#                                             pointcloud_to_laserscan ◀───────────────────┘
#                                                     └─▶ merged /<robot_id>/scan
#
# Both nodes run under the `namespace` launch arg (supplied by syncai_bringup
# from the config/system.ini robot_id), so RELATIVE topics resolve to
# /<robot_id>/*. The /**/ key prefix matches the node in any namespace.
# Frame ids are NOT namespaced by ROS, so the launch file overrides
# pointCloudFrameId / target_frame with the <robot_id>/ prefix — the values
# below are only fallbacks when the nodes are run without the launch file.
#
# The merged cloud/scan lives in a dedicated `<robot_id>/scan` frame whose pose is
# published by a static_transform_publisher (base_link -> scan) in the launch
# file at z = 0.1225 (the lidar mount height). So the per-lidar XOff/YOff below
# are the in-plane diagonal positions and ZOff is 0 (height lives in the TF).
#
# Geometry from SyncAI-Lib-OmnieWorld differential_drive_amr.py at scale 0.7:
# lidar_link_front @ (0.38,0.26)*0.7 = (0.266,0.182) sensor rot 0deg;
# lidar_link_rear  @ (-0.38,-0.26)*0.7 = (-0.266,-0.182) sensor rot 180deg.
# laserNAlpha matches each sensor's rotation_z; mount height 0.175*0.7 = 0.1225.
/**/ros2_laser_scan_merger:
  ros__parameters:
    use_sim_time: true

    # laser1 = FRONT lidar (front-left mount, sensor rot 0deg)
    scanTopic1: scan_front          # -> /<robot_id>/scan_front
    laser1XOff: 0.266
    laser1YOff: 0.182
    laser1ZOff: 0.0                 # height carried by the base_link->scan TF
    laser1Alpha: 0.0
    flip1: false
    inverse1: false                 # keep the whole scan (no wedge crop)
    laser1AngleMin: -180.0          # with inverse=false this keeps points
    laser1AngleMax: 180.0           # INSIDE [-180,180] = everything
    laser1R: 255
    laser1G: 0
    laser1B: 0
    show1: true

    # laser2 = REAR lidar (rear-right mount, sensor rot 180deg)
    scanTopic2: scan_rear           # -> /<robot_id>/scan_rear
    laser2XOff: -0.266
    laser2YOff: -0.182
    laser2ZOff: 0.0
    laser2Alpha: 180.0
    flip2: false
    inverse2: false
    laser2AngleMin: -180.0
    laser2AngleMax: 180.0
    laser2R: 0
    laser2G: 0
    laser2B: 255
    show2: true

    # Merged PointCloud2 output (relative -> /<robot_id>/cloud_in), expressed in
    # the dedicated scan frame (positioned over base_link by the static TF).
    # pointCloudFrameId is overridden by the launch file with <robot_id>/ prefix.
    pointCloudTopic: cloud_in
    pointCloudFrameId: scan


/**/pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true

    # Subscribes cloud_in (-> /<robot_id>/cloud_in), publishes scan
    # (-> /<robot_id>/scan). cloud frame == target_frame == <robot_id>/scan, so
    # this needs no TF lookup. target_frame is overridden by the launch file
    # with the <robot_id>/ prefix.
    target_frame: scan
    transform_tolerance: 0.01

    angle_increment: 0.0087         # ~0.5 deg
    angle_min: -3.14
    angle_max: 3.14
    range_min: 0.05
    range_max: 30.0
    min_height: -1.0
    max_height: 1.0
    scan_time: 0.3333
    inf_epsilon: 1.0
    use_inf: true
    queue_size: 16
