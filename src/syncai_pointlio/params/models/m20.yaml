# The Lynx M20's sensors, over src/syncai_pointlio/params/pointlio_params.yaml:
# loaded after it by pointlio.launch.py when the INI's [system] robot_model is
# m20 (config/models/README.md has the layering).
#
# Not a Livox of ours: the vendor stack's two lidars, merged into one
# sensor_msgs/PointCloud2 on /LIDAR/POINTS_UDP (~10 Hz, frame "lidar_link", which
# the vendor puts at its base_link's origin -- the cloud is in the body frame),
# and its body IMU on /IMU (sensor_msgs/Imu, ~200 Hz, empty frame_id), both on
# DDS domain 0 from the robot's other computers. Measured on robot01,
# 2026-11-24.
#
# Values marked FIRST GUESS are not measured yet.

/**/pointlio_node:
  ros__parameters:
    # The vendor's topics, in place of the /<robot_id>/livox/{lidar,imu} the
    # launch sets for a model that names none: absolute, since the vendor publishes them with no namespace (a
    # relative name would resolve under /<robot_id>/pointlio). The cloud's
    # writer is best effort (2026-11-24), which is why the node's lidar reader
    # is best effort for every robot (pointlio_node.cpp has the argument);
    # /IMU's writer is reliable, as the IMU reader is.
    lidar_topic: "/LIDAR/POINTS_UDP"
    imu_topic: "/IMU"

    # PointCloud2, two lidars merged by the vendor: 192 rings, 0-95 the front
    # lidar and 96-191 the rear one, ~103 k points when both sweeps are in it
    # (46 k-156 k seen), each point with its own absolute time in the float64
    # field `timestamp`.
    lidar_type: 1

    # Read that time, and cut the stream into scans by it (2026-11-25;
    # scan_merger.hpp has the argument). A message is not one moment. Bag of
    # robot01, 2026-11-24, 816 s, 8156 messages: the front lidar's 100 ms sweep
    # always ends ~22 ms before the header stamp, and the rear lidar's is in
    # the same window in 52 % of the messages, one sweep (100 ms) older in
    # 15 %, absent in 16.5 % and two sweeps long in the 16.5 % after those; the
    # message itself arrives ~133 ms after its stamp. Taken whole at the header
    # stamp (until this was read), a front point was 73 ms older than the time
    # it was given on average and a rear point 106 ms, up to 316 ms, with no
    # motion compensation: an offline map of that bag had walls ~2x a G23
    # map's thickness.
    #
    # lidar_merge_holdback: the longest a scan waits for the rear lidar's
    # points before the filter gets it. On that bag 100 ms still lost 0.006 %
    # of the rear points (it ends ~2 ms after the front one) and 110 ms none;
    # 120 leaves a margin.
    #
    # lidar_source_*: the wait is per lidar (2026-11-25), told apart by ring,
    # so a scan goes as soon as both lidars have passed its end -- the full
    # 120 ms only while the rear one is a sweep behind -- and a lidar that
    # stops is WARNed rather than mapped without in silence. A lidar is down
    # 0.5 s behind the other: on the 11-24 bag the rear one was never more
    # than a sweep and a half (~0.2 s) behind; on the 11-25 13:42 bag, 0.3 s
    # at most. That bag replayed: a scan waited 45 ms on average (200 ms with
    # the holdback alone), nothing dropped as late, the map the same (README).
    lidar_time_field: "timestamp"
    lidar_merge_holdback: 0.12
    lidar_source_field: "ring"
    lidar_source_bounds: [0, 96, 192]
    lidar_source_timeout: 0.5
    # The M20's IMU reports m/s^2 already (|a| = 9.77 at rest, 2026-11-24), not
    # the Livox's g: the G23's 9.81 here would read gravity as ~96 m/s^2.
    imu_acc_scale: 1.0

    # FIRST GUESS: the G23's. The vendor seems to crop the robot's own points
    # already: lying, nothing came within 0.45 m of lidar_link and the nearest
    # returns (0.55-0.6 m, x +/-0.55-0.59, z -0.19..-0.04) sat by the floor.
    # Check again standing, when the wheels are ~0.6 m from the origin.
    lidar_min_range: 0.5

    # The IMU's range is not known; these sit above everything it was seen to
    # read. robot01, 2026-11-24, 90 s of /IMU while the robot was driven back
    # and forth and turned: no axis clipped (every extreme seen once), |a| up to
    # 31.2 m/s^2 (3.18 g, on z), |w| up to 1.47 rad/s.
    #
    # satu_acc 150 since 2026-11-26 (39.0, 4 g, until then). Over stairs the
    # accelerometer reads far more and still does not clip: on the dp_1125 bag
    # (robot01, 2026-11-25, one floor up and back down) az peaked at
    # 61-80 m/s^2, each impact ~15 ms wide with no flat top. 39 dropped 123 of
    # those real samples, all on the stairs, and the descent diverged (eff
    # down to 60 %, the map's track ending 12.8 m from where it started).
    # Replayed with 150 (beside a beam-angle correction both runs had), the
    # descent no longer diverged (eff >= 73 %, |ba| at the end 0.06 against
    # 0.34). 150 is a ceiling above everything seen, not the part's clip,
    # which is still unknown: replace it with the datasheet's range minus a
    # margin once DEEP Robotics gives it.
    satu_gyro: 35.0
    satu_acc: 150.0

    # IMU <- lidar: p_imu = r_il * p_lidar + t_il. The cloud is in the vendor's
    # base_link, and DEEP Robotics' own MJCF of the M20 (sdk_deploy's
    # M20_description/m20_mjcf/mjcf/M20.xml, the model their controller is
    # trained and simulated on) puts the accelerometer and gyro on an imu_site
    # at (0.0632, -0.0268, 0.0435) in base_link, unrotated, so t_il = -(that).
    # Mirrored in syncai_bringup's M20.urdf (imu_joint); change the two
    # together. Not the "imu" of the vendor's /tf_static, (-0.026, 0, 0.042),
    # used until this was found: that tree is an integrator's template
    # (robotPF's layout.urdf, other vendors' frame names). Not measured on the
    # robot either; what the data does say is that the axes are the body's: at
    # rest gravity reads along +z (a = -1.07, 0.04, 9.71 with the body pitched
    # ~6 deg).
    #
    # r_il since 2026-11-26 (identity until then): the IMU's axes are turned
    # from the cloud's by roll -0.39 deg, pitch +0.47 deg, yaw 0, i.e. r_il =
    # Exp((-0.39, +0.47, 0) deg). Fitted from motion on the dp_1125 bag, the
    # way LI-Init does: over 2 s windows, the rotation of Point-LIO's pose
    # (the cloud's frame turning) against the gyro's integral,
    # phi_lio - phi_gyro = [phi_gyro]x d + b dt, solved for the misalignment d
    # and a gyro bias b. Whole run -0.37 / +0.49 (+-0.02) deg, and each
    # segment agrees (1F -0.39 / +0.52, stairs up -0.45 / +0.33, down
    # -0.48 / +0.40); the static gravity-vs-floor angle, 0.5-0.9 deg, is the
    # same order. Yaw is not observable from that walk (+0.11 +- 0.14) and
    # stays 0. Replayed with it, the map's 2F went from 1.21 deg yawed against
    # its 1F to 0.22 deg, and a 2F wall seen through the hall from 1F
    # keyframes from 0.44 m off its 2F self to 0.03 m (pgo's loop closures
    # are planar and within one floor, so nothing else corrects that).
    # CAVEATS: the fit and that replay also had two corrections this stack
    # does not have yet (each Airy's beam-angle error, and the cloud's
    # timestamp shifted +26 ms onto /IMU's clock), so this value has not run
    # without them; one replay per setting; how 0.6 deg of roll / pitch
    # becomes 1.4 deg of yaw over a climb is not worked out; and the 1F
    # track's tilt went 0.30 -> 0.65 deg with it (the accelerometer's down and
    # this gyro-fitted rotation still disagree by ~0.3 deg). esti_il stays
    # false, so this value is what runs.
    #
    # t_il = -r_il * imu_site, so it moves under 1 mm with the rotation; the
    # IMU's position is still the MJCF's. M20.urdf's imu_joint carries the
    # inverse (r_il transposed, as its rpy): change the two together.
    r_il: [0.999966355, -0.000027918, 0.008202892,
           -0.000027918, 0.999976834, 0.006806655,
           -0.008202892, -0.006806655, 0.999943189]
    t_il: [-0.063555, 0.026505, -0.043162]

    # Override of a shared key: the merged cloud is 57-93 k points a scan, 3-5x
    # a MID360's. Measured on robot01, 2026-11-24, driving at 0.5-0.9 m/s with
    # all 12 cores online:
    #
    #   filter  body_cloud/scan  pointlio_node CPU  skipped scans  eff / res
    #   20      ~3-5 k           60-82 % of a core  none           86-87 % / 3.0 cm
    #   6       16.6 k           100-123 %          7 in 10 s      85-89 % / 2.9-3.7 cm
    #
    # The estimator runs on one thread, so the extra cores do not help: at the
    # G23's 6 it fell behind and the backlog guard skipped scans, for no better
    # matching (what limits that while moving is the missing motion
    # compensation, not the point count). 20 also gives body_cloud the G23's
    # density (a MID360's ~20 k / 6 = ~3.3 k), which is what its consumers --
    # the localizer's GICP, the terrain layer, the planner's overlay -- are
    # sized for. Try 10-15 against the skipped-scan WARN if it ever needs to
    # be denser.
    lidar_filter_num: 20

    # body_cloud_dense's decimation, for mapping only: syncai_mapping's pgo
    # maps from it, and it is published only while subscribed, so the
    # estimator above never sees it. The shared 2 would hand pgo 28-46 k points
    # a scan on the M20, to be deskewed and published in the same pass as the
    # estimator's -- more than the 16.6 k at which lidar_filter_num 6 already
    # skipped scans. 5 gives 11-19 k, the G23's ~10 k order (a MID360's ~20 k /
    # 2), and divides 20, so body_cloud's points stay a subset of the dense
    # cloud's (the node warns otherwise; 6 would not divide). FIRST GUESS:
    # watch the backlog WARN while mapping.
    dense_filter_num: 5
