# Point-LIO (output model) parameters every robot model shares: the estimator,
# the local map, the filters. The IMU is fused as a measurement: body angular
# velocity / specific force are random-walk states, so points are processed at
# their own timestamps without scan undistortion.
#
# What belongs to a robot's sensors is NOT here since 2026-11-24 but in
# params/models/<robot_model>.yaml, loaded after this file (the G23's Livox
# MID360 in g23.yaml, the Lynx M20's vendor lidars in m20.yaml), the layout
# syncai_driver_manager has: lidar_type, imu_acc_scale, lidar_min_range,
# satu_gyro / satu_acc and the r_il / t_il extrinsic. Every model's file sets
# all seven -- with none of them here, a key a model left out would run on the
# C++ default, not on another robot's value -- which config/models/
# model_keys.yaml lists (model_keys) and test_model_overlays.py checks. A model
# file may also override a key below (the M20's lidar_filter_num).
#
# This is a normal ROS parameters file (loaded by pointlio.launch.py via
# `parameters=[...]`), not a hand-parsed YAML: every key below is a parameter
# pointlio_node declares, so `ros2 param get/set/dump` and launch-level
# overrides all work. The `/**/pointlio_node:` wildcard key makes the file
# namespace-independent — the launch runs the node at /<robot_id>/pointlio.
# (Ported unchanged from SyncAI-Fast-LIO2's pointlio/config/pointlio.yaml in
# 2026-09; tuning notes below predate the move.)
#
# Two more things are not here, on purpose:
#   * the Livox input topics, /<robot_id>/livox/{lidar,imu} -- they carry the
#     robot_id, so pointlio.launch.py sets lidar_topic / imu_topic itself,
#     for each one the model's file does not name (the M20's names its own).
#     The relative fallbacks below are for running the node bare.
#   * the robot_id-prefixed frame names — TF frame ids are not namespaced by
#     ROS, so pointlio.launch.py overrides body_frame/world_frame explicitly.
#     The values below are only the fallbacks for running the node bare.
/**/pointlio_node:
  ros__parameters:
    # The launch's names without the robot_id prefix, so a bare run broadcasts
    # what syncai_mapping's pgo_node expects in one (it derives pointlio_odom
    # rather than reading it). The fork's "lidar" / "body" until 2026-10, and
    # the code defaults still are.
    world_frame: "pointlio_odom"
    body_frame: "pointlio_body"

    # Input topics (2026-11-24; NodeConfig in pointlio_node.hpp has the
    # argument). Fallbacks: the launch sets the Livox's topics, and a model's
    # file may set its own.
    lidar_topic: "lidar"
    imu_topic: "imu"

    # Per-point time of a PointCloud2 lidar (lidar_type 1), 2026-11-25;
    # NodeConfig in pointlio_node.hpp and scan_merger.hpp have the argument.
    # Empty = the cloud carries none and a message is one moment at its header
    # stamp. A model whose cloud does carry it names the float64 field of
    # absolute seconds (the M20's "timestamp"): each point then gets its own
    # time, and the messages are cut into lidar_scan_period scans by time,
    # each handed to the filter once it is lidar_merge_holdback older than the
    # newest point seen -- the wait for a lidar whose points come late (the
    # M20's rear one, up to a sweep behind the front one in the same message).
    # Neither of the two is read while the field is empty; a Livox CustomMsg
    # (lidar_type 0) has its own per-point time and uses none of the three.
    lidar_time_field: ""
    lidar_merge_holdback: 0.0
    lidar_scan_period: 0.1
    # How short of a scan's end the lidars may stop and the scan still count as
    # complete, s (2026-11-27; ScanMerger::Config::end_tolerance has why): a
    # lidar whose sweeps end just before the grid line would otherwise hold
    # every scan a sweep for the next message. 0 = at the end itself.
    lidar_merge_end_tolerance: 0.0
    # The lidars of a merged cloud told apart (2026-11-25), so that a scan
    # waits only as long as the late one needs, lidar_merge_holdback at most:
    # an integer field of the cloud and the bounds of each lidar's values,
    # [b0, b1) [b1, b2) ... A lidar whose newest point falls
    # lidar_source_timeout behind the newest of all is down -- WARNed once,
    # and no longer waited for. Empty field = one fixed holdback; none of the
    # three is read without lidar_time_field. The bounds' [0] is a
    # placeholder: an empty list has no type for the ROS params parser.
    lidar_source_field: ""
    lidar_source_bounds: [0]
    lidar_source_timeout: 0.5
    print_time_cost: false

    # Scan backlog guard (2026-10-28; NodeConfig in pointlio_node.hpp has the
    # whole argument). When the buffered scans span more than
    # max_lidar_backlog seconds, the oldest are skipped -- at most
    # max_lidar_skip in a row, their IMU samples still fused -- so a CPU that
    # cannot keep up costs scans instead of an odometry that falls further
    # behind for good (robot01 2026-10-28: over 5 minutes behind, at 0.65x real
    # time). 0.3 s is three scans of slack before anything is skipped; at 2 the
    # node catches up while it runs faster than 1/3 of real time. A float, see
    # map_grid_resolution below; <= 0.0 processes every scan however late.
    max_lidar_backlog: 0.3
    max_lidar_skip: 2

    # The health log (2026-11-02, after robot01's 2026-10-30 divergence left
    # nothing in this node's log to say how its matching had declined;
    # NodeConfig in pointlio_node.hpp has the argument, the README "The health
    # log" how to read it). One `lio health:` line per summary_period seconds,
    # a WARN with its reasons when the window's speed exceeds max_speed, an IMU
    # axis saturated, a scan matched no plane, or (min_effective_ratio > 0) a
    # scan's matched share fell under it. 0.0 for that one until a healthy
    # robot's ratio has been measured. Log only. summary_period <= 0.0 = off.
    health:
      summary_period: 1.0
      max_speed: 1.5
      min_effective_ratio: 0.0

    lidar_filter_num: 6
    # body_cloud_dense's decimation (2026-10-09): pgo maps from it, at 3x the
    # points the filter and body_cloud use. Same scan, same pass, published
    # only while subscribed. 2 is the floor (1 overflows CycloneDDS's default
    # receive buffer on lo); <= 0 = body_cloud's points.
    dense_filter_num: 2
    lidar_max_range: 30.0
    # Coarser than fastlio2 (0.15): every point group costs an EKF update, keep
    # headroom on Jetson. Lower for more detail if time cost allows.
    scan_resolution: 0.25
    # The local map's voxel, each holding one point (2026-11-09; the port's 0.3
    # before). Once the map held that rule itself, 0.3 left the map sparser than
    # the old one, which leaked a second point into many voxels: replaying the
    # 11-08 run, walking eff 94 -> 86 % and residual 2.62 -> 2.87 cm. At 0.2 they
    # are 94 % and 2.33 cm, at about the old cost, and still bounded.
    map_resolution: 0.2

    # The local map (IVoxMap): upstream Point-LIO's grid-map branch values. 2 m grids, a
    # search over the grid and its 6 face neighbours (0 / 6 / 18 / 26), and an
    # LRU that drops the least recently inserted-into grid past map_capacity
    # grids -- a memory bound at 1000000, not forgetting; the `map` field of the
    # health line has the count to size a smaller one from. map_resolution
    # above is the voxel each of which keeps the first point inserted in it.
    # Write the resolution as a float: the node declares a double, and a bare
    # 2 is an int64 override -> InvalidParameterTypeException at startup.
    map_grid_resolution: 2.0
    map_capacity: 1000000
    map_nearby: 6

    # process noise driving the omg/acc random-walk states
    gyr_cov_output: 1000.0
    acc_cov_output: 500.0
    b_gyr_cov: 0.0001
    b_acc_cov: 0.0001

    # IMU-as-measurement noise
    imu_meas_omg_cov: 0.1
    imu_meas_acc_cov: 0.1

    # point-to-plane measurement
    lidar_meas_cov: 0.01
    plane_thr: 0.1
    # split same-timestamp groups larger than this into sequential chunks
    batch_max_points: 500

    imu_init_num: 20
    near_search_num: 5

    gravity_align: true
    # initial covariance of the gravity state; with no process noise, 0 holds g
    # at 9.81 along the init's direction for good (2026-11-09). At the port's
    # 0.0001 walking pushed |g| down ~0.014 an hour on robot01, because at rest
    # |g| and the accelerometer bias along gravity explain the same reading.
    # Write a float
    gravity_init_cov: 0.0
    esti_il: false
