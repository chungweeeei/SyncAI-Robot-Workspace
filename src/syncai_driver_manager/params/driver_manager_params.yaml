# Parameters for the syncai_driver_manager node. The /**/ wildcard key matches
# the node in any namespace (the node is constructed as "driver_manager").
/**/driver_manager:
  ros__parameters:
    # Initial battery charge level in percent (0-100).
    battery_initial_level: 100.0
    # Battery discharge rate in percent per 30 seconds.
    battery_discharge_rate: 0.1
    # Frame stamped into the published BatteryState header.
    base_frame: "base_link"
