# Parameters for the syncai_driver_manager node. The /**/ wildcard key matches
# the node in any namespace (the node is constructed as "driver_manager").
/**/driver_manager:
  ros__parameters:
    # --- UDP session with the robot controller ---
    # Local interface/port the node binds to receive telemetry datagrams.
    telemetry_recv_ip: "192.168.1.103"
    telemetry_recv_port: 50010
    # Remote controller endpoint that outbound command datagrams are sent to.
    command_target_ip: "192.168.1.120"
    command_target_port: 50051
