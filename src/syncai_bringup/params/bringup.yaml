# Parameters every robot model shares, for the nodes bringup.launch.py starts:
# robot_state_publisher (the body TF tree of the model's URDF).
#
# The Livox driver's block, /**/livox_lidar_publisher, is NOT here since
# 2026-11-24: it is the G23's own lidar (a MID360 / MID360s over its Ethernet),
# in params/models/g23.yaml, loaded after this file. Another model with a
# different lidar (the M20's is the vendor stack's, on /LIDAR/POINTS_UDP) has no
# use for it.
#
# A third block, /**/vizionsdk_camera, configured the TechNexion camera node
# until it was removed from the launch on 2026-10-17 (syncai_camera_feeder owns
# the camera); git history has it, with the white-balance and MJPG findings.
#
# The /**/ wildcard keys match the node names in any namespace, so the same file
# works for any robot_id: the launch file reads robot_id from config/system.ini
# and uses it as the node namespace.
#
# What is NOT in either file, and why — these four are computed at launch time
# and are appended AFTER the params files in the Node's parameters list, so
# they win:
#   * robot_description  - the URDF text, read off disk from description/
#   * frame_prefix       - needs the resolved robot_id
#   * frame_id           - same; TF frame names are NOT namespaced by ROS, so
#                          the fallback in the model's file is overridden
#                          with <robot_id>/lidar_top
#   * user_config_path   - the livox network JSON, generated per robot_id and
#                          lidar model at launch time from host_ip (in the
#                          model's file) + the [sensor.lidar] ip / type in the
#                          system INI. type is what selects the MID360 vs
#                          MID360s JSON schema; there is no ROS parameter for
#                          the model.
/**/robot_state_publisher:
  ros__parameters:
    # Real robot: there is no /clock. Set ONLY here — a launch-level override
    # placed after this file would silently win over the YAML value.
    use_sim_time: false
