# Parameters for the syncai_planner "planner_server" node and its internal
# global costmap node. The /**/ wildcard keys match the node names in any
# namespace, so the same file works for any robot_id: the launch file reads
# robot_id from config/system.ini and uses it as the node namespace. Topic
# values below are RELATIVE names — they get the namespace prefix
# automatically (e.g. map -> /<robot_id>/map). TF frame names are NOT
# namespaced by ROS, so the launch file overrides robot_base_frame /
# sensor_frame with the <robot_id>/ prefix at launch time — the values below
# are only fallbacks when the node is run without the launch file. The
# costmap's global_frame stays "map".
/**/planner_server:
  ros__parameters:
    use_sim_time: false

    # Warn if a plan takes longer than 1/expected_planner_frequency seconds.
    # Lowered to match the slow Isaac Sim clock (~35 Hz / 0.58x real-time).
    expected_planner_frequency: 10.0

    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "syncai_planner/NavfnPlanner"
      tolerance: 0.3        # accept goals within this distance (m) of the requested pose
      use_astar: false      # false = Dijkstra, true = A*
      allow_unknown: true   # allow planning through unknown space

    # --- Opt-in Smac planners (ported from nav2_smac_planner, humble) ------
    # NavFn stays the default: it is proven on this robot, and every id listed
    # in planner_plugins is loaded and configured at startup (heuristic lookup
    # tables included), so unused planners should not cost anything. To try
    # one, add its id to planner_plugins above and pass planner_id:
    # "SmacHybrid" in the ComputePathToPose goal (the BT's move.xml sends
    # GridBased explicitly). Do NOT configure two ids of the same smac type —
    # the node classes share static motion tables (same limitation upstream).
    #
    # planner_plugins: ["GridBased", "SmacHybrid"]
    # SmacHybrid:
    #   plugin: "syncai_planner/SmacPlannerHybrid"
    #   motion_model_for_search: "DUBIN"  # RPP never reverses; REEDS_SHEPP would
    #                                     # allow backing up the controller can't follow
    #   minimum_turning_radius: 0.30      # m. The quadruped can spin in place but
    #                                     # Hybrid-A* needs > 0; keep well above one
    #                                     # costmap cell (resolution 0.05)
    #   angle_quantization_bins: 72       # 5 deg bins
    #   tolerance: 0.3                    # match GridBased
    #   allow_unknown: true
    #   downsample_costmap: false         # 0.05 m maps here are small enough as-is
    #   downsampling_factor: 1
    #   max_iterations: 1000000
    #   max_on_approach_iterations: 1000
    #   max_planning_time: 5.0
    #   analytic_expansion_ratio: 3.5
    #   analytic_expansion_max_length: 3.0
    #   cost_penalty: 2.0                 # tuned against the inflation layer below
    #                                     # (cost_scaling_factor 2.0, radius 0.5);
    #                                     # raise to hug the centerline harder
    #   change_penalty: 0.0
    #   non_straight_penalty: 1.2
    #   reverse_penalty: 2.0              # only relevant for REEDS_SHEPP
    #   retrospective_penalty: 0.015
    #   cache_obstacle_heuristic: false   # obstacle layer changes every cycle
    #   smooth_path: true
    #   lookup_table_size: 20.0
    #
    # SmacPlanner2D ("syncai_planner/SmacPlanner2D"): cost-aware grid A* —
    #   the nearest smac equivalent to NavFn with use_astar: true. Radius-only
    #   collision checking, so no footprint / inflation coupling to tune.

# The global costmap is an internal node created by planner_server
# (constructed as a plain node named "global_costmap").
/**/global_costmap:
  ros__parameters:
    use_sim_time: false

    # Frames (robot_base_frame is overridden by the launch file with
    # <robot_id>/ prefix; global_frame stays "map")
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 1.0
    publish_frequency: 1.0

    # Geometry: the static layer resizes the master costmap to the map, so
    # width/height here are only the pre-map defaults.
    rolling_window: false
    track_unknown_space: true
    resolution: 0.05

    # Robot footprint: rectangular MiR250 chassis at scale 0.7 (real 0.80 x
    # 0.58 m -> sim 0.56 x 0.40 m -> half-extents 0.28 x 0.20). Matches the
    # local_costmap footprint in controller_server_params.yaml; rescale both
    # together if SyncAI-Omniverse sim_config.yaml robots[*].scale changes.
    # (A circular robot_radius=0.22 was oversized and made RPP reject valid
    # paths through ~0.6 m gaps.)
    footprint: "[[0.28, 0.20], [0.28, -0.20], [-0.28, -0.20], [-0.28, 0.20]]"
    footprint_padding: 0.01

    # Relative topic: resolves to /<robot_id>/map (matches map_server's
    # output in the same namespace)
    map_topic: map

    # Layer stack — order matters: static -> obstacle(mark/clear) -> inflation
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    static_layer:
      plugin: "syncai_costmap_2d::StaticLayer"
      enabled: true
      map_subscribe_transient_local: true

    obstacle_layer:
      plugin: "syncai_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      combination_method: 1            # 0=Overwrite, 1=Maximum
      observation_sources: scan pointcloud
      scan:
        # Merged 360deg scan from ros2_laser_scan_merger (-> /<robot_id>/scan)
        topic: scan
        # TF frame (overridden by the launch file with <robot_id>/ prefix)
        sensor_frame: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        # true: laser rays that return no hit (inf, e.g. open warehouse space)
        # are treated as range_max so they still raytrace-clear up to
        # raytrace_max_range. With false those rays are dropped, so a removed
        # obstacle whose ray now reads inf never gets cleared -> residual cost.
        inf_is_valid: true

      # 3D LiDAR obstacle source: Point-LIO's per-scan body cloud, used to catch
      # obstacles the 2D scan plane misses (e.g. another robot's chassis).
      pointcloud:
        # pointlio_node publishes body_cloud relative to its namespace, so with
        # the robot_id-namespaced launch this resolves to
        # /<robot_id>/pointlio/body_cloud. Relative name (like `scan` above):
        # the planner_server runs in the <robot_id> namespace, so each robot
        # only marks its own cloud even on a shared DDS domain.
        topic: pointlio/body_cloud
        # Leave sensor_frame empty on purpose: the observation buffer then uses
        # the cloud's own header frame_id (<robot_id>/pointlio_body, Point-LIO's
        # body_frame) as the raytrace origin, so this source needs no per-robot
        # launch-file frame override. The TF chain resolves via the localizer's
        # map -> <robot_id>/pointlio_odom (i.e. only after relocalize).
        sensor_frame: ""
        data_type: "PointCloud2"
        marking: true
        clearing: true
        # Heights are evaluated in the costmap global frame (map) = metres above
        # the floor (the TF chain keeps z; a floor point lands at map z ~ 0).
        # Slice a robot-height band: skip the ground plane, keep the chassis.
        min_obstacle_height: 0.1
        max_obstacle_height: 1.5
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0

    inflation_layer:
      plugin: "syncai_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.5      # ref global_costmap
      cost_scaling_factor: 2.0   # ref global_costmap
