# Parameters for the syncai_map_server "map_server" node.
# The /**/ wildcard key matches the node name in any namespace, so the same
# file works for any robot_id: the launch file reads robot_id from
# config/system.ini and uses it as the node namespace. The relative topic_name
# below gets the namespace prefix (map -> /<robot_id>/map). The frame_id stays
# "map" (the shared global frame).
/**/map_server:
  ros__parameters:
    use_sim_time: true
    # Absolute path to the map YAML file to load on startup.
    # Leave empty ("") to start without a map and load it later via the
    # "/map_server/load_map" service.
    #
    # This is only the fallback default: each robot instance sets its own map
    # via a [map] map key in config/instances/<robot_id>.ini, which
    # map_server.launch.py reads and overrides on top of this value.
    yaml_filename: "/home/ubuntu/robot_ws/map/lio_map/gridmap.yaml"

    # Topic on which the OccupancyGrid is published (latched / transient_local QoS).
    topic_name: "map"

    # frame_id stamped on the published OccupancyGrid.
    frame_id: "map"
