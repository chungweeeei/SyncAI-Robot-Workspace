# Parameters for the syncai_map_server "map_server" node.
# The /**/ wildcard key matches the node name in any namespace, so the same file
# works with the launch `namespace` argument (default robot01). The relative
# topic_name below gets the namespace prefix (map -> /robot01/map).
/**/map_server:
  ros__parameters:
    use_sim_time: true
    # Absolute path to the map YAML file to load on startup.
    # Leave empty ("") to start without a map and load it later via the
    # "/map_server/load_map" service.
    yaml_filename: "/home/ubuntu/robot_ws/map/warehouse.yaml"

    # Topic on which the OccupancyGrid is published (latched / transient_local QoS).
    topic_name: "map"

    # frame_id stamped on the published OccupancyGrid.
    frame_id: "map"
