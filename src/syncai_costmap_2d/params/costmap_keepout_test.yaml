# Parameters for keepout_filter_test.launch.py: static layer + keepout filter.
# The costmap node lives in its own sub-namespace (fully-qualified name
# /costmap/costmap), so the wildcard key is needed for the params to match.
/**/costmap:
  ros__parameters:
    use_sim_time: false

    # Frames
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 5.0
    publish_frequency: 2.0

    # Master costmap geometry (the static layer resizes the master to match
    # the incoming map anyway)
    rolling_window: false
    track_unknown_space: true
    width: 10
    height: 10
    resolution: 0.05
    origin_x: 0.0
    origin_y: 0.0

    # Robot footprint (circular)
    robot_radius: 0.2
    footprint_padding: 0.01

    # Map source for the static layer
    map_topic: /map
    always_send_full_costmap: true

    # Layer stack
    plugins: ["static_layer"]
    static_layer:
      plugin: "syncai_costmap_2d::StaticLayer"
      enabled: true
      subscribe_to_updates: false
      map_subscribe_transient_local: true
      footprint_clearing_enabled: false

    # Costmap filters run AFTER the layer stack on the combined costmap
    filters: ["keepout_filter"]
    keepout_filter:
      plugin: "syncai_costmap_2d::KeepoutFilter"
      enabled: true
      filter_info_topic: "/costmap_filter_info"
