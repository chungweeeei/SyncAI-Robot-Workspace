# Hierarchical bundle adjustment parameters for hba_node (syncai_mapping).
#
# A normal ROS parameters file (loaded by hba.launch.py via
# `parameters=[...]`), keyed `/**/hba_node:` so it applies at
# /<robot_id>/hba. It was SyncAI-Fast-LIO2's hba/config/hba.yaml until
# 2026-09, read by yaml-cpp through a `config_path` parameter; the values are
# unchanged. Nothing here depends on robot_id, so the launch passes the file
# straight through with no overrides.
#
# Numeric types matter: scan_resolution, voxel_size, plane_thresh and
# down_sample are doubles (write them with a decimal point -- a bare `1` is
# an int64 override that kills the node at startup with
# InvalidParameterTypeException); the rest are ints and must stay bare.
#
# Read once at startup; `ros2 param set` afterwards changes nothing.
/**/hba_node:
  ros__parameters:
    # Voxel leaf applied to every patch on load and to the map_points preview.
    scan_resolution: 0.1

    # Sliding window over the keyframes: window_size poses per local BA,
    # advanced by stride, stacked into max_layer hierarchy levels.
    window_size: 20
    stride: 10
    # Plane-feature voxelisation for the local BA: voxels of voxel_size with
    # at least min_point_num points whose planarity passes plane_thresh.
    voxel_size: 0.5
    min_point_num: 10
    max_layer: 3
    plane_thresh: 0.01
    # ba_max_iter LM iterations per local BA; hba_iter full passes over the
    # hierarchy (each pass republishes map_points).
    ba_max_iter: 10
    hba_iter: 5
    # Voxel leaf of the clouds handed to the local BA.
    down_sample: 0.1
