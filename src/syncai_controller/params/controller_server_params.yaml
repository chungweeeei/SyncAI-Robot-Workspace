# Parameters for the syncai_controller "controller_server" node and its
# internal local costmap node. The /**/ wildcard keys match the node names
# in any namespace, so the same file works for any robot_id: the launch file
# reads robot_id from config/system.ini and uses it as the node namespace.
# Topic values below are RELATIVE names — they get the namespace prefix
# automatically (e.g. scan -> /<robot_id>/scan). TF frame names are NOT
# namespaced by ROS, so the launch file overrides global_frame /
# robot_base_frame / sensor_frame with the <robot_id>/ prefix at launch
# time — the values below are only fallbacks when the node is run without
# the launch file.
/**/controller_server:
  ros__parameters:
    use_sim_time: true

    # Lowered from 20.0: Isaac Sim publishes /clock at only ~35 Hz (~0.58x
    # real-time) with coarse steps, so a 20 Hz sim-time loop constantly
    # overran and logged "missed its desired rate". 10 Hz is sustainable.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    speed_limit_topic: "speed_limit"
    publish_zero_velocity: true
    # Gate the goal check on path progress: only consult the goal checker once
    # the remaining path length (from the path pose closest to the robot) is
    # below this many meters. Without it, a patrol loop whose last waypoint
    # equals the robot's start position is "reached" on the first control
    # cycle. <= 0 disables the gate.
    goal_reached_max_remaining_path: 1.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "syncai_controller::SimpleProgressChecker"
      # Loosened (was 0.5 m / 10 s) so slow sim motion isn't flagged as
      # "Failed to make progress": require only 0.1 m of movement within 30 s.
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "syncai_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.08
      stateful: true

    FollowPath:
      plugin: "syncai_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0
      lookahead_dist: 0.8
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.3
      max_angular_accel: 3.2
      allow_reversing: false
      use_interpolation: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_robot_pose_search_dist: 10.0

# The local costmap is an internal node created by controller_server
# (constructed as a plain node named "local_costmap").
/**/local_costmap:
  ros__parameters:
    use_sim_time: true

    # Frames (overridden by the launch file with <robot_id>/ prefix)
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 5.0
    publish_frequency: 2.0

    # Fixed-size rolling window centered on the robot
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05

    # Robot footprint: rectangular MiR250 chassis at scale 0.7 (half-extents
    # 0.28 x 0.20). Matches the global_costmap footprint in
    # planner_server_params.yaml; rescale both together if the sim scale
    # changes, else RPP spam-rejects valid paths ("collision ahead!").
    footprint: "[[0.28, 0.20], [0.28, -0.20], [-0.28, -0.20], [-0.28, 0.20]]"
    footprint_padding: 0.01

    # Layer stack — order matters: obstacle(mark/clear) -> inflation
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "syncai_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      combination_method: 1            # 0=Overwrite, 1=Maximum
      observation_sources: scan
      scan:
        # Merged 360deg scan from ros2_laser_scan_merger (-> /<robot_id>/scan)
        topic: scan
        # TF frame (overridden by the launch file with <robot_id>/ prefix)
        sensor_frame: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        inf_is_valid: false

    inflation_layer:
      plugin: "syncai_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.4 
      cost_scaling_factor: 3.0
