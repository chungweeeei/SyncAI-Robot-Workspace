# Parameters for the syncai_controller "controller_server" node and its
# internal local costmap node — 3D (Point-LIO) real-robot variant of
# controller_server_params.yaml:
#   * use_sim_time false (no /clock on the real robot)
#   * local costmap gets a second observation source from Point-LIO's body
#     cloud, since the 3D stack runs no scan merger (there is no
#     /<robot_id>/scan on the real robot — the scan source below stays for
#     setups that do publish one, it just receives nothing otherwise).
# The /**/ wildcard keys match the node names in any namespace, so the same
# file works for any robot_id: the launch file reads robot_id from
# config/system.ini and uses it as the node namespace. Topic values below are
# RELATIVE names — they get the namespace prefix automatically. TF frame names
# are NOT namespaced by ROS, so the launch file overrides global_frame /
# robot_base_frame / sensor_frame with the <robot_id>/ prefix at launch time.
/**/controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Seconds the server tolerates controller exceptions (MPPI's "Optimizer
    # fail to compute path" once every candidate collides; RPP's "collision
    # ahead!"; a TF miss in either's path transform) before failing the goal with
    # "Controller patience exceeded"; every failed cycle publishes zero
    # velocity, so the robot brakes and waits rather than coasting. Raised
    # 0.3 -> 3.0 so a blocked path re-routes instead of aborting. The detour
    # comes from the BT's 1 Hz IsPathValid check and the replan it triggers
    # (move.xml RateController) on the global costmap, which itself updates
    # at 1 Hz and is not in phase with it, so a blocker that appears inside
    # RPP's ~0.6 m collision projection takes up to ~2.2-2.5 s (<= 1 s to be
    # marked, <= 1 s to the next check, Smac's search, one BT tick and one
    # control cycle) to turn into a new path. At 0.3 the FollowPath action aborted first; its RecoveryNode then
    # cleared the local costmap and re-sent the *same* old path (the
    # blackboard path had not changed yet), RPP refused again, and
    # PipelineSequence failed the whole NavigateToPose in ~0.6-1 s -- before
    # the detour ever arrived. The timer resets on the first valid command, so
    # a path that routes around the blocker costs nothing extra -- and
    # deliberately NOT when a replanned path is accepted on preempt
    # (updateGlobalPath): a drivable path resets it on its first cycle anyway,
    # and since is_path_valid runs RPP's own footprint test (2026-10) a path
    # RPP refuses was replanned once a second (until move.xml's blocked_time,
    # 2026-10-14), so a reset per preempt would
    # leave the progress checker's movement_time_allowance (30 s) as the only
    # abort. That 30 s stays the outer bound on standing still. With the
    # footprint test the detour normally arrives before RPP refuses (the
    # blocker is seen 2.5 m out); this window is for one that appears inside
    # the 0.6 m projection. A map with no second corridor still aborts, ~3 s
    # per attempt -- how many attempts, and so how long the robot waits for a
    # live blocker to leave, is move.xml's FollowPath retry count (4, ~16 s
    # in all since 2026-10-14, sized to outlast IsPathValid's 10 s
    # blocked_time); a Wait/RoundRobin recovery is not ported, and this knob is not
    # it. Do not go below ~2.5: the worst case above would no longer fit.
    # The replanned detour above is the 2D tree's. A 3D map's move_3d.xml
    # (Octo3D + FollowPath) has no IsPathValid and plans once per goal, so
    # the only detour there is MPPI's own, inside the local costmap; at a
    # blocker that closes the way it stops, and those retries (~16 s) are
    # the whole wait before the goal fails.
    # MPPI's "Optimizer fail to compute path" reaches this window only since
    # 2026-10-21: until then the optimizer threw Humble's std::runtime_error,
    # which the server does not tolerate, so FollowPath aborted on the first
    # such cycle (three aborts in 4.4 s beside one blocker on robot01).
    failure_tolerance: 3.0
    speed_limit_topic: "speed_limit"
    publish_zero_velocity: true
    # Gate the goal check on path progress: only consult the goal checker once
    # the remaining path length (from the path pose closest to the robot) is
    # below this many meters. Without it, a patrol loop whose last waypoint
    # equals the robot's start position is "reached" on the first control
    # cycle. <= 0 disables the gate.
    goal_reached_max_remaining_path: 1.0

    # DockToPose (dock_to_pose, 2026-10). What an empty controller_id /
    # goal_checker_id in a dock goal resolves to -- both must be entries of
    # the lists below (a missing one only warns at startup and refuses dock
    # goals, so FollowPath keeps working from a file without the docking
    # plugin) -- and the approach timeout a goal with timeout <= 0 gets. The
    # approach is ~1 m at docking speed; a minute means stuck, not slow.
    default_dock_controller_id: "Docking"
    default_dock_goal_checker_id: "dock_goal_checker"
    dock_approach_timeout: 60.0

    # Paths with heights (2026-10): OctomapPlanner3D writes the ground height
    # on every pose, and its stair links climb. On dp1f_1012's spiral stair
    # the path is back over the same x / y every 8.1 m, 2.5 m higher, so a
    # planar match puts the robot on the wrong turn -- RPP's nearest-pose
    # search spans 10 m -- and a 2F goal can be "reached" from the 1F
    # corridor under it. A path whose poses do not all share one z is
    # therefore matched in 3D, by RPP 3D (nearest pose, local window) and by the
    # goal check here; a 2D planner's path (all z = 0) is untouched. The
    # robot's height is not in its pose -- lio_bridge projects base_link onto
    # the plane -- so it is body_frame's z in the path's frame minus
    # lidar_height: the planner's own start-height lookup, and the same two
    # values (planner_server_params.yaml, Octo3D). body_frame gets the
    # <robot_id>/ prefix from the launch file; without that TF a path with
    # heights fails each cycle in RPP and never reaches its goal, rather
    # than being tracked on x / y. path_height.hpp has the rest.
    body_frame: pointlio_body
    lidar_height: 0.481
    # How far the ground under the robot may be from the end pose's height
    # for the goal to count. The end pose is the top of a 0.1 m cell and the
    # ground estimate rides the lidar's z (1F keyframes spread 0.24 m on a
    # floor the planner calls level), so 0.5 m: well clear of both, and far
    # under the 2.5 m of one stair turn or the ~5.5 m between floors.
    goal_z_tolerance: 0.5

    progress_checker_plugin: "progress_checker"
    # ORDER MATTERS: a FollowPath goal that names no goal checker (move.xml
    # names none, and the BT node defaults it to "") gets the FIRST entry, so
    # the navigation checker stays first. Until 2026-10 an empty id only fell
    # back with exactly one checker loaded, and adding the second would have
    # failed every BT navigation.
    goal_checker_plugins: ["goal_checker", "dock_goal_checker"]
    # Four controllers, one local costmap. FollowPath is MPPI
    # (syncai_mppi_controller, 2026-10): it samples (v, w) sequences on the
    # local costmap and bends round a blocker inside it, which RPP cannot --
    # RPP tracks the path and refuses to drive when the path is blocked.
    # FollowPathRPP is the RPP that was FollowPath until then, kept loaded so
    # the A/B is move.xml's controller_id="FollowPathRPP" with no rebuild, and
    # as the fallback while MPPI is unproven on the robot. Docking and
    # Undocking (2026-10) are two instances of the pose-to-pose docking
    # controller that the dock_to_pose action drives, differing only in
    # direction (see their blocks). Only the controller a goal names runs;
    # the others cost memory, not CPU. FollowPathRPP3D is
    # feature/octomap-planner-3d's: the RPP above plus 3D matching of a path
    # with heights and the stair mode, as a plugin of its own so FollowPathRPP
    # stays dev's 2D RPP. Since 2026-10-20 FollowPath (MPPI) matches a path
    # with heights in 3D and climbs stairs the same way (one state machine,
    # syncai_util::StairMode, for both), so a 3D map's trees (move_3d.xml,
    # dock_3d.xml's staging leg) name FollowPath as the 2D trees do, and
    # FollowPathRPP3D is the A/B on a 3D map as FollowPathRPP is on a 2D
    # one. One controller for both map types: a path without heights (every
    # 2D planner) takes MPPI's planar code path unchanged. Only FollowPathRPP
    # matches on x / y alone.
    controller_plugins: ["FollowPath", "FollowPathRPP", "FollowPathRPP3D", "Docking", "Undocking"]

    progress_checker:
      plugin: "syncai_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "syncai_controller::SimpleGoalChecker"
      # Widened from 0.05: the robot's minimum forward speed is ~0.3 m/s, so it
      # cannot creep in slowly to satisfy a tight tolerance and would overshoot
      # / stall short of a 5 cm window. Raised 0.15 -> 0.3 (2026-10-14): under
      # MPPI the approach to the goal decelerates through the gait floor, and
      # on robot01 the robot stopped dead 0.23 m and 0.29 m short (cmd_vel
      # still non-zero, odom zero) until the progress checker aborted after
      # 30 s. 0.3 covered both stalls. Lowered back 0.3 -> 0.15 the same day:
      # 0.3 ended an ordinary MOVE too far from its goal. The stalls were
      # MPPI's approach slowing under the gait floor; FollowPath's walk_vx_min
      # (2026-10-15) holds the command at the floor until MPPI asks to stop,
      # and that did not end them: on 2026-10-16 the robot stood 0.19 m short
      # with MPPI asking to stand (vx under in_place_vx_max, which the floor
      # leaves alone). FollowPath's approach_dist (2026-10-16) takes over
      # there and walks onto the goal -- unverified on the robot. A robot
      # standing 0.15-0.5 m short with cmd_vel non-zero and odom zero, until
      # the progress checker aborts, with no "approaching it directly" in the
      # controller log, is still this value. It is also MPPI
      # GoalAngleCritic's threshold_to_consider below, and where
      # approach_dist's walk ends: change them together.
      xy_goal_tolerance: 0.15
      # Raised 0.1 -> 0.2 rad (~11.5 deg, 2026-10-14). The gait controller does
      # not turn below ~0.3 rad/s (MPPI's -0.115 rad/s left odom at zero), so
      # the final rotation cannot slow into a narrow window: a command that
      # tapers below the floor near the goal heading stalls the robot short of
      # it, and one above it carries the body on through the command latency
      # and the stop of a heavy quadruped. At the 0.3 rad/s floor the +/-0.2
      # window takes ~1.3 s to cross, enough for ~0.6 s of latency + braking
      # without overshooting it. Estimated, not measured: hold wz 0.3 for 2 s,
      # zero it, and read the extra rotation off /odom before tightening this.
      yaw_goal_tolerance: 0.2
      stateful: true

    # The dock_to_pose default (dock and undock alike). Tight on purpose: the
    # robot has to end ON the charging pad. Whether 0.05 holds is decided by
    # the stop latency, not by the controller. Under MPC the gait walks down
    # to 0.05 m/s (measured 2026-10-14), so slowdown_radius brings the robot
    # in at the floor: one control cycle is 2.5 mm there, and the gait's own
    # stopping distance comes on top. (Under RL, with its ~0.3 m/s floor, a
    # cycle was 1.5 cm -- one reason the trees switch to MPC first.) The DockingController reads xy_goal_tolerance
    # back through getTolerances(): it is where the final in-place rotation
    # starts, so the two latches (the controller's and this stateful one)
    # trip on the same number. The result's final_distance_error /
    # final_yaw_error report what the robot actually achieved.
    #
    # yaw_goal_tolerance 0.05 -> 0.1 (2026-10-15), together with the docking
    # controllers' v_angular_min 0.03 -> 0.15: at the old 0.03 floor a
    # 0.05 rad window could not be overshot, but the gait does not turn in
    # place at 0.09 rad/s, let alone 0.03 (both robot01 undocks stalled there
    # until the progress checker aborted). At 0.15 one cycle is 7.5 mrad and
    # the gait's latency carries the yaw further, so the window doubled
    # rather than letting the final alignment hunt. Not measured: if it still
    # hunts, widen this before lowering the floor again.
    dock_goal_checker:
      plugin: "syncai_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: true

    FollowPath:
      plugin: "syncai_mppi_controller::MPPIController"
      # Starting values, not a tuning: nothing below has driven the robot yet.
      # Upstream's README example, except where a line says otherwise.
      #
      # Velocity bounds are the RPP calibration (FollowPathRPP's
      # desired_linear_vel 0.60 / rotate_to_heading_angular_vel 0.65) and with
      # it driver_manager's scale_fwd / scale_turn_*: one calibration, change
      # them together. vx_min 0.0 disables reversing, as RPP's
      # allow_reversing: false does; PathAngleCritic then forces
      # forward_preference on by itself.
      # vx_max 0.60 -> 0.80 (2026-10-20), FollowPathRPP3D's speed since
      # 2026-10-19, with time_steps cut to keep the horizon inside the local
      # costmap (see there). NOT measured: with scale_fwd 1.40 the gait is
      # commanded 1.12 m/s, past the 0.80 run A swept, and the rollouts assume
      # the commanded speed is the real one -- check cmd_vel against odom on
      # the first run. The optimizer does not model max_linear_accel either,
      # so it plans as if it could stop at once; the clamp needs 0.32 m to
      # stop from 0.80 (0.18 from 0.60).
      vx_max: 0.80
      vx_min: 0.0
      wz_max: 0.65
      # DiffDrive although the quadruped can strafe: driver_manager's
      # scale_left / scale_right are unmeasured (1.0 placeholders), so lateral
      # commands would be tracked at an unknown gain. Omni goes in together
      # with that calibration (and vy_max / vy_std).
      motion_model: "DiffDrive"
      # Not upstream (Humble bounds velocity only): clamp on the output,
      # same values as RPP's -- there is no velocity smoother.
      max_linear_accel: 1.0
      max_angular_accel: 3.2
      # Not upstream: the walking floor (2026-10-15). RL does not walk below
      # ~0.3 m/s; on robot01 MPPI commanded 0.13 m/s and the robot stood. A
      # command with |vx| between in_place_vx_max and this is raised to it,
      # keeping its sign; under in_place_vx_max it is a stop or an in-place
      # turn and is left alone. Applied before the acceleration clamp, so a
      # stop still ramps down. 0.30 is FollowPathRPP's
      # min_approach_linear_velocity / regulated_linear_scaling_min_speed --
      # the floor RPP has driven the robot with, pre-scale like every value
      # here; change them together. The cost: MPPI's slow approaches (goal,
      # blockers) now run at 0.30 instead, so the robot carries more speed
      # into the goal window and the next cycle re-plans from there. 0
      # disables it.
      walk_vx_min: 0.30
      # Not upstream: the in-place turn floor (2026-10-14). RL does not turn
      # in place below ~0.3 rad/s at the gait; MPPI tapers its turn into the
      # goal yaw and held -0.115 rad/s with odom at zero until the progress
      # checker aborted (see GoalAngleCritic). A command with |vx| under
      # in_place_vx_max and |wz| between in_place_wz_deadband and
      # in_place_wz_min is raised to in_place_wz_min, keeping its sign; while
      # walking nothing changes (a small wz there is an arc, and raising it
      # would weave). 0.3 is the gait's floor taken as the cmd_vel value,
      # pre-scale like every value here (2026-10-15). It was 0.21 = 0.3 /
      # scale_turn 1.40 for a day, on the assumption -- never confirmed -- that
      # the 0.3 is what the gait receives after driver_manager's scale.
      # Same value as FollowPathRPP's rotate_to_heading_min_angular_vel; change
      # them together. 0 disables it.
      in_place_wz_min: 0.3
      in_place_wz_deadband: 0.05
      in_place_vx_max: 0.1
      # Not upstream: the final rotation (2026-10-15). Inside
      # goal_checker.xy_goal_tolerance of the path's end, MPPI stops
      # optimising and turns in place to the goal heading, RPP's
      # rotate-to-goal-heading with RPP's numbers: up to this rate
      # (FollowPathRPP's rotate_to_heading_angular_vel), ramped at
      # max_angular_accel, capped to stop on the heading, never under
      # in_place_wz_min; vx ramps to 0. Left to the optimizer, GoalCritic
      # (the exact point) and GoalAngleCritic (the yaw) pulled against each
      # other once the position was accepted: a small vx kept the turn floor
      # off, wz went out at ~0.1 rad/s in jerks, and on robot01 the progress
      # checker aborted a goal the robot was standing on. The cost is the
      # heading accuracy: the robot now enters the yaw_goal_tolerance window
      # at up to 0.65 rad/s instead of tapering into it, and carries on
      # through the stop (see yaw_goal_tolerance) -- lower this if the final
      # heading overshoots. 0 disables it (the optimizer turns, as upstream).
      final_rotation_wz: 0.65
      # Not upstream: the direct approach (2026-10-16). Inside this distance
      # of the path's end, the first cycle in which MPPI asks to stand (raw
      # |vx| under in_place_vx_max) hands the rest of the approach to RPP's
      # law: turn in place onto the goal point (final_rotation_wz, floored at
      # in_place_wz_min) while its bearing is over approach_rotate_min_angle,
      # else walk at walk_vx_min along the arc through it, until the final
      # rotation takes over at goal_checker.xy_goal_tolerance. On robot01 the
      # robot stood 0.19 m from a goal that lay 90 deg to its left, MPPI at
      # vx 0.02-0.10 and odom zero, and the progress checker aborted it twice
      # until it was cancelled: inside 0.5 m only GoalCritic still pulls, and
      # its mean-distance-over-the-horizon cost pays a slow approach best,
      # under in_place_vx_max for a goal close by or beside the robot. 0.5 is
      # where PathAlign / PathAngle / PreferForward stop scoring, i.e. where
      # that starts. MPPI is untouched while it keeps walking, and its
      # obstacle avoidance with it; the takeover gives that up, so the turn
      # and the walk are checked against LETHAL footprints each cycle, and a
      # blocked way hands the robot back to MPPI (the old stall, progress
      # checker, BT retry). Needs walk_vx_min and final_rotation_wz on. 0
      # disables it. Unverified on the robot: the controller log says
      # "approaching it directly" when it opens.
      approach_dist: 0.5
      # FollowPathRPP's rotate_to_heading_min_angle: change them together.
      # Over it the approach turns in place, under it it walks the arc. The
      # walk's wz is capped at final_rotation_wz, so a short walk off a wide
      # bearing runs a wider arc than the one through the goal point (a few
      # mm wide at 0.25 rad and 0.2 m, well inside xy_goal_tolerance).
      approach_rotate_min_angle: 0.25
      # Not upstream: the turn onto a new path (2026-10-20). From a stand
      # (commanded |vx| under in_place_vx_max), once per path, a robot more
      # than rotate_to_path_min_angle off the bearing of the first pose
      # rotate_to_path_sampling_dist away turns in place at final_rotation_wz
      # until within approach_rotate_min_angle, then the optimizer takes over
      # -- RPP's rotate-to-heading, and nav2's rotation shim (whose defaults,
      # 45 deg and 0.5 m, these are). The optimizer starts a goal from a zero
      # control sequence and builds a turn up over ~0.5-1 s, under the gait's
      # floor at first; on robot01 the turn onto the path started slow. The
      # turn is checked against LETHAL footprints; blocked, or under 45 deg
      # (where the optimizer turns while it walks off), it is the
      # optimizer's. 0 disables it. Unmeasured on the robot: the controller
      # log says "rotating in place onto it" when it opens.
      rotate_to_path_min_angle: 0.785
      rotate_to_path_sampling_dist: 0.5
      # Stair mode (2026-10-20): RPP 3D's, in MPPI, so one controller serves
      # a 2D map and a 3D one. Detection and the policy switch are
      # syncai_util::StairMode's (shared with FollowPathRPP3D), with the
      # SAME values as that block's -- one calibration of one gait; change
      # them together, and the notes there are the record. On a path with
      # heights a stretch rising stair_min_rise within stair_enter_dist is a
      # stair: the robot brakes, set_policy_mode switches the gait to
      # stair_policy_mode, it stands stair_policy_settle_time, then climbs
      # on a stair_lookahead_dist carrot at stair_linear_vel with the
      # optimizer skipped and the costmap unread -- no obstacle avoidance on
      # a flight, by decision; the terrain layer judges a stair lethal --
      # using final_rotation_wz for the turn onto the carrot (so that must
      # stay > 0). Leaves when the window from stair_exit_behind_dist back to
      # stair_exit_ahead_dist ahead has gone level, with a second stop and
      # the policy restored. A path without heights never enters it.
      # Untested on the robot, as RPP 3D's is. The stair_enter_dist window is
      # looked for from the robot out to the stair brake's own stopping
      # distance (2026-10-20; 0.75 v^2 / max_linear_accel, 0.48 m from 0.80),
      # so at vx_max the hold starts up to ~1.5 m before the rise and the
      # robot stands about where a slow approach would start braking: the
      # 1.0 m window alone left 0.48 m before a 30 deg ramp, all of it brake.
      use_stair_mode: true
      stair_min_rise: 0.3
      stair_enter_dist: 1.0
      stair_exit_behind_dist: 0.8
      # 2.5 -> 3.5 (2026-10-21): a switchback's landing is laid as out 0.5 m,
      # across (the flights' axes 1.5-1.9 m apart on dp), in 0.5 m -- up to
      # ~2.8 m of level path between two flights, and at 2.5 the window from
      # the first corner read level (0.29 m of rise) and left stair mode on
      # the landing. HIMLOCO turns in place and climbs the whole well; the
      # policy goes back only on the top floor.
      stair_exit_ahead_dist: 3.5
      stair_policy_settle_time: 3.0
      stair_policy_mode: 1
      flat_policy_mode: -1
      # Every change of speed in stair mode is an S-curve (2026-10-20): up to
      # this after every stop on a flight (the policy switch, a turn onto the
      # carrot), and down to 0 for an in-place turn and for the brakes before
      # each policy switch. The acceleration rises from 0, peaks at
      # max_linear_accel halfway, and falls back to 0 as the speed arrives --
      # 0 <-> 0.5 in 0.75 s -- instead of the clamp's constant-acceleration
      # ramp, which starts and ends in a step. A floor that started the walk
      # at this speed in one step was tried the same day and dropped for it.
      stair_linear_vel: 0.5
      # 0.4 -> 0.6 (2026-10-20). 0.4 was RPP 3D's, for the inside treads of
      # dp1f_1012's spiral (radius ~1.3 m), but a single flight is a straight
      # stair link now (Octo3D, 2026-10-19), with no turn to cut. At 0.4 the
      # carrot's bearing passed approach_rotate_min_angle (0.25 rad) at ~10 cm
      # of sideways sway -- a stop and an in-place turn on the stairs -- and at
      # 0.5 m/s 10 cm asked ~0.63 rad/s, the turn cap. At 0.6 those are ~15 cm
      # and ~0.28 rad/s; a switchback's landing turn (walked link) is cut by
      # ~0.15-0.2 m. FollowPathRPP3D keeps its own 0.4. Unmeasured.
      stair_lookahead_dist: 0.6
      # The landing corners (2026-10-21; StairMode::findCorner()): a heading
      # change over stair_turn_angle within 0.2 m either side is a corner.
      # The carrot is held at it, the robot stops stair_turn_dist before it
      # on the S-curve, then turns in place onto the next flight until the
      # carrot's bearing is under stair_turn_done_angle (5 deg, against
      # approach_rotate_min_angle's 14 deg to start the turn: a flight is
      # climbed straight or not at all). 0.15 m puts the body's centre at
      # the corner the planner set 0.5-1 m out on the landing. Unmeasured.
      stair_turn_angle: 0.785
      stair_turn_dist: 0.15
      stair_turn_done_angle: 0.087
      # Down backwards (2026-10-21): HIMLOCO descends a flight facing the
      # risers as it climbs one, so on a path that goes down the robot turns
      # round at the top (its tail onto the path, past approach_rotate_min_angle
      # and latched to stair_turn_done_angle like every stair turn), walks the
      # flights and the landing corners in reverse at -stair_linear_vel, and
      # turns back to the path standing at the bottom, before the policy goes
      # back. The direction is read from the path ahead every cycle
      # (StairMode::slopeAhead(), the first stair_min_rise of height change
      # within 10 m); a level stretch keeps the last reading. false = down
      # forwards. Unmeasured.
      stair_descend_backwards: true
      # Horizon 32 x 0.05 = 1.6 s (upstream 56 = 2.8 s). At vx_max 0.80 that is
      # 1.28 m, which with the footprint's 0.36 m nose and the window's lag
      # (it re-centres at update_frequency 5 Hz, 0.16 m at 0.80) fits in the
      # 4 x 4 m local costmap's 2 m half-width. With consider_footprint, a
      # rolled-out point off the costmap is checked as a footprint, and
      # footprintCost() reads an off-map vertex as LETHAL, so a horizon
      # longer than the window makes every fast candidate "collide" at its
      # far end and MPPI slows down for no obstacle. It was 40 (2.0 s, 1.2 m
      # at 0.60) until vx_max went to 0.80 (2026-10-20), where 40 would reach
      # 1.6 + 0.36 + 0.16 = 2.12 m; a 5 x 5 m costmap is the way to keep 2.0 s.
      # model_dt must stay 1 / controller_frequency:
      # equal turns on the warm-start shift, a longer controller period throws
      # out of initialize() and takes controller_server down.
      time_steps: 32
      model_dt: 0.05
      # Upstream's default 1000 (the README example uses 2000). Measure the
      # controller process's CPU on the Orin before raising it or time_steps:
      # a cycle past 50 ms shows up as "Control loop missed its desired rate".
      batch_size: 1000
      iteration_count: 1
      # 0.2 (upstream's) -> 0.3 (2026-10-20): MPPI never reached vx_max on a
      # straight. There the only critic that pays for speed is
      # PathFollowCritic (cost_weight x end point to carrot: w * N * dt per
      # m/s of the whole horizon), and the optimizer's control cost charges
      # gamma / vx_std^2 * u * N for the same (faster than the current
      # sequence u is "energy"). They balance at u = w * dt * vx_std^2 /
      # gamma, whatever the horizon: 5 * 0.05 * 0.04 / 0.015 = 0.67 m/s, and
      # a model of this update (1000 samples, warm start, ConstraintCritic)
      # settles lower still, at 0.59 -- 0.50 back when vx_max was 0.60, so
      # MPPI never commanded RPP's 0.60 either. At 0.3 the balance is 1.5
      # m/s, and the same model holds vx_max, 0.80. vx_std rather than gamma
      # (0.008 -> 0.78 in the model) because gamma scales the yaw control
      # cost as well, or PathFollowCritic (7.5 -> 0.77) because that weighs
      # against PathAlignCritic and cuts corners. Unmeasured on the robot:
      # compare cmd_vel's plateau with odom's, which also shows how the gait
      # tracks 0.80 x scale_fwd.
      vx_std: 0.3
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      # Path kept ahead of the robot, measured along it; the path handler
      # also cuts it where it leaves the local costmap, so the window's 2 m
      # half-width caps it on a straight run. This is MPPI's lookahead.
      # 1.5 -> 2.0 (2026-10-20): it has to hold the horizon (1.28 m at
      # vx_max) plus PathFollowCritic's carrot (5 points, 0.5 m on Octo3D's
      # path), which 1.5 clamped to the path's end at cruise. It also has to
      # reach past the largest threshold_to_consider (1.4 m), because the
      # critics see the goal only once this path reaches it
      # (CriticData::goal): shorter, and GoalCritic would start later than
      # its threshold says. Until the same day the critics took this path's
      # last pose for the goal, as Humble does, and at 1.5 a 90 deg corner
      # brought it within 1.4 m mid-path (GoalCritic on, PathFollowCritic
      # off, the corner cut toward it); 2.0 was first raised for that.
      prune_distance: 2.0
      transform_tolerance: 0.2
      # Same reach as RPP's max_robot_pose_search_dist: a path that loops back
      # near itself must not snap to its later leg.
      max_robot_pose_search_dist: 10.0
      # Off: candidates are 1000 x 40 markers a cycle. local_plan (the optimal
      # trajectory, not upstream) is published regardless.
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # No VelocityDeadbandCritic, although the gait controller has a floor
      # (~0.3 m/s, see goal_checker): it penalises |v| below the band *including
      # zero*, so it would also fight stopping and turning in place. MPPI's
      # slow commands did turn out not to move the robot (0.13 m/s, robot01,
      # 2026-10-15); the fix is walk_vx_min / in_place_wz_min above, which
      # leave zero alone.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      # threshold_to_consider equals goal_checker.xy_goal_tolerance on purpose
      # (lowered 0.5 -> 0.3 -> 0.15, 2026-10-14), so the robot turns to the goal
      # heading only once the position is already accepted (stateful: true
      # latches it). At 0.5 it started turning while still short; on robot01
      # it stopped 0.29 m out facing the goal yaw, with the goal ~158 deg
      # behind it. vx_min 0 rules out reversing, the turn back (~4.2 s at
      # wz_max) outlasts the 2 s horizon, and turning away from the goal yaw
      # costs here, so standing still scored best. MPPI held a -0.115 rad/s
      # command under the turn floor until the progress checker aborted.
      # Since final_rotation_wz (2026-10-15) the optimizer no longer runs
      # inside that distance, so this critic scores nothing while
      # final_rotation_wz is on; it is the turn again when that is set to 0.
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.15
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # The obstacle term. consider_footprint: the footprint is a 0.70 x 0.44
      # rectangle, and a centre-point check would let a corner clip a blocker
      # the radius test calls clear. It reads inflation_radius /
      # cost_scaling_factor from the local costmap's inflation_layer below
      # (first InflationLayer when inflation_layer_name is empty), so those
      # are not repeated here.
      CostCritic:
        enabled: true
        cost_power: 1
        # 3.81, upstream's: obstacle avoidance over narrow doors (decided
        # 2026-10-21). It was 0.5 for a day (2026-10-20), with the inflation
        # band at cost_scaling_factor 20 (see there), because MPPI stopped in
        # front of narrow doors. Off a path that is blocked, CostCritic is the
        # only critic that pays a candidate to stop and PathFollowCritic the
        # only one that pays it to go on, worth 5 x the distance of the end
        # point to its carrot -- ~9 for standing still. CostCritic charges
        # weight x the mean inflation cost over the horizon, so a door whose
        # centre line is in the band cannot be passed outside it: at 3.81 and
        # 0.40 / 3.0 crossing a 0.7 m door cost ~260, the cheapest candidate
        # stopped at the band's edge ~0.3 m before the door, and a
        # constant-speed model of the two critics stalled at every door under
        # 0.9 m. At 0.5 a door's centre line was nearly free -- and so was a
        # blocker's flank: a horizon of critical cells scored 0.59 against
        # PathAlignCritic's ~4 for a 0.3 m sidestep, so MPPI learned of a
        # blocker only when a candidate collided, steered late, and passed
        # with the footprint padding (1 cm) to spare. To a cost of distance
        # alone a door's jamb and a blocker passed at the same distance look
        # the same, so one of the two had to give. The price of this one:
        # MPPI stalls before doors and corridors narrower than ~1.0 m (0.9 m
        # at the old 0.40 radius; extrapolated from that model, not rerun),
        # and a route through one needs FollowPathRPP (move.xml's
        # controller_id), which checks LETHAL only. Collisions are
        # collision_cost's (1e6 x weight / time_steps, decisive) on the
        # footprint either way. Unmeasured on the robot.
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        # The share of invalid path points in reach above which this critic
        # stands down. Since 2026-10-21 a point is invalid when the footprint
        # standing on it along the path touches LETHAL (utils.hpp's
        # findPathCosts), not only when its centre cell is INSCRIBED, so a
        # blocker beside the path stands it down as one on the path does.
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        # Counted in path POINTS, not metres: the critic scores nothing until
        # some candidate's end point projects this many points along the
        # pruned path. Upstream's 20 assumes a 0.05 m path (Smac at costmap
        # resolution) and a 2.8 s horizon. Here the horizon was 2.0 s (1.2 m at
        # 0.60; 1.6 s since vx_max 0.80) and Octo3D resamples at 0.1 m (its
        # interpolation_resolution), so the furthest candidate reached ~12
        # points -- at 20 this critic never ran on a 3D map, and on a 2D
        # map only at cruise on straight segments (a diagonal's 0.07 m spacing
        # puts 20 points at 1.41 m, past the horizon). Tracking was left to
        # PathFollowCritic's end-point carrot, which pays a cut corner as well
        # as a tracked one. 5 (2026-10-20): 0.5 m on a 3D map, which a
        # candidate averaging walk_vx_min over the 1.6 s horizon (0.48 m) all
        # but reaches -- the furthest of 1000 noisy candidates gets there;
        # 0.25 m on a 2D map. Unmeasured.
        offset_from_furthest: 5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

    # FollowPath until 2026-10; unchanged since, apart from the id.
    FollowPathRPP:
      plugin: "syncai_controller::RegulatedPurePursuitController"
      # Lowered from 0.8. At 0.8 the robot actually made 0.62 m/s (ratio 0.78),
      # so pure pursuit was computing its arcs (w = v * curvature) for a speed
      # a quarter higher than reality. driver_manager's scale_fwd now corrects
      # the gain, but the gait controller's response falls off as the command
      # grows and nobody has swept it properly yet, so keep the command in the
      # range that has been measured. Raise this only together with a fresh
      # scale_fwd measurement at the new speed — the two are one calibration.
      desired_linear_vel: 0.60
      lookahead_dist: 0.6
      # Raised from 0.3: pure pursuit steering gain scales with 1/lookahead^2,
      # so the short low-speed lookahead made startup oscillate (weaving until
      # the velocity-scaled lookahead grew with speed).
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Raised to 0.3 to keep the robot from crawling while tracking a path.
      # Caveat (this floor was previously lowered to 0.1 for this reason): a
      # value this high overrides curvature regulation right after
      # rotate-to-heading exits, where the arc is sharpest, so watch for
      # corner-cutting / weaving on tight turns. Now that desired_linear_vel is
      # 0.60 this floor is half the top speed, so curvature regulation has only
      # a 0.30-0.60 band to work in — lower it before raising it if corner
      # cutting persists.
      regulated_linear_scaling_min_speed: 0.3
      use_rotate_to_heading: true
      # Lowered from 0.785 (45 deg): exiting rotation that far off-heading made
      # the robot drive away from the path and trigger another rotation.
      # 0.25 rad (~14 deg) hands over to path tracking nearly aligned.
      rotate_to_heading_min_angle: 0.25
      # Lowered from 1.3, where the robot only delivered 0.695 rad/s (ratio
      # 0.53). The controller therefore believed every in-place turn was
      # finishing about twice as fast as it was, exited rotate-to-heading still
      # off-heading, and had to re-enter — the weave. At 0.65 with
      # scale_turn_* the measured rate lands within ~20% of the command, which
      # is the whole point: rotate-to-heading's exit test only means something
      # if the commanded rate is the real one.
      rotate_to_heading_angular_vel: 0.65
      # Not upstream: the in-place turn floor (2026-10-14), FollowPath's
      # in_place_wz_min for the rotate-to-heading branch -- same value, pre-scale
      # (0.21 for a day, see there); change them together. Lifts
      # the acceleration ramp's first cycle (0.16) and the last hundredths of
      # a radian of the stop cap, the two places a rotation dips under it.
      # 0 disables it.
      rotate_to_heading_min_angular_vel: 0.3
      max_angular_accel: 3.2
      # No velocity smoother in this stack: the controller clamps linear
      # acceleration itself (0 -> 0.60 m/s ramps over ~0.6 s).
      max_linear_accel: 1.0
      allow_reversing: false
      use_interpolation: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_robot_pose_search_dist: 10.0

    # RPP 3D (2026-10, feature/octomap-planner-3d): FollowPathRPP plus 3D
    # matching of a path with heights (OctomapPlanner3D) and the stair mode
    # below -- a copy of the 2D plugin, not a subclass, so FollowPathRPP is
    # exactly dev's. Every value down to max_robot_pose_search_dist is
    # FollowPathRPP's and is one calibration with it (and with
    # driver_manager's scales): change them together -- except
    # desired_linear_vel, 0.8 here against 0.60 there since 2026-10-19 (see
    # its note). A path without heights (all z = 0, any 2D planner) is
    # followed as FollowPathRPP follows it, at that speed, stair mode never
    # engaging. Not named by any tree since 2026-10-20 (FollowPath climbs
    # stairs too); kept loaded as the A/B on a 3D map.
    FollowPathRPP3D:
      plugin: "syncai_controller::RegulatedPurePursuitController3D"
      # Lowered from 0.8. At 0.8 the robot actually made 0.62 m/s (ratio 0.78),
      # so pure pursuit was computing its arcs (w = v * curvature) for a speed
      # a quarter higher than reality. driver_manager's scale_fwd now corrects
      # the gain, but the gait controller's response falls off as the command
      # grows and nobody has swept it properly yet, so keep the command in the
      # range that has been measured. Raise this only together with a fresh
      # scale_fwd measurement at the new speed — the two are one calibration.
      # RPP 3D only: raised 0.60 -> 0.8 on 2026-10-19, asked for after the
      # stair tests (1.0 was asked first and taken back the same day) --
      # FollowPathRPP above keeps dev's 0.60. NOT yet measured on the robot:
      # with scale_fwd 1.40 the gait is commanded 1.12 m/s, past anything
      # swept, so check the real speed against cmd_vel (and the weaving the
      # regulated_linear_scaling_min_speed note warns about) on the first
      # run. At 0.8 m/s the velocity-scaled lookahead (lookahead_time 1.5)
      # just reaches max_lookahead_dist 1.2.
      desired_linear_vel: 0.8
      lookahead_dist: 0.6
      # Raised from 0.3: pure pursuit steering gain scales with 1/lookahead^2,
      # so the short low-speed lookahead made startup oscillate (weaving until
      # the velocity-scaled lookahead grew with speed).
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Raised to 0.3 to keep the robot from crawling while tracking a path.
      # Caveat (this floor was previously lowered to 0.1 for this reason): a
      # value this high overrides curvature regulation right after
      # rotate-to-heading exits, where the arc is sharpest, so watch for
      # corner-cutting / weaving on tight turns. Now that desired_linear_vel is
      # 0.60 this floor is half the top speed, so curvature regulation has only
      # a 0.30-0.60 band to work in — lower it before raising it if corner
      # cutting persists.
      regulated_linear_scaling_min_speed: 0.3
      use_rotate_to_heading: true
      # Lowered from 0.785 (45 deg): exiting rotation that far off-heading made
      # the robot drive away from the path and trigger another rotation.
      # 0.25 rad (~14 deg) hands over to path tracking nearly aligned.
      rotate_to_heading_min_angle: 0.25
      # Lowered from 1.3, where the robot only delivered 0.695 rad/s (ratio
      # 0.53). The controller therefore believed every in-place turn was
      # finishing about twice as fast as it was, exited rotate-to-heading still
      # off-heading, and had to re-enter — the weave. At 0.65 with
      # scale_turn_* the measured rate lands within ~20% of the command, which
      # is the whole point: rotate-to-heading's exit test only means something
      # if the commanded rate is the real one.
      rotate_to_heading_angular_vel: 0.65
      # Not upstream: the in-place turn floor (2026-10-14), FollowPath's
      # in_place_wz_min for the rotate-to-heading branch -- same value, pre-scale
      # (0.21 for a day, see there); change them together. Lifts
      # the acceleration ramp's first cycle (0.16) and the last hundredths of
      # a radian of the stop cap, the two places a rotation dips under it.
      # 0 disables it.
      rotate_to_heading_min_angular_vel: 0.3
      max_angular_accel: 3.2
      # No velocity smoother in this stack: the controller clamps linear
      # acceleration itself (0 -> 0.60 m/s ramps over ~0.6 s).
      max_linear_accel: 1.0
      allow_reversing: false
      use_interpolation: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_robot_pose_search_dist: 10.0

      # Stair mode (2026-10; README "Stairs"; the same block under FollowPath
      # since 2026-10-20, where the climb is MPPI's bypass). On a path with heights
      # (OctomapPlanner3D) a stretch rising stair_min_rise within
      # stair_enter_dist ahead is a stair: the robot stops, set_policy_mode
      # switches the gait controller to stair_policy_mode, it stands
      # stair_policy_settle_time, and climbs at stair_linear_vel with a
      # stair_lookahead_dist carrot. It leaves once the path from
      # stair_exit_behind_dist back to stair_exit_ahead_dist ahead rises less
      # than stair_min_rise, stopping again to switch the policy back. The
      # stair_enter_dist window is looked for out to the hold's own stopping
      # distance (v^2 / 2 max_linear_accel, 0.32 m from 0.8; 2026-10-20), so
      # the hold starts that much earlier and the 1 m window's margin before
      # the rise is not spent braking. Windows from dp1f_1012's Octo3D paths: level paths rise at most
      # 0.10-0.20 m within 1 m, the 2F ramp 0.47 m (so it is climbed in stair
      # mode too, 1.9 m of it), the spiral stair 0.68 m; with these values
      # each stair path enters stair mode once, and its landings keep it.
      use_stair_mode: true
      stair_min_rise: 0.3
      stair_enter_dist: 1.0
      stair_exit_behind_dist: 0.8
      # 2.5 -> 3.5 (2026-10-21): a switchback's landing is laid as out 0.5 m,
      # across (the flights' axes 1.5-1.9 m apart on dp), in 0.5 m -- up to
      # ~2.8 m of level path between two flights, and at 2.5 the window from
      # the first corner read level (0.29 m of rise) and left stair mode on
      # the landing. HIMLOCO turns in place and climbs the whole well; the
      # policy goes back only on the top floor.
      stair_exit_ahead_dist: 3.5
      # The 0.4 m carrot keeps RPP's collision projection (carrot + 0.36 m of
      # footprint) within ~0.76 m, where a 0.17 / 0.28 m stair has risen
      # ~0.46 m -- under the local costmap's 0.58 m obstacle floor, so the
      # treads ahead do not read as a wall while the stairwell's walls do.
      # The projection runs min(v x max_allowed_time_to_collision_up_to_carrot
      # (1 s), carrot), so from 0.4 m/s up the carrot is the bound and the
      # speed does not move it. Raised 0.2 -> 0.5 on 2026-10-19: the stair
      # tests found the climb far too slow. NOT yet measured on the robot --
      # whether HIMLOCO tracks 0.5 (x scale_fwd 1.40 = 0.7 m/s commanded) on
      # a spiral stair is open.
      stair_linear_vel: 0.5
      stair_lookahead_dist: 0.4
      # The landing corners (2026-10-21): the same rule as FollowPath's, with
      # rotate_to_heading_min_angle to start the turn and the clamp's ramp
      # (v^2 / 2a) for the stop before the corner.
      stair_turn_angle: 0.785
      stair_turn_dist: 0.15
      stair_turn_done_angle: 0.087
      # Down backwards (2026-10-21): the same rule as FollowPath's -- the
      # tail is held on the path (shouldRotateToPath() measures from it), the
      # speed's sign is reversed, and the robot turns round to the path in
      # the hold at the bottom before the policy goes back.
      stair_descend_backwards: true
      # 3 s standing after each policy switch, in and out (asked for on
      # 2026-10-14; nothing measured yet). Two stops per flight, so ~6 s plus
      # braking added to a stair path -- far inside the progress checker's 30 s.
      stair_policy_settle_time: 3.0
      # The gait controller's RL policy index (syncai_common
      # RobotLowLevelMode.msg: 0 PPO, 1 HIMLOCO, 2 CHAMP, 3 ISSAC). HIMLOCO
      # for stairs. flat_policy_mode -1 = go back to the policy the controller
      # reported on <robot_id>/mode before the switch; with no report heard,
      # the robot stays on HIMLOCO. stair_policy_mode -1 = never switch (speed
      # and carrot only, no stops).
      stair_policy_mode: 1
      flat_policy_mode: -1

    # The last metre onto the dock (2026-10): dock_to_pose's default
    # controller, driven by dock.xml. One pose, no path, NO COSTMAP -- this
    # plugin never reads cost data and never checks for collisions (the dock
    # is itself a lethal cell in the local costmap, so any footprint test
    # refuses the last half metre of every dock); obstacle avoidance is
    # dock.xml's staging leg, which ends the robot ~1 m in front of the dock
    # in known-clear space. Park & Kuipers' smooth control law (nav2's
    # graceful / opennav_docking controller), ported from Humble.
    #
    # Starting values, not a tuning: nothing below has driven the robot yet.
    # Every velocity is PRE-SCALE, like RPP's and MPPI's: driver_manager
    # multiplies the command by scale_fwd (1.40) after this node, in MPC mode
    # as in RL -- if scale_fwd changes, re-measure the floor.
    Docking:
      plugin: "syncai_controller::DockingController"
      # Control-law gains, opennav_docking's defaults (graceful's path-following
      # beta 0.2 is too permissive for a dock: it keeps speed on a tight arc).
      # k_phi: how hard the dock HEADING pulls the curve; k_delta: how fast the
      # robot's own heading converges to the curve; beta / lambda: how much
      # speed drops with curvature.
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      # THE GAIT'S WALKING FLOOR, not a comfort value: a forward command below
      # it does not make the quadruped walk slowly, it makes it stand. Applied
      # AFTER the law's angular bound, so the controller executes a wider arc
      # rather than a command the gait ignores. Measured under MPC on
      # 2026-10-14: 0.05 m/s is the slowest straight-line command the gait
      # still walks at (pre-scale, the cmd_vel this node publishes). RL's floor
      # is ~0.3 m/s (see goal_checker), which is why dock.xml / undock.xml
      # switch to MPC before this controller drives. Re-measure if
      # driver_manager's scale_fwd changes.
      v_linear_min: 0.05
      # Below the 0.60 calibration point so the gait tracks it, above the floor
      # so the slowdown has a band to work in.
      v_linear_max: 0.40
      # The stack's calibrated in-place rate (FollowPathRPP's
      # rotate_to_heading_angular_vel, MPPI's wz_max): one calibration with
      # driver_manager's scale_turn_*, change them together.
      v_angular_max: 0.65
      # Not upstream. Floor for both in-place rotation branches: upstream's
      # proportional rotate-to-target is 0.5 * angle * v_angular_max, i.e.
      # 0.016 rad/s at the 0.05 rad error of the final alignment -- nothing a
      # gait turns at. Raised 0.03 -> 0.15 on 2026-10-15 (pre-scale). The 0.03
      # was measured under MPC on 2026-10-14, but a sustained in-place turn
      # does not bear it out: in both robot01 undocks the final rotation
      # tapered to 0.087-0.094 rad/s and the yaw froze there for 30 s until
      # the progress checker aborted, while 0.10-0.16 still turned. 0.15 sits
      # above everything seen to stall; the real floor is somewhere in
      # 0.09-0.15 and unmeasured -- step a held in-place wz under MPC (0.08,
      # 0.10, 0.12, 0.15) and read /odom before lowering it. The cost of the
      # higher floor is overshoot, which dock_goal_checker's 0.1 rad yaw window
      # absorbs (see there).
      v_angular_min: 0.15
      # v = v_linear_max * r / slowdown_radius inside this radius. With the
      # MPC floor at 0.05 and the cap at 0.40 it acts over almost the whole
      # radius (down to 6 cm out), so the robot arrives at the floor speed
      # instead of hitting the xy latch at 0.30 as it would under RL.
      slowdown_radius: 0.5
      # RPP's / MPPI's values; there is no velocity smoother in the stack. The
      # clamp baselines on the previous COMMAND (gait sway in the odom twist),
      # and the stop into the final rotation is deliberately NOT ramped. At
      # the MPC floor a ramp-down is a single cycle anyway; the exception is
      # kept for a v_linear_min raised again (RL's 0.30 would be six cycles,
      # 4.5 cm of travel after the xy latch -- the whole 5 cm window).
      max_linear_accel: 1.0
      max_angular_accel: 3.2
      # Rotate in place first when the dock is further off the nose than
      # this. The law converges from any pose, but the wide-bearing part of
      # that convergence is the arc the gait floor executes worst, so it is
      # cheaper to turn first. RPP's lesson (rotate_to_heading_min_angle 0.785
      # -> 0.25) is the first knob if the robot "drives away then re-rotates".
      initial_rotation: true
      initial_rotation_min_angle: 0.75
      # Once inside dock_goal_checker's xy tolerance, stop and turn to the
      # dock yaw; the gain is on the angle, floored by v_angular_min.
      final_rotation: true
      rotation_scaling_factor: 0.5
      # Forward only: scale_back is an unmeasured 1.0 and initial_rotation
      # cannot coexist with reversing (it turns the nose toward the target).
      # Undocking below is the reversing instance.
      allow_backward: false
      # Only for the one-off transform in setPlan() when the path arrives in
      # a frame other than odom (dock_to_pose always hands odom, so it is for
      # driving this plugin through follow_path with a map path).
      transform_tolerance: 0.2
      # The operator console draws the approach from this: the law integrated
      # to the dock, in docking_plan_frame (map, un-namespaced like the
      # planner's), on docking_plan at 2 Hz. Also the TF tolerance of that
      # one map <- odom lookup per message. controller_server clears it when
      # the dock goal ends. Off on Undocking: backing out is not drawn.
      publish_docking_plan: true
      docking_plan_frame: "map"

    # The same plugin, configured to back OUT of the dock to the staging pose
    # (undock.xml). Direction is this configuration, not a goal field: the
    # DockToPose action has no `backward` flag because the controller plugin
    # interface carries a path and nothing else, and nav2's convention is one
    # configuration, one controller id. With allow_backward the law reverses
    # by itself when the target is behind the robot -- the staging pose sits
    # 1 m behind with the robot's own yaw, so it backs out straight; an
    # overshoot puts the target ahead and the law drives forward to fix it.
    # Everything not repeated here is the Docking value.
    Undocking:
      plugin: "syncai_controller::DockingController"
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      # Reverse floor: the MPC forward floor (0.05, measured 2026-10-14) is
      # assumed to hold backwards too -- the reverse was not measured on its
      # own, and driver_manager's scale_back is an unmeasured 1.0 (so unlike
      # forward, what the gait receives here is the command itself). The cap
      # stays at 0.30: blind and backwards, there is no reason to back out
      # faster than the old single-speed placeholder.
      v_linear_min: 0.05
      v_linear_max: 0.30
      v_angular_max: 0.65
      # Docking's floor (see there): this instance is where it stalled.
      v_angular_min: 0.15
      slowdown_radius: 0.5
      max_linear_accel: 1.0
      max_angular_accel: 3.2
      # Off, by the upstream rule: an initial rotation turns the nose toward
      # a target that is meant to stay behind. Also the point of backing out
      # rather than turning on the dock -- no in-place turn on the contacts.
      initial_rotation: false
      initial_rotation_min_angle: 0.75
      # On: end facing the dock (the staging pose's yaw), so the MOVE that
      # follows starts from a known heading.
      final_rotation: true
      rotation_scaling_factor: 0.5
      allow_backward: true
      transform_tolerance: 0.2

# The local costmap is an internal node created by controller_server
# (constructed as a plain node named "local_costmap").
/**/local_costmap:
  ros__parameters:
    use_sim_time: false

    # Frames (overridden by the launch file with <robot_id>/ prefix)
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 5.0
    publish_frequency: 2.0

    # Fixed-size rolling window centered on the robot. 3 -> 4 m for MPPI
    # (2026-10): its 2.0 s horizon (1.2 m at full speed) plus the footprint
    # has to fit inside the 2 m half-width, because a rolled-out footprint
    # crossing the costmap edge reads as LETHAL in MPPI's CostCritic. Still inside the sensors'
    # obstacle_max_range (2.5 m), so the extra ring is observed, not blank.
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05

    # Robot footprint: rectangular chassis half-extents 0.35 x 0.22 — the SAME
    # rectangle as the global_costmap in planner_server_params.yaml; change
    # both or neither. (Until 2026-10 this one was still the older 0.28 x 0.20
    # after the global one grew.)
    #
    # The padding differs on purpose: 0.01 here vs 0.03 on the global costmap.
    # The planner's is_path_valid runs the same perimeter-on-LETHAL test RPP
    # runs here (2026-10), with the global padding; the 0.02 m gap is what
    # makes that test the stricter of the two, so a path it passes is one RPP
    # will drive, and a path RPP would refuse is replanned before RPP meets
    # it. The ordering holds only between those two perimeter tests. Until
    # 2026-10 the global side tested the centre cell alone and this comment
    # said the gap kept "the planner the conservative side" -- it did not:
    # the centre test bounds the centre's distance to lethal (0.25 m), not
    # the corners' (0.455 m), so RPP refused paths the planner had passed and
    # nothing replanned. The gap absorbs ~3 degrees of heading error, not the
    # 14 degrees RPP tracks with; is_path_valid.heading_margin covers that.
    # Never raise this padding to or above the global one.
    footprint: "[[0.35,0.22],[0.35,-0.22],[-0.35,-0.22],[-0.35,0.22]]"
    footprint_padding: 0.01

    # Layer stack -- order matters: sensor (mark) -> inflation. Two sensor
    # layers are loaded and exactly ONE runs, picked per map (2026-10-20):
    # obstacle_layer on a 2D map (dev's local costmap, unchanged), terrain_layer
    # on a 3D one. Each has a map_type ("2d" / "3d") read against the
    # planner's latched planner_server/Octo3D/map_available -- the signal the
    # task_runner picks move.xml / move_3d.xml by, so the tree and the costmap
    # switch together, and a map switch over Octo3D/load_map switches the
    # layer with no restart (syncai_costmap_2d/map_type_gate.hpp). Never both
    # at once: they disagree on a ramp (free in the terrain layer, a wall in
    # the obstacle layer's band) and the max of the two is the wall. The map
    # reads 2D until the planner says otherwise, as it does for the
    # task_runner. MPPI (FollowPath) is the controller on both.
    plugins: ["obstacle_layer", "terrain_layer", "inflation_layer"]

    # TerrainLayer (2026-10-20, 3D maps only; syncai_costmap_2d/terrain_grid.hpp
    # has the design): the lidar cloud judged against the ground under each cell with
    # OctomapPlanner3D's own rules -- the four geometry values below are
    # SurfaceMapParams' (planner_server_params.yaml, Octo3D), one calibration
    # of the robot's legs; change them together. What it fixes on a 3D map:
    # the obstacle layer's band started 0.58 m above the robot's ground, so a
    # box, a cart's base, a kerb's wall, a drop-off and a stair tread were all
    # invisible to it, and a ramp was a wall after a metre. Here a return is
    # an obstacle only from min_obstacle_height above the floor *at its own
    # cell*; a floor that changes height is judged by the step rule (a riser
    # is fine, a ledge or a drop is not) and the slope rule (a ramp is fine, a
    # flight is not). A stair is lethal here and nothing opens it: the stair
    # mode (FollowPath's / FollowPathRPP3D's) climbs a flight without reading
    # the costmap -- no obstacle avoidance on stairs, by decision.
    terrain_layer:
      plugin: "syncai_costmap_2d::TerrainLayer"
      enabled: true
      map_type: "3d"
      # Relative: /<robot_id>/planner_server/Octo3D/map_available. Same
      # value as the task_runner's map_3d_topic; change them together.
      map_3d_topic: planner_server/Octo3D/map_available
      footprint_clearing_enabled: true
      # Relative name: /<robot_id>/pointlio/body_cloud. The cloud's own frame
      # (pointlio_body, the lidar) is the robot's height reference: its z
      # minus sensor_height is the ground under the robot (lidar_height
      # elsewhere; same 0.481).
      topic: pointlio/body_cloud
      sensor_height: 0.481
      # Returns kept: within max_range of the lidar in the plane (the window
      # is 2.83 m to its corner) and within [min_rel_z, max_rel_z] of the
      # robot's ground -- a drop one floor down is in, the ceiling is out.
      max_range: 3.0
      min_rel_z: -1.5
      max_rel_z: 1.5
      # Relative name: /<robot_id>/plan, the planner's last path (republished
      # at plan_republish_rate, 1 Hz, with Octo3D's heights; emptied on a
      # cancel). Its poses seed the reach rule below; a level path seeds
      # nothing.
      plan_topic: plan
      # Memory. The MID360's -7 deg lower FOV never sees the floor within
      # ~3.9 m of the robot: the floor under and ahead of it was seen 5-13 s
      # ago at walking speed, from further off, so a cell's ground comes from
      # the newest 24 returns of 10 s; an obstacle is a return of the last 2 s
      # (CMU terrain_analysis's decayTime), which is how a person who walks
      # on is gone without raytracing. A cell with under 6 returns in its 3x3
      # neighbourhood borrows the robot's own ground height: right on a level
      # floor, and what keeps a low box on never-seen floor an obstacle (its
      # own returns are then in the band). Ground = the 0.25 quantile of the
      # neighbourhood, capped at its lowest return + 0.15 (CMU's quantileZ /
      # maxGroundLift), so a wall's or a box's returns cannot lift the ground
      # off the floor they stand on once the floor has been seen.
      max_samples_per_cell: 24
      ground_memory: 10.0
      obstacle_memory: 2.0
      min_ground_samples: 6
      ground_quantile: 0.25
      max_ground_lift: 0.15
      # The geometry rules (= Octo3D's SurfaceMapParams). robot_radius is the
      # disc the slope is fitted under (the inscribed radius); a return
      # between min_obstacle_height and body_clearance above its cell's
      # ground is an obstacle (0.1: a kerb's riser, a doormat and the
      # quantile's noise pass, the step rule judges kerbs); 8-neighbours
      # whose ground differs by more than max_step_height make a cell lethal
      # (a wall foot, a ledge, a drop-off); the plane under the disc steeper
      # than max_slope_deg does too, judged only when the disc spans more
      # than a step (a level floor with a kerb is not fitted) and when at
      # least slope_min_known of it has a ground estimate. A surface the
      # robot cannot reach from its own cell over such steps (an island: a
      # box top, a table, a platform seen without the floor under it) is
      # lethal too; the path's heights seed that reach, so a ramp the
      # lidar has not looked at the foot of is still floor on a 3D map.
      robot_radius: 0.25
      min_obstacle_height: 0.1
      body_clearance: 0.6
      max_step_height: 0.17
      max_slope_deg: 20.0
      slope_min_known: 0.5

    # dev's local obstacle source, unchanged but for map_type (2026-10-20):
    # it runs on a 2D map and is off on a 3D one, where terrain_layer runs.
    obstacle_layer:
      plugin: "syncai_costmap_2d::ObstacleLayer"
      enabled: true
      map_type: "2d"
      map_3d_topic: planner_server/Octo3D/map_available
      footprint_clearing_enabled: true
      # Layer-wide cap, applied after each source's own band. For the
      # pointcloud source (height_reference: sensor) it reads as height above
      # the robot's ground too, so it must stay >= that source's 1.98.
      max_obstacle_height: 2.0
      combination_method: 1            # 0=Overwrite, 1=Maximum
      observation_sources: scan pointcloud
      scan:
        # Merged 360deg scan from ros2_laser_scan_merger (-> /<robot_id>/scan);
        # absent on the real 3D stack, so this source simply stays silent.
        topic: scan
        # TF frame (overridden by the launch file with <robot_id>/ prefix)
        sensor_frame: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        inf_is_valid: false

      # 3D LiDAR obstacle source: Point-LIO's per-scan body cloud — the only
      # live source on the real robot. Mirrors the global costmap's pointcloud
      # source in planner_server_params.yaml.
      pointcloud:
        # Relative name: resolves to /<robot_id>/pointlio/body_cloud in the
        # robot_id-namespaced launch.
        topic: pointlio/body_cloud
        # Leave sensor_frame empty on purpose: the observation buffer then uses
        # the cloud's own header frame_id (<robot_id>/pointlio_body, Point-LIO's
        # body_frame) as the raytrace origin, so this source needs no per-robot
        # launch-file frame override. The TF chain resolves through map ->
        # <robot_id>/pointlio_odom (localizer) and map -> odom (lio_bridge),
        # i.e. only after relocalize.
        sensor_frame: ""
        data_type: "PointCloud2"
        marking: true
        clearing: true
        # Heights from the ground under the robot, not from odom's z = 0
        # (height_reference, 2026-10; ObservationBuffer). lio_bridge keeps
        # map -> odom and odom -> base_link planar, so a point's z in odom is
        # its height in the map, whose origin is the lidar where mapping
        # started: the 1F floor is at about -0.48 there, and the old fixed
        # band of 0.1-1.5 -- documented as "above the floor" -- was 0.58-1.98
        # above it on 1F, and above everything on 2F (~5.5 m up), where this
        # source saw nothing at all; on a stair it slid past the robot. Now the
        # band rides with the robot: ground = the sensor's (pointlio_body's) z
        # minus sensor_height, lidar_height in planner_server_params.yaml.
        # The numbers below are that same 0.58-1.98 above the floor, i.e. what
        # 1F has always actually run with, so 1F does not change; whether the
        # local costmap should see lower things (the 0.1 the old comment meant:
        # boxes, low carts) is a separate decision -- it would also mark ramps
        # and kerbs the planner accepts, and MPPI would steer round them.
        height_reference: sensor
        sensor_height: 0.481
        min_obstacle_height: 0.58
        max_obstacle_height: 1.98
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0

    # Read by MPPI's CostCritic (and nothing else here: RPP checks LETHAL
    # only, its cost-regulated scaling is off, docking reads no costmap).
    # inflation_radius 0.45 (0.4 until 2026-10-20): at least the footprint's
    # circumscribed radius (0.427 with the padding). CostCritic checks the
    # footprint only where the centre's cell has a cost, so at 0.4 a centre
    # 0.40-0.43 m from an obstacle read 0 and a corner could clip it
    # unchecked. Kept when cost_scaling_factor went back, because that hole
    # has nothing to do with doors.
    # cost_scaling_factor 3.0: cost 204 at 0.30 m, 176 at 0.35, 151 at 0.40,
    # 130 at 0.45, so a blocker's flank costs as soon as the robot's centre
    # is within 0.45 m of it -- obstacle avoidance over narrow doors
    # (CostCritic, 2026-10-21). It was 20.0 for a day (2026-10-20: 62 / 23 / 8
    # at 0.30 / 0.35 / 0.40, nearly free at a 0.7 m door's centre line), which
    # left MPPI nothing to steer by until a candidate collided.
    inflation_layer:
      plugin: "syncai_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.45
      cost_scaling_factor: 3.0
