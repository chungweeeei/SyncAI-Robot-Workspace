# Parameters for the syncai_controller "controller_server" node and its
# internal local costmap node. The /**/ wildcard keys match the node names
# in any namespace, so the same file works with the launch `namespace`
# argument (default robot01). Topic values below are RELATIVE names — they
# get the namespace prefix automatically (e.g. scan_front ->
# /robot01/scan_front). TF frame names are NOT namespaced by ROS, so they
# keep their explicit robot01/ prefix.
/**/controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    speed_limit_topic: "speed_limit"
    publish_zero_velocity: true

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "syncai_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "syncai_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "syncai_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.26
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      allow_reversing: false
      use_interpolation: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      max_robot_pose_search_dist: 10.0

# The local costmap is an internal node created by controller_server
# (constructed as a plain node named "local_costmap").
/**/local_costmap:
  ros__parameters:
    use_sim_time: true

    # Frames
    global_frame: robot01/odom
    robot_base_frame: robot01/base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 5.0
    publish_frequency: 2.0

    # Fixed-size rolling window centered on the robot
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05

    # Robot footprint (circular)
    robot_radius: 0.22
    footprint_padding: 0.01

    # Layer stack — order matters: obstacle(mark/clear) -> inflation
    plugins: ["obstacle_layer", "inflation_layer"]

    obstacle_layer:
      plugin: "syncai_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      combination_method: 1            # 0=Overwrite, 1=Maximum
      observation_sources: scan
      scan:
        # Relative topic: resolves to /<namespace>/scan_front
        topic: scan_front
        # TF frame (not affected by the node namespace)
        sensor_frame: robot01/scan_front
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        inf_is_valid: false

    inflation_layer:
      plugin: "syncai_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
