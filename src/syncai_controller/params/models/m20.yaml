# The Lynx M20's body and gait, over
# src/syncai_controller/params/controller_server_params.yaml: loaded after it by
# controller_server.launch.py when the INI's [system] robot_model is m20
# (config/models/README.md has the layering).
#
# FIRST VALUES (2026-11-25), for the first navigation test on flat ground.
# Nothing here has driven the robot yet.
#
# THE BODY, which every size below is derived from: M20.urdf's collision
# geometry and meshes, posed with forward kinematics at the standing joint
# reading of robot01, 2026-11-24 (syncai_m20_joint_state's conversion.rs,
# STANDING), in base_link (the body's centre):
#
#   length  x -0.407 .. +0.406   the wheels' rims (centres at +/-0.31, r 0.09);
#                                the body's shell itself is +/-0.41 (the mesh,
#                                DEEP Robotics' 820 mm)
#   width   y -0.236 .. +0.218   the legs' outer faces; the hips roll the
#                                wheels in under the body (hipx 0.04-0.10 rad),
#                                so the stance sets it: 0.254 with hipx at 0
#   height  the shell's top is 0.085 above base_link and the wheels' bottoms
#           0.592 below it, 0.68 in all; measured on the floor in the cloud,
#           base_link stood 0.55-0.58 up (2026-11-24), so 0.64-0.67
#
# A different stance (the gait's height, the hips' roll) changes all three.
#
# Stairs ON for the first stair tests (2026-11-25), with the planner's stair
# links (syncai_global_planner's m20.yaml): syncai_driver_manager's m20 protocol
# switches the gait on set_policy_mode since its 98b30f1 (0 = Basic 0x1001,
# 1 = Stairs 0x1003), so the stair mode below stops before a flight, switches
# to the stair gait, climbs, and switches back, as on the G23. Nothing of it
# has run on the M20 yet.
#
# Not here, and still the G23's for an M20: the Charging / ChargeBackOff blocks
# and their goal checkers (charge.xml is the G23's dock and motion keys).

/**/controller_server:
  ros__parameters:
    # Point-LIO's body frame above the ground, m. On the M20 that frame is the
    # vendor's body IMU, 0.0435 m above base_link: measured standing on robot01
    # (2026-11-24, the floor 0.55-0.58 m below the merged cloud's origin), the
    # value syncai_mapping's m20.yaml cleaned this robot's maps with. The URDF
    # at the standing reading says 0.635 (wheel bottoms 0.592 under base_link);
    # the 3 cm between them is the stance or the tyres, unresolved. One number
    # in five files (config/models/model_keys.yaml, `equal`).
    lidar_height: 0.60

    FollowPath:
      # The operator's limits for the first runs (2026-11-25): 1.0 m/s and
      # 1.0 rad/s, as cmd_vel. What the robot does with them is NOT
      # calibrated: syncai_driver_manager's m20.yaml maps cmd_vel to a
      # fraction of the gait's full scale with max_vx 2.0 / max_wz 2.0, both
      # unmeasured guesses, so 1.0 here is half scale of an unknown top speed
      # and the rollouts assume the commanded speed is the real one. Hold a
      # few cmd_vel plateaus against /odom before trusting either, and change
      # these with those (and with FollowPathRPP3D's two below).
      #
      # The robot's pose is also older here than on a G23: the vendor's merged
      # cloud arrives ~133 ms after its stamp and Point-LIO waits up to 120 ms
      # more for the rear lidar (syncai_pointlio's m20.yaml), so the optimizer
      # plans from where the robot was ~0.2 s ago -- 0.2 m at this speed.
      vx_max: 1.0
      wz_max: 1.0
      # DiffDrive, as the G23: the M20's protocol takes a lateral axis
      # (driver_manager's max_vy), but its gain is unmeasured as well.
      motion_model: "DiffDrive"
      # The G23's, unmeasured on the M20: the clamp on the output, there being
      # no velocity smoother. The optimizer does not model it, so from 1.0 m/s
      # the robot needs 0.5 m to stop.
      max_linear_accel: 1.0
      max_angular_accel: 3.2
      # The gait floors: the M20 has them too. The first values (0.1 / 0.1,
      # on the guess that a wheeled base creeps) stalled the robot twice in
      # the first A <-> B runs on robot01 (2026-11-25, map m20_dp2f), read off
      # the vendor's own MotionStatus over its UDP link, not only off /odom:
      #   - in place, MPPI asked wz -0.14 rad/s for 28 s (the in-place turn
      #     onto the path had been refused by the footprint check) and the
      #     robot reported OmegaZ 0.00 throughout, until the progress checker
      #     aborted; 0.65 rad/s turned it at 0.4-0.65;
      #   - 0.13 m from the goal, the direct approach walked at 0.1 m/s for
      #     30 s and the robot stood (0.06 m in 30 s).
      # Raised live to these two, the next 17 runs reached the goal with no
      # stall (15-18 s each for 4.8 m). Where the floor actually is lies
      # somewhere in 0.14-0.4 rad/s and 0.1-0.25 m/s, unmeasured; these are
      # values that worked, as cmd_vel through driver_manager's (unmeasured)
      # max_vx / max_wz 2.0. Still not 0: that would also switch off the
      # direct approach, the approach slowdown and the back-out, which are
      # written on walk_vx_min (controller.cpp). FollowPathRPP3D's
      # min_approach_linear_velocity / rotate_to_heading_min_angular_vel
      # below hold the same two (config/models/README.md, "Gait floors").
      walk_vx_min: 0.25
      in_place_wz_min: 0.4
      # Every in-place turn (onto a new path, onto the goal's heading, the
      # direct approach's turn) runs at this, not at wz_max, so the M20 had
      # been turning at the G23's 0.65 -- 0.4-0.65 rad/s measured, which the
      # operator found sluggish. At 1.0 (= wz_max and FollowPathRPP3D's
      # rotate_to_heading_angular_vel) the vendor's MotionStatus read
      # 0.56-1.19, mostly 0.8-1.0, and an A <-> B run (4.8 m) took 12-15 s
      # instead of 15-18 (robot01, 2026-11-25, 8 runs, all reached). The
      # cost: the long body's centre drifts more while it turns inside the
      # goal window, so the reached xy grew from ~0.07 m on average to
      # 0.10-0.13 (7 of 8 over xy_goal_tolerance's 0.10, accepted because the
      # checker latches xy). Lower this, or give the final turn its own rate,
      # if the goal's position matters more than the time.
      final_rotation_wz: 1.0
      # The cap over a span the planner marks `slow` (a passage narrower than
      # narrow_max_width, a walked gap). On the G23 this equals walk_vx_min
      # because 0.30 is the slowest its gait walks; on the M20 it is a speed
      # for a doorway, kept at the value the G23 has taken doors with. Must
      # stay at or above walk_vx_min, or the floor wins.
      slow_linear_vel: 0.30
      # The lookahead, longer for the M20's 0.82 m body (2026-11-25, the
      # operator's call; unmeasured): the horizon 34 x 0.05 = 1.7 s, the path
      # kept ahead 2.5 m, and PathFollowCritic's carrot 7 points (0.7 m on
      # Octo3D's 0.1 m path) past the furthest rollout. All three are bounded
      # by the local costmap, now 5 x 5 m (below): a rolled-out footprint
      # that leaves the window reads LETHAL, so the horizon has to end inside
      # its 2.5 m half-width -- 1.70 m at vx_max 1.0, plus the padded
      # footprint's nose (0.42 m) and the window's lag (it re-centres at
      # 5 Hz, 0.20 m at 1.0) is 2.32 m, and the 1.70 + 0.70 m carrot is
      # inside prune_distance. 36 would reach 2.42 m, 8 cm from the edge. On
      # the 4 x 4 m window this was 26 / 2.0 / 5 (1.92 m of its 2 m); the
      # window, the horizon and the prune distance change together. The cost
      # is CPU: the terrain layer's grid is 1.56x and the optimizer's work
      # grows with time_steps -- watch for "Control loop missed its desired
      # rate" in the controller log, already seen now and then at 26 on the
      # 4 m window.
      time_steps: 34
      prune_distance: 2.5
      PathFollowCritic:
        offset_from_furthest: 7
      # On for the stair tests (see the header). Startup-only: a change needs
      # a controller_server restart. Both controllers hold one value
      # (model_keys.yaml, `equal`).
      use_stair_mode: true
      # The M20's set_policy_mode indices (driver_manager's
      # gait_param_for_policy): 1 = the Stairs gait, 0 = Basic. The flat one
      # is named rather than left at -1, because -1 means "go back to what
      # `mode` reported before the switch" and the M20's driver publishes no
      # `mode` -- with nothing heard, the robot would stay in the stair gait
      # (stair_mode.hpp).
      stair_policy_mode: 1
      flat_policy_mode: 0
      # Down forwards: the G23 descends backwards because HIMLOCO walks down
      # facing the risers; the M20's stair gait goes down facing forward
      # (the operator, 2026-11-25; unmeasured here). The flag is the test
      # switch: live with
      #   ros2 param set /<robot_id>/controller_server \
      #     FollowPath.stair_descend_backwards true|false
      # read every cycle, so set it while the robot is not on a flight.
      # FollowPathRPP3D's copy below holds the same.
      stair_descend_backwards: false

    goal_checker:
      # 0.1 rad (the G23's 0.2, which is wide for a gait that cannot slow its
      # turn under ~0.45 rad/s; the M20 turns at final_rotation_wz 1.0 and
      # stops within ~0.4 s). Tightened at the operator's request
      # (2026-11-25): accepted headings came in at 0.01-0.09 rad over 8 runs
      # on robot01 (dp_1125, B <-> C). That is NOT where the robot ends up:
      # 2 s later the heading was 0.26-0.42 rad past the goal's, on the far
      # side. The vendor's MotionStatus shows the stop itself is quick
      # (0.8 rad/s -> ~0.25 in 0.17 s -> ~0 by 0.4 s, 0.1-0.15 rad); the rest
      # is the robot pose being ~0.25-0.3 s old (the merged cloud arrives
      # ~133 ms after its stamp and Point-LIO holds up to 120 ms for the rear
      # lidar), so the turn is stopped ~0.2 rad late at this rate. A tighter
      # window does not fix that; the final rotation has to lead the pose
      # (or slow into the heading). Open.
      yaw_goal_tolerance: 0.1

    FollowPathRPP3D:
      # The A/B controller, on FollowPath's numbers: the same limits, the same
      # clamps, the same floors (config/models/README.md, "Values that change
      # together").
      desired_linear_vel: 1.0
      rotate_to_heading_angular_vel: 1.0
      max_linear_accel: 1.0
      max_angular_accel: 3.2
      # = FollowPath's walk_vx_min / in_place_wz_min (see there).
      min_approach_linear_velocity: 0.25
      rotate_to_heading_min_angular_vel: 0.4
      use_stair_mode: true
      stair_policy_mode: 1
      flat_policy_mode: 0
      stair_descend_backwards: false

/**/local_costmap:
  ros__parameters:
    # 5 x 5 m (the G23's 4 x 4) to hold the longer lookahead above
    # (FollowPath's time_steps / prune_distance), a step short of 6 x 6 for
    # the CPU. Its 2.5 m half-width is inside terrain_layer's max_range
    # (3.0 m from the lidar), so the layer sees the whole window but its
    # corners.
    width: 5
    height: 5
    # The standing body's rectangle about base_link (the header's extents):
    # half-length 0.41 (the wheels' rims and the shell's ends), half-width
    # 0.24 (the wider leg, 0.236). The G23's is 0.35 x 0.22: the M20 is 0.12 m
    # longer and about as wide. With footprint_padding 0.01 the inscribed
    # radius is 0.25 and the circumscribed one 0.489.
    footprint: "[[0.41,0.24],[0.41,-0.24],[-0.41,-0.24],[-0.41,0.24]]"

    terrain_layer:
      # = controller_server's lidar_height: the cloud's frame above the ground.
      sensor_height: 0.60
      # The four geometry rules are Octo3D's (syncai_global_planner's
      # m20.yaml has where each comes from); one calibration, two files.
      # robot_radius: the padded footprint's inscribed radius (0.24 + 0.01).
      robot_radius: 0.25
      # The shell's top is 0.64-0.68 m above the ground; 0.7 would leave as
      # little as 2 cm, under the planner's 0.1 m voxel. A return up to this
      # far above its cell's ground is an obstacle, so this is also what the
      # robot is kept from driving under.
      body_clearance: 0.8
      # The operator's figures (2026-11-25): a 0.2 m step, 20 deg as the G23.
      # Not measured on the M20's gait.
      max_step_height: 0.2
      max_slope_deg: 20.0

    inflation_layer:
      # At least the padded footprint's circumscribed radius (0.489):
      # MPPI's CostCritic checks the footprint only where the centre's cell has
      # a cost, so a smaller ring leaves a centre 0.45-0.49 m from an obstacle
      # reading 0 while a corner clips it (the factory file has the G23's
      # case). cost_scaling_factor is left: with it the cost at a given
      # distance is the G23's, on a body 6 cm longer to the corner.
      inflation_radius: 0.50
