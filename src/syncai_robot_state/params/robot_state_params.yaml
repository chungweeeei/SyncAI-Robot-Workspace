# Parameters for the syncai_robot_state node. The /**/ wildcard key matches the
# node in any namespace (the node is constructed as "syncai_robot_state").
/**/syncai_robot_state:
  ros__parameters:
    # robot_id and base_frame are overridden by the launch file with the
    # [system] robot_id from config/system.ini; the values below are only
    # fallbacks when the node is run without the launch file.
    robot_id: "default_robot"
    # Map name stamped into RobotState.map. Usually overridden from the launch file.
    map: "dp2f_full"
    # TF frames used for the position lookup (global_frame -> base_frame).
    # global_frame stays "map"; base_frame gets the <robot_id>/ prefix at launch.
    global_frame: "map"
    base_frame: "base_link"
    # TF lookup tolerance in seconds.
    transform_tolerance: 0.1
    # Publish rate for robot_state, in Hz. 10 Hz because the readers are
    # operators watching joint temperatures or chasing a localization dropout.
    # Raising it does not make the message more orderable — RobotState.timestamp
    # has whole-second resolution.
    publish_rate: 1.0
    # Low-battery hysteresis, in percent (0-100), driving state = WARNING.
    #
    # 20% is the number already used elsewhere for the same condition: the
    # unwired "soc < 20%" safety TODO in syncai_driver_manager, the reference
    # GaitMPC bridge that acts on it, and the frontend status strip's battery
    # colour. This node is where the judgement now lives — but it only reports,
    # it does not lie the robot down.
    #
    # The two values must differ: entering at 20% and only clearing above 25%
    # stops a pack sitting on the threshold from flipping the state ten times a
    # second at the 10 Hz publish rate. A clear value <= the warn value is
    # rejected at startup and both fall back to 20/25.
    low_battery_warn_percentage: 20.0
    low_battery_clear_percentage: 25.0
