amcl:
  ros__parameters:
    use_sim_time: true
    # --- Frames ---
    base_frame_id: "robot01/base_link"
    odom_frame_id: "robot01/odom"
    global_frame_id: "map"

    # --- Topics ---
    scan_topic: "robot01/scan_front"
    map_topic: "robot01/map"

    # --- Motion model (odometry noise) ---
    # robot_model_type: "differential" or "omni"
    robot_model_type: "differential"
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.2   # strafe noise (omni only)

    # --- Particle filter ---
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0   # e.g. 0.001 to enable random-pose recovery
    recovery_alpha_fast: 0.0   # e.g. 0.1 to enable random-pose recovery

    # --- Update thresholds ---
    update_min_d: 0.25         # meters of translation before an update
    update_min_a: 0.2          # radians of rotation before an update

    # --- Laser sensor model ---
    # laser_model_type: "likelihood_field", "beam", or "likelihood_field_prob"
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0      # -1.0 -> use scan's reported min
    laser_max_range: 100.0     # -1.0 -> use scan's reported max
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    lambda_short: 0.1
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    # beam-skip (likelihood_field_prob only)
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # --- TF / output ---
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # --- Map / initialization ---
    first_map_only: false
    always_reset_initial_pose: false
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
