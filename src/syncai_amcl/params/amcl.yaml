# The /**/ wildcard key matches the node name in any namespace, so the same file
# works for any robot_id: the launch file reads robot_id from config/system.ini
# and uses it as the node namespace. Topic values are RELATIVE and get the
# namespace prefix (scan -> /<robot_id>/scan, map -> /<robot_id>/map, plus
# amcl_pose / initialpose / particle_cloud). TF frame names are NOT namespaced
# by ROS, so the launch file overrides base_frame_id / odom_frame_id with the
# <robot_id>/ prefix at launch time — the values below are only fallbacks when
# the node is run without the launch file. The global frame stays "map".
/**/amcl:
  ros__parameters:
    # false: the real robot has no /clock publisher. Flip to true only when
    # driving the stack from a simulator that publishes one.
    use_sim_time: false
    # --- Frames (overridden by the launch file with <robot_id>/ prefix) ---
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # --- Topics (relative; namespaced at launch) ---
    scan_topic: "scan"
    map_topic: "map"

    # --- Motion model (odometry noise) ---
    # robot_model_type: "differential" or "omni"
    robot_model_type: "differential"
    # Raised from the low ref values (0.05/0.02/0.02/0.05): with noise that
    # tight the particle cloud can't cover real odom slip, so once the true
    # pose falls outside the cloud the filter never recovers (robot gets
    # lost mid-run). Wider spread costs a bit of pose smoothness but keeps
    # the true pose inside the cloud.
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.05  # rotation noise from translation
    alpha3: 0.05  # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.02  # strafe noise (omni only)

    # --- Particle filter ---
    # Ref: more particles for stability during fast motion.
    min_particles: 2000
    max_particles: 5000
    pf_err: 0.02
    pf_z: 0.85
    # Resample every 2nd update: resampling on every update (with our very
    # frequent update thresholds) depletes particle diversity and makes the
    # filter overconfident.
    resample_interval: 2
    recovery_alpha_slow: 0.001  # ref: enable random-pose recovery
    recovery_alpha_fast: 0.1    # ref: enable random-pose recovery

    # --- Update thresholds ---
    # Ref: update very frequently (critical for fast spin).
    update_min_d: 0.05         # meters of translation before an update
    update_min_a: 0.05         # radians of rotation before an update

    # --- Laser sensor model ---
    # laser_model_type: "likelihood_field", "beam", or "likelihood_field_prob"
    laser_model_type: "likelihood_field_prob"   # ref
    laser_min_range: 0.12      # ref
    # Ref uses 25.0, but our merged /robot01/scan is capped at 10 m by
    # pointcloud_to_laserscan (range_max), so cap here to match the real scan.
    laser_max_range: 25.0
    max_beams: 240             # ref: more beams = better scan match while spinning
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    lambda_short: 0.1
    # z_rand raised (0.1 -> 0.2): with z_hit at 0.8 the filter trusts the
    # scan so much that unmapped/dynamic obstacles drag the pose off the
    # map. Weights must sum to 1.0.
    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    # beam-skip (likelihood_field_prob only): ignore beams that disagree
    # with the map consensus, i.e. beams hitting unmapped obstacles.
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # --- TF / output ---
    tf_broadcast: true
    transform_tolerance: 0.2   # ref
    save_pose_rate: 0.5

    # --- Map / initialization ---
    first_map_only: false
    always_reset_initial_pose: false
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
