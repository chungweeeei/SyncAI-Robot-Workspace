# Parameters for syncai_localizer's "localizer_node".
#
# A standard ROS 2 params file. It used to be a flat YAML that the node read
# itself with yaml-cpp: only config_path was a real parameter, and nothing else
# showed up in `ros2 param` at all. In this format the values are visible to
# `ros2 param get/dump`, and the node can be started on its own with
#   ros2 run syncai_localizer localizer_node --ros-args --params-file <this file>
# (Ported unchanged from SyncAI-Fast-LIO2's localizer/config/localizer.yaml in
# 2026-09: same keys, same values, same tuning notes.)
#
# The /**/ wildcard key lets the same file work at any namespace: the launch
# file reads robot_id from config/system.ini and uses it as the namespace, so
# the actual FQN is /<robot_id>/localizer_node -- the bare robot_id, not
# /<robot_id>/localizer/...; see the launch header for why.
#
# cloud_topic / odom_topic point at pointlio's outputs (under
# /<robot_id>/pointlio/), which are outside the localizer's own namespace, so a
# relative name would not resolve to them — the launch file overrides both
# values with the robot_id prefix. The values here are only the fallback for a
# direct `ros2 run` without the launch file.
/**/localizer_node:
  ros__parameters:
    cloud_topic: /pointlio/body_cloud
    odom_topic: /pointlio/lio_odom

    # TF frame names are not prefixed by the ROS namespace; the value is the
    # actual frame name. local_frame is only a fallback: the launch file
    # overrides it with <robot_id>/pointlio_odom, and once the first odom
    # message arrives the node switches to that message's header.frame_id
    # anyway. It still matters until then, because the 10 ms timer broadcasts
    # map -> local_frame from startup. It said "laser" until 2026-10, which was
    # never this frame (that was the name the Livox driver stamped raw clouds
    # with); pointlio_odom is what syncai_pointlio's world_frame and
    # syncai_mapping's local_frame resolve to in a bare (un-namespaced) run.
    map_frame: map
    local_frame: pointlio_odom

    # map_path: the PCD the node loadMap()s during construction. Left empty
    # here — the launch file overrides it with the absolute path from
    # system.ini's [map] pcd, and if that file is missing the launch starts
    # nothing. When it is empty the node still comes up, but it cannot
    # localize until the relocalize service brings a map in.
    map_path: ""

    # Known starting pose at boot (map frame). When true, it is applied once as
    # the ICP initial guess as soon as the first odom message arrives, which is
    # the same as running relocalize automatically — no manual service call
    # needed. The launch file overrides this from system.ini's [initial_pose]
    # (set to true only when that section exists); the names mirror the
    # retired syncai_amcl's set_initial_pose / initial_pose.*.
    # Only x / y / yaw: z / roll / pitch are taken from the current estimate,
    # because with the lidar on a tilted mount and the map gravity-aligned,
    # map_T_body always carries the mount pitch, and a 2D pose with pitch=0
    # would keep ICP from matching (see applyPlanarGuess in localizer_node.cpp).
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

    # 1.0 -> 5.0 (2026-08-28, measured on robot01): at 1 Hz, walking fast at
    # 0.7 m/s let the guess error accumulate for a whole second before being
    # pulled back in one step, so the map -> odom correction moved in staircase
    # jumps (up to 0.67 m / 5.5 deg within a single second, see
    # record/loc_run_20260828_194142.csv). One rough+refine round measures only
    # 30-50 ms, so at 5 Hz the load is still well under one period, and each
    # correction shrinks to roughly 1/5. If CPU contention with pointlio shows
    # up (dropped ticks in the control loop), drop back to 3.0 first rather than
    # touching num_threads.
    update_hz: 5.0

    # Motion gate (2026-09-21, robot01 on the dp2f map). update_hz above is a
    # ceiling, not a schedule: below these thresholds the odom pose has not
    # moved enough to justify a new scan match, so timerCB rebroadcasts the
    # previous offset and skips GICP entirely.
    #
    # Why: parked for 60 s, the localizer's own correction (map -> pointlio_odom)
    # swung 33.7 mm in x / 29.0 mm in y / 1.07 deg, with 193 of 241 updates
    # moving more than 5 mm — every round, not occasionally. Point-LIO
    # underneath it (pointlio_odom -> pointlio_body) moved only 7.8 / 6.9 mm /
    # 0.27 deg, 0.87 mm per frame. So the jitter is not odometry drift: it is
    # GICP's noise floor being resampled 5 times a second. Livox's
    # non-repetitive scan puts different points in each frame, so the minimum
    # lands somewhere slightly different every time, while the true correction
    # for a stationary robot is a constant. Downstream, syncai_robot_state
    # samples map -> base_link at 1 Hz, i.e. a random phase of that +/-2 cm
    # swing, which is why the console looks like it teleports.
    #
    # This is NOT the degenerate-geometry double-solution bouncing recorded
    # under rough_registration_type below (~0.17 m): today's x/y noise is
    # roughly isotropic and site-independent.
    #
    # Rejected alternatives:
    #   - Plain EMA on every update (no gate): also smooths while driving, and
    #     alpha=0.3 at 5 Hz lags ~0.28 m at 0.6 m/s.
    #   - Plain deadband (drop sub-threshold solutions): a true drift below the
    #     threshold would never be corrected, and a threshold sitting on the
    #     noise amplitude turns steady jitter into intermittent large steps.
    #
    # Thresholds are deliberately small and the backstop short: the failure
    # direction we want is "jitter only partly suppressed", never "frozen on a
    # stale pose".
    min_update_trans: 0.05
    min_update_rot: 0.02
    # Re-register this often even when parked, so a slow true drift is still
    # corrected. Expect map -> pointlio_odom to update at 1/this Hz at standstill.
    max_update_interval: 2.0
    # EMA weight for a backstop refresh (one the gate would otherwise have
    # skipped). Motion-triggered updates always use 1.0, so driving is unchanged
    # and picks up no lag. Set to 1.0 to keep the gate but drop the blending.
    static_blend_alpha: 0.1
    # After a relocalize / initial-pose guess, register at full rate and full
    # alpha for this long. relocalize returning success is a receipt, not a
    # result — the pose converges over the rounds that follow, and gating right
    # after the first successful align would leave a parked robot refining one
    # alpha=0.1 step per max_update_interval (tens of seconds). 3 s at 5 Hz is
    # ~15 full-rate rounds. This matters most for the live map switch
    # (POST /api/v1/maps/{name}/activate), whose first step is relocalize.
    post_reloc_settle: 3.0

    # Source window of the tracking round (2026-10): the newest this many body
    # clouds, composed through their odom poses into the newest scan's body
    # frame, are registered as one cloud -- what auto_localize has always done
    # over auto_loc.accum_scans, only shorter. A single filter_num-6 MID360
    # scan is ~3k points on a non-repetitive pattern: sparse enough that the
    # rough stage dithers (the 5.9% of lost rounds under rough_rotation_eps
    # below) and that a parked robot's solution resamples GICP's noise floor
    # every round (the motion gate above). Three scans is ~0.3 s; Point-LIO's
    # drift over that is well under a centimetre, and each scan is already
    # de-skewed to its end. 1 is the single-scan behaviour until 2026-10. The
    # cost is in the refine stage's source size: the `refine:` log line
    # carries the round's ms since 2026-10, and rough + refine must stay under
    # half the update_hz period (100 ms). Not measured on the robot yet.
    track_accum_scans: 3
    # Refine-stage inlier ratio (inliers / voxelised source points) below
    # which a converged round is dropped anyway. 0 = off, and it ships off for
    # the reason the fitness thresholds reject nothing: a value needs data
    # from a site this was NOT mapped from. Every accepted round logs the
    # ratio (`loc: ... inl=`); set it from that.
    min_inlier_ratio: 0.0
    # A guess from relocalize / initialpose / [initial_pose] that the timer
    # has not converged on within this many seconds is withdrawn and the timer
    # goes back to its previous offset + odometry (`guess withdrawn` in the
    # log; relocalize_check keeps answering false). Until 2026-10 such a guess
    # was retried every round forever with the TF frozen on the old offset
    # meanwhile -- a flat guess on the tilted mount being the classic case
    # (applyPlanarGuess). auto_localize / reset_odometry keep their own
    # deadlines (auto_loc.converge_timeout_sec, reset_odom.converge_timeout_sec)
    # and are not affected. <= 0 restores the old behaviour. Longer than
    # post_reloc_settle on purpose: a guess that is going to converge does so
    # within the settle window.
    guess_timeout_sec: 10.0

    # Localizability (2026-10; localizers/localizability.h has the whole
    # argument). GICP's final 6x6 Hessian says which directions the scan
    # constrained: its eigenvalues, per inlier and in the map frame, are
    # classified direction by direction as FULL / PARTIAL / NONE by their
    # ratio to the largest one, and GICP's correction (the solution minus the
    # odometry prediction) is taken x1 / x partial_gain / x0 along them. In a
    # corridor the along-axis correction, which was GICP's noise, now stays
    # with Point-LIO; in the west-end corner (rough_registration_type below)
    # the weakly constrained y stops jumping between the two basins. Not
    # applied to a service guess or inside its settle window, nor to the first
    # registration after start. The thresholds are FIRST GUESSES: every
    # accepted round logs `loc: t-eig=(...) r-eig=(...) lvl=FFN/FFF ...`, and
    # ratio_none / ratio_partial are to be set from the dp1f replay (the
    # weakest ratio on its corridor stretches against the open-space rounds)
    # before being trusted. enabled: false keeps the analysis and the log but
    # projects nothing -- the behaviour before 2026-10, for an A/B on one bag.
    localizability:
      enabled: true
      ratio_none: 0.02
      ratio_partial: 0.1
      # Absolute floor on the per-inlier eigenvalue (0 = off), for the case
      # where every direction is weak at once and the ratio alone would still
      # call the least-weak one FULL. Units are H's own (m^-2 per inlier for
      # translation); read them off the log before setting it.
      min_eig_per_inlier: 0.0
      partial_gain: 0.3

    # Jump gate (2026-10). A registration whose map-frame body pose is further
    # from the last ACCEPTED one than the robot could have moved meanwhile is
    # dropped and the TF coasts on odometry for that round. The reference is
    # the last accepted body pose, NOT the odometry prediction: when Point-LIO
    # diverges the prediction is garbage and GICP's answer is right (robot01
    # 2026-10-13), and the offset absorbing that jump is what kept the TF
    # correct -- a gate against the prediction would have thrown those rounds
    # away. What this catches is a solution in the wrong basin. The robot
    # tops out at 0.6 m/s; 1.5 leaves room for the gait's lurch and the 0.2 s
    # floor on dt. After max_reject_streak consecutive rejections the next
    # round is accepted regardless (logged), because by then it is the
    # reference that is suspect: the gate must never freeze the TF on a wrong
    # pose for good -- the failure direction chosen under the motion gate
    # above, "jitter partly suppressed, never frozen", applies here too.
    jump_gate:
      enabled: true
      max_speed: 1.5
      max_rot_speed: 1.5
      max_reject_streak: 5

    # The registration backend is small_gicp's GICP (it used to be
    # pcl::IterativeClosestPoint's point-to-point). num_threads is used for the
    # covariance estimation, the KD-tree build and the reduction; the localizer
    # shares one CPU with pointlio, so do not use every core.
    # num_threads is read once, during construction — RegistrationPCL builds
    # the KD-tree with the value current at setInputTarget time, and changing it
    # later does not rebuild the tree.
    num_threads: 4
    # Number of neighbors used to estimate the local covariance; the same as
    # pcl::GICP's correspondence randomness.
    num_neighbors: 20

    rough_scan_resolution: 0.25
    rough_map_resolution: 0.25
    # small_gicp only reports converged when the update falls below eps; hitting
    # the iteration limit stops as not converged (PCL's ICP reports converged
    # even when it hits the limit), and align() treats hasConverged() as a hard
    # condition. So the old 5 / 10 cannot be carried over: too few iterations
    # means a perfectly good score still returns false every round and the TF
    # never updates. Aligned with small_gicp's default of 20.
    rough_max_iteration: 20
    # The threshold is compared against pcl::Registration::getFitnessScore():
    # the mean squared nearest-neighbor distance (m²) from the registered
    # source to the target. It does not depend on the registration algorithm,
    # so after the switch to GICP the physical meaning of these two values is
    # unchanged and the old tuning carries over. The actual value is printed in
    # the log's fitness column.
    # For scale (dp1f replay, 2026-10-04): a correct lock scores rough
    # 0.009-0.03 (p50 0.012) and refine 0.001-0.018 (p50 0.0044, max 0.052),
    # so both thresholds sit 10-20x above a good match and reject nothing —
    # they are a sanity bound, not a lock-quality gate. Tightening them to make
    # them one needs data from a site this was NOT mapped from first; a value
    # that is too tight fails as "TF frozen on the last offset", silently.
    rough_score_thresh: 0.2
    # Upper bound on the correspondence pairing distance (m): rough gets a
    # larger one to absorb the error of a hand-entered relocalize guess.
    rough_max_corr_dist: 2.0
    # Convergence tolerances of the Gauss-Newton step (rad, m): small_gicp
    # reports converged only when one step is below BOTH, and align() gates on
    # that flag. The library defaults are 2e-3 rad (0.11 deg) and 5e-4 m, which
    # is what both stages used until 2026-10-04. For rough that is far tighter
    # than its job needs: it works on 0.25 m voxels and only has to land inside
    # refine's 0.5 m correspondence radius. Measured on the dp1f bag replayed
    # through pointlio + this node (645 s, 3038 rounds): 180 rounds (5.9%)
    # ended as "rough : converged=no iters=19 ... fitness=0.010-0.028" — a good
    # fit still dithering at the millimetre level when the iteration budget ran
    # out — and every one of them threw the whole round away, so the TF coasted
    # on odometry for up to 10 rounds (2 s) in a row while moving. Rounds that
    # did converge needed a median of 7 iterations (p90 13), so this is not a case for
    # more iterations. 0.5 deg / 5 mm is still 20x finer than refine's basin.
    rough_rotation_eps: 0.0087
    rough_translation_eps: 0.005
    # "GICP" or "VGICP". VGICP builds a voxelmap of the target instead of a
    # KD-tree and has a larger basin of attraction, so in theory it suits the
    # rough stage better. But measured on robot01 on 2026-08-28 with VGICP +
    # 5 Hz, in a corner at the west end of the site with a weak constraint
    # along y, the pose of the stationary robot kept bouncing between two
    # solutions ~0.17 m apart (with GICP for rough, the swing at the same spot
    # was only ~0.13 m; see record/loc_run_20260828_194142.csv from 20:05:30
    # on) — presumably the 1.0 m voxels push the rough solution into different
    # basins of attraction in degenerate geometry, and refine passes the
    # fitness check on both sides. Reverted to GICP to validate update_hz=5.0
    # on its own; retry VGICP once that corner has been given some geometric
    # features.
    rough_registration_type: "GICP"
    # Only used when rough_registration_type is VGICP (voxelmap edge length, m).
    rough_voxel_resolution: 1.0

    refine_scan_resolution: 0.1
    refine_map_resolution: 0.1
    refine_max_iteration: 20
    refine_score_thresh: 0.1
    # refine tightens this and uses only short-range pairs for the fine
    # registration.
    refine_max_corr_dist: 0.5
    # Refine keeps small_gicp's defaults: it is the stage whose solution becomes
    # the TF, so a sub-millimetre step is the right bar. In the same dp1f replay
    # 48 of 2858 refine rounds (1.7%) hit the iteration limit, all with a good
    # fitness (0.0015-0.015), i.e. the same dithering as above but rare enough to
    # leave alone — one skipped round at 5 Hz costs 200 ms of odometry coasting.
    refine_rotation_eps: 0.002
    refine_translation_eps: 0.0005
    refine_registration_type: "GICP"
    refine_voxel_resolution: 0.5

    # auto_localize: the hint-free global search for a kidnapped robot
    # (2026-10; localizers/global_localizer.h has the design, the README the
    # walk-through). None of these values is measured yet -- they are first
    # guesses to be tuned on a replay (dp1f against map/dp1f_1006, which has a
    # poses.txt), and min_inlier_ratio / ambiguity_ratio above all: too loose
    # accepts a wrong place, too tight fails every call.
    auto_loc:
      # One second of body_cloud. A single scan (filter_num 6) is too sparse
      # to tell places apart; the odom poses line the ten up.
      accum_scans: 10
      # Keyframe thinning: the poses.txt trajectory is sampled at this
      # spacing, so a candidate starts at most ~0.7x this off in x / y.
      candidate_spacing: 1.0
      # Yaw sweep: 24 yaws per position. The fine stage's rough GICP has to
      # absorb half a step (7.5 deg, ~2.6 m at 20 m range).
      yaw_step_deg: 15.0
      # Coarse stage: cheap inlier counting, loose on purpose -- the candidate
      # is up to half a grid step and half a yaw step off.
      coarse_scan_resolution: 0.5
      coarse_max_points: 400
      coarse_inlier_dist: 1.0
      # Distinct candidates that get rough + refine GICP. Each costs roughly
      # one timer round or two (30-100 ms).
      top_k: 10
      # Wider than the timer's rough_max_corr_dist (2.0), which starts from
      # last round's answer rather than from a grid point.
      rough_max_corr_dist: 3.0
      max_iteration: 50
      # Final score: fraction of refine-resolution scan points within this of
      # the 0.1 m map. This, not refine_score_thresh (a sanity bound that
      # rejects nothing, see above), is the acceptance gate.
      refine_inlier_dist: 0.3
      min_inlier_ratio: 0.6
      # Reject when a runner-up further than ambiguity_trans / ambiguity_yaw_deg
      # from the winner scores at least this fraction of it: a symmetric
      # corridor fails instead of guessing.
      ambiguity_ratio: 0.9
      ambiguity_trans: 1.0
      ambiguity_yaw_deg: 10.0
      # Deadlines (<= 0 disables). search includes building the GICP targets
      # and KD-trees on the first call after a map load. converge bounds the
      # wait for the timer's own registration against the winner -- without
      # it a guess that never converges is retried every round forever; on
      # timeout the guess is withdrawn and localization is left as it was.
      # A caller's client timeout must exceed the sum.
      search_timeout_sec: 10.0
      converge_timeout_sec: 5.0

    # reset_odometry (2026-10): zero Point-LIO and carry the map pose across,
    # the recovery for a diverged front end (robot01 2026-10-13: lio_odom at
    # ~1000 m/s with the robot parked, and auto_localize unable to help while
    # its scan window was posed by that odometry). ResetOdometry.srv has the
    # contract; the README the walk-through. The deadlines are first guesses.
    reset_odom:
      # Relative: /<robot_id>/pointlio/reset from this node's namespace.
      lio_reset_service: "pointlio/reset"
      lio_reset_timeout_sec: 2.0
      # pointlio publishes nothing until its static IMU init is done.
      wait_lio_timeout_sec: 10.0
      converge_timeout_sec: 5.0
      # A registration seeds a later reset only if the odometry moved slower
      # than this since the previous one. Never affects what is broadcast.
      max_lio_speed: 3.0
