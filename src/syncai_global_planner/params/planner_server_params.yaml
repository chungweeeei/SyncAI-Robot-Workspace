# Parameters for the syncai_global_planner "planner_server" node and its internal
# global costmap node. The /**/ wildcard keys match the node names in any
# namespace, so the same file works for any robot_id: the launch file reads
# robot_id from config/system.ini and uses it as the node namespace. Topic
# values below are RELATIVE names — they get the namespace prefix
# automatically (e.g. map -> /<robot_id>/map). TF frame names are NOT
# namespaced by ROS, so the launch file overrides robot_base_frame /
# sensor_frame with the <robot_id>/ prefix at launch time — the values below
# are only fallbacks when the node is run without the launch file. The
# costmap's global_frame stays "map".
/**/planner_server:
  ros__parameters:
    use_sim_time: false

    # Warn if a plan takes longer than 1/expected_planner_frequency seconds.
    # This is a warning threshold only — nothing throttles or aborts on it.
    # 20 Hz (50 ms) is a generous ceiling: the BT's RateController only asks
    # for a plan at most once a second (in the 2D tree only when is_path_valid
    # says the current one is blocked; in the 3D tree, move_3d.xml, once per
    # goal), so the warning is a canary for a pathological search (a huge
    # unknown region, a goal buried in lethal cost), not a cadence anyone is
    # trying to hit. A Smac plan on a 0.05 m hall map, and an Octo3D plan
    # (~1 ms for 25 m, ~30 ms 1F -> 2F on dp1f_1012), land well under it.
    expected_planner_frequency: 20.0

    # Re-send the last plan on `plan` this often (Hz), restamped; 0 = publish
    # only when a plan is made. The BT plans once per goal (move_3d.xml, a 3D
    # map) or only when the path is blocked (move.xml, a 2D map), so without
    # this a viewer that subscribes mid-drive never sees the route.
    plan_republish_rate: 1.0

    # How long a goal for a planner that reads the costmap (GridBased) waits
    # for it to be current before the goal is aborted (s; <= 0 = forever, as
    # upstream did). The global costmap updates at 1 Hz, so a clear
    # repopulates within ~1 s and 5 s is only ever hit by a layer that is not
    # getting its data. Until 2026-10-19 the wait had no way out at all: a
    # GridBased goal on a 3D-only map (no gridmap.yaml, the static layer never
    # gets a map) hung the action thread for good. That case no longer waits
    # for this timeout -- a static layer without a map fails the goal at once
    # -- and a cancel ends the wait too. An aborted ComputePathToPose reaches
    # NavigateToGoal as PLAN_FAILED. Dynamic.
    costmap_wait_timeout: 5.0

    # is_path_valid (the 2D tree's once-a-second check of the path still
    # ahead; the 3D tree, move_3d.xml, does not call it, because the check is
    # 2D and reads a path upstairs as blocked) tests each pose twice: the
    # centre cell against INSCRIBED, which is Smac's own expansion test
    # (unknown, off-map, the keepout band, anything within the inscribed
    # radius of the centre, including inside the
    # rectangle), and, with footprint_check, the padded footprint's perimeter
    # against LETHAL -- the test RPP applies on the local costmap before it
    # drives. The two are not nested: INSCRIBED at the centre means lethal
    # within 0.25 m, while the perimeter reaches 0.25 m sideways at the path
    # heading and 0.455 m at the corners. So a blocker 0.25-0.45 m off the
    # path centre passed the centre test, RPP refused the path, nothing
    # replanned, and the goal aborted after failure_tolerance with no detour
    # tried (2026-10). The perimeter is tested at the path heading and at
    # +-heading_margin: RPP tracks with up to rotate_to_heading_min_angle
    # (0.25 rad) of heading error before it rotates in place, the gait adds
    # yaw sway, and at 0.35 rad the rectangle reaches 0.365 m sideways, which
    # is what catches a person standing 0.3 m beside the route. The price is
    # a straight passage narrower than 0.73 m: Smac (> 0.5 m) plans it, this
    # test rejects it, and the BT replans once a second into the same path
    # while RPP refuses to drive it -- the same abort as before, with a
    # noisier log. Doors (0.8-0.9 m) pass. footprint_check: false restores
    # the centre test alone. Both are dynamic parameters, for A/B on the
    # robot without a rebuild.
    is_path_valid:
      footprint_check: true
      heading_margin: 0.35

    # The id stays "GridBased" rather than becoming "Smac2D": the 2D move.xml
    # hardcodes planner_id="GridBased" in its ComputePathToPose node, so an id
    # rename here would silently send every task-runner goal to an unknown
    # planner (getPlan() logs an error and returns an empty path). Swapping the
    # plugin under the existing id is what makes the change take effect without
    # touching the behavior tree.
    #
    # Two ids on purpose (2026-10). GridBased stays Smac2D on the 2D costmap
    # and is what move.xml asks for on dev. Octo3D is the OctoMap surface
    # planner for the quadruped (OctomapPlanner3D, below), and on
    # feature/octomap-planner-3d a 3D map's trees ask for it (move_3d.xml /
    # dock_3d.xml, with FollowPathRPP3D, the controller that follows a path
    # with heights and climbs stairs). Which trees a goal runs is read off
    # Octo3D's latched map_available (2026-10-19): a map is 2D or 3D, never
    # both, so on a 2D map Octo3D has no tree, says false, and the goal runs
    # move.xml on GridBased. Loading Octo3D costs a background build of a few
    # seconds at startup and ~30 MB. A map without octomap.bt logs one error
    # and leaves GridBased untouched -- but with move.xml on Octo3D, every
    # navigation goal on that map then fails (PLAN_FAILED). With two ids
    # loaded an EMPTY planner_id no longer falls back to the only plugin
    # (getPlan() needs the id); the BT always names one.
    planner_plugins: ["GridBased", "Octo3D"]
    GridBased:
      plugin: "syncai_global_planner/SmacPlanner2D"

      # Cost-aware grid A*. Replaced NavFn because NavFn's gradient descent
      # cuts corners against the inflation gradient; here the inflation cost is
      # inside the edge cost, so the path drifts to the centreline of a
      # corridor on its own. The Hybrid-A* planner was evaluated and removed:
      # G23 turns in place, so its minimum_turning_radius (which Dubins cannot
      # take as 0) only bought detours, and RPP cannot follow a reversing path.
      tolerance: 0.5        # accept goals within this distance (m) of the requested pose
      allow_unknown: false   # allow planning through unknown space

      # Weight on costmap cost relative to travel distance, applied as
      # 1.0 + cost_travel_multiplier * (cell_cost / 252). This is the knob that
      # makes the planner cost-aware at all; 0.0 degenerates to plain A* on
      # distance. Tuned against the inflation layer below when it was
      # cost_scaling_factor 2.0 / inflation_radius 0.5 (0.8 / 1.5 since
      # 2026-10, not re-tuned here) — raise it to hug the centreline harder at
      # the price of longer paths, lower it if the robot refuses tight gaps.
      # Lowered 2.0 -> 1.0: at 2.0 the paths bowed noticeably along the
      # inflation gradient in open space; 1.0 keeps enough cost-awareness to
      # stay off walls while letting distance dominate, so open-space legs come
      # out near-straight. Safety clearance still comes from the inflated
      # footprint, not this weight.
      cost_travel_multiplier: 1.0

      # Post-search gradient-descent smoother (upstream Smac defaults are
      # w_data 0.2 / w_smooth 0.3). w_smooth pulls each waypoint toward the
      # midpoint of its neighbours (straightens), w_data anchors it to the raw
      # A* path (keeps the search's obstacle clearance). Nudged toward smooth
      # to iron out the grid-A* staircase, then w_data 0.2 -> 0.1 (2026-10)
      # for rounder corners still. The smoother has NO cost term: the only
      # thing it respects is "never land a waypoint above cost 252", so every
      # step toward smooth is a step toward cutting corners at the wall. That
      # is why the wall clearance comes from the inflation band below, which
      # moves the raw A* path off the wall before smoothing starts, and not
      # from these weights. Keep w_smooth well below ~0.5 regardless.
      #
      # One more reason clearance helps smoothness: the first waypoint update
      # that lands above 252 aborts smoothing for the WHOLE path (it returns
      # the previous iteration), so a raw path grazing the inscribed edge in
      # one spot comes out staircased everywhere.
      smoother:
        w_data: 0.1
        w_smooth: 0.4
        max_iterations: 1000
        do_refinement: true

      # 0.05 m maps here are small enough to search at full resolution.
      # Downsampling would also publish a debug "downsampled_costmap" topic.
      downsample_costmap: false
      downsampling_factor: 1

    # NavfnPlanner ("syncai_global_planner/NavfnPlanner", params: tolerance /
    #   use_astar / allow_unknown / use_final_approach_orientation) and
    #   StraightLinePlanner are still built and registered. To fall back, set
    #   plugin: above under GridBased -- a third id is invisible to move.xml
    #   until the tree names it.

    # OctomapPlanner3D: A* over the floor surfaces of map/<name>/octomap.bt
    # (the tree clean_map writes beside map.pcd), for the quadruped. The tree
    # is reduced once at startup to a multi-layer 2.5D surface map -- every
    # column's floor surfaces, each judged with the geometry below -- and a
    # path only ever runs over cells that passed, so it cannot leave the
    # ground, climb a wall, cross a stair riser or a kerb, or jump floors; it
    # takes ramps. The one way between floors is a stair the robot walked
    # while mapping: poses.txt next to the tree turns each flight on the track
    # into a stair link (stair_* below). The 2D costmap is used for its frame
    # id only. Offline the
    # same code runs as `octomap_planner_3d_cli map/<name>/octomap.bt --stats`
    # (also --check-poses, --dump-image, --plan); that is where these values
    # were set, on dp1f_1012_v2 (2026-10). The README's OctomapPlanner3D
    # section has the algorithm.
    Octo3D:
      plugin: "syncai_global_planner/OctomapPlanner3D"

      # Set by the launch file to map/<name>/octomap.bt, derived from the
      # directory of [map] pcd (no INI key: the backend's map switch writes
      # [map] name alone). Empty or missing file = every Octo3D plan fails
      # with map_not_loaded, nothing else is affected. A map switch replaces
      # it through /<robot_id>/planner_server/Octo3D/load_map
      # (nav2_msgs/srv/LoadMap, map_url = the new octomap.bt; 2026-10-19),
      # which also writes the new path back here; `ros2 param set` on it is
      # refused, pointing at that service.
      octomap_file: ""
      # The map's track, for the stair links. Empty = poses.txt next to
      # octomap_file (map/<name>/poses.txt, written by every save_maps with
      # patches). Missing = a warning and no links: the floors stay apart.
      # Boot only: a load_map reload always takes poses.txt from beside the
      # new tree.
      poses_file: ""

      # The server hands the planner the planar map -> base_link pose, whose
      # z is always 0, so the robot's real height comes from TF to this frame
      # (the LIO body, which keeps z; overridden by the launch file with the
      # <robot_id>/ prefix) minus lidar_height, the sensor's height above the
      # ground -- the same number clean_map was run with (map_clean.recipe.json
      # lidar_height). Without the TF the request's z is used, which is right
      # on the ground floor and wrong upstairs.
      body_frame: pointlio_body
      lidar_height: 0.481

      # request: the goal's own z picks the floor, within snap_z_window. The
      # backend sends z = 0, which lands on the ground floor (its surface is
      # ~0.5 m below the map origin, the first lidar pose). start: use the
      # robot's floor instead, for sending a 2D goal while it is upstairs.
      goal_z_mode: request

      # ---- surface map (baked in at startup; a change needs a restart) ----
      # Hard clearance: every column within this radius of a cell must hold a
      # usable surface, else the cell is blocked -- the implicit inflation of
      # walls, drop-offs and unfillable holes. Same 0.25 m as the global
      # costmap's inscribed radius (padded half-width of the footprint), so
      # Octo3D and GridBased refuse the same gaps.
      robot_radius: 0.25
      # Non-occupied voxels needed above a surface for the body to fit. The
      # lidar top is ~0.55 m up; 6 cells at 0.1 m.
      body_clearance: 0.6
      # Largest height change between neighbouring cells: the legs' step
      # capability, 0.17 m = a standard riser, which the G23 was driven up
      # while mapping dp1f_1012 (0.10 until 2026-10-14, chosen to refuse
      # stairs, which the stair links below now handle). Rounded to whole
      # cells: at res 0.1 this is two cells, so a 0.15 m kerb is one step
      # and a 0.5 m ledge is not.
      max_step_height: 0.17
      # Tilt limit of the plane fitted under the footprint disc. With single
      # risers allowed this is what refuses a stair flight (~30 deg): a disc
      # whose surfaces span at most one step is level ground with a kerb and
      # is not fitted; a flight shows two risers in a 0.5 m disc and is. Also
      # the only guard against a shallow stair with 0.1 m risers (a 19 deg
      # "ramp" at this resolution). A fit, not max-minus-min: a flat floor
      # read cell by cell looks 11 deg tilted across a 0.5 m disc.
      max_slope_deg: 20.0
      # Share of the footprint disc's columns that must hold a usable
      # surface. The rest may be gaps -- columns nothing was ever seen in --
      # never a wall, a drop or an obstacle, which block outright. The lidar
      # sees the floor at grazing angles only, so the observed floor is
      # sparse: with every column required (the rule until 2026-10-14) 13 %
      # of dp1f_1012's own keyframes stood on "untraversable" ground. The
      # missing share is also paid for in cost (gap_cost_weight). 1.0 = the
      # old rule.
      footprint_min_support: 0.8
      # Unknown voxels tolerated in the clearance band (-1 = all). The lidar
      # looks mostly outward from 0.48 m up, so the band is observed only where
      # the robot passed; a strict value punches holes in exactly the
      # corridors the path needs. An occupied voxel in the band always rejects.
      max_unknown_clearance_cells: -1
      # The voxel right above a floor must have been observed free: a floor
      # the robot stood on always has, a ceiling / slab underside seen from
      # below never has. 1 removed every ceiling island of the multi-storey
      # dp1f_1012_v2 (748 -> 153 components); 0 disables.
      min_known_free_above: 1
      # Floor voxels exist only where a scan hit them, and the lidar's lower
      # field of view (-7 deg) cannot see the floor nearer than ~4 m, so the
      # floor under the robot's own track is seen only from afar: ~5 % of
      # the columns under it are empty. A column with no surface whose
      # neighbours within the radius agree on a height from three of the four
      # quadrants around it, with at least min_support of them, and with no
      # occupied voxel near that height, gets an inferred surface. The
      # quadrant rule keeps a floor edge or a balcony from being extended
      # (one-sided support). Two passes close a hole from the rim inward.
      # dp1f_1012_v2: 86 % of the keyframes on a traversable cell with this,
      # 74 % without.
      hole_fill_radius: 0.3
      hole_fill_min_support: 0.5
      hole_fill_passes: 2
      # Reach of the soft clearance cost, from the traversable boundary (which
      # already sits robot_radius from the wall): 0.55 puts the band edge
      # 0.8 m from the wall, the global costmap's inflation_radius.
      clearance_cost_radius: 0.55

      # ---- stair links (baked in at startup) ----
      # The geometry rules refuse every stair (step and slope), and relaxing
      # them map-wide would pass every 0.2 m kerb and drop-off too. Instead a
      # stretch of the map's own track that leaves one floor and arrives on
      # another, at least stair_min_rise higher or lower and at most
      # stair_max_length of track later, becomes a link the search may take
      # both ways and the path follows keyframe by keyframe (loops from turns
      # and waits on the landings cut out). Links end only in components of
      # stair_anchor_min_area or more: a stairwell's landings rarely survive
      # the rules (dp1f_1012: small, walled, the air above never observed),
      # so a link spans the whole stairwell, floor to floor. Stairs the robot
      # never walked stay refused. dp1f_1012 (2026-10-14): one 1F -> 2F link
      # over the switchback stair (four flights, 5.3 m, 39 m of track after
      # the loop cut), plus two over a 0.4 m step on 2F.
      stair_links: true
      # Above a kerb (0.15) and one stair step, below a flight between landings.
      stair_min_rise: 0.3
      # dp1f_1012's stairwell took 32 m of track with the turns on its landings.
      stair_max_length: 60.0
      # Track ground (pose z - lidar_height) to a cell's top face.
      stair_anchor_z_window: 0.3
      # m2. The two storeys of dp1f_1012 are 1200 and 330, the stairwell's
      # islands at most ~11.
      stair_anchor_min_area: 10.0
      # Three-point moving-average passes over a walked link's points after
      # the loop cut: a hand-driven track weaves by centimetres and the body
      # pitches on a flight. 0 = the raw keyframes.
      stair_smooth_passes: 2
      # The track says where a stair is, not how to climb it (2026-10-19): a
      # single flight becomes a row of straight links across its width -- the
      # surfaces beside the walked stretch are fitted with a plane, whose
      # gradient is the uphill direction, and a line is marched up it from
      # every lower-floor cell near the walked foot that reaches the upper
      # floor. The search picks the entry, so a route meets the stair where
      # its own line crosses it and climbs facing the risers. dp's 2F flight:
      # one walked link 9 deg off the stair's axis became 24 straight ones,
      # and a 27 deg turn at the stair head went away. false = one link along
      # the walk (the 2026-10-14 behaviour).
      stair_straight: true
      # Longest stretch of track (m, xy) taken as one straight flight; a
      # switchback stairwell (dp: 30 m, dp1f_1012: 32 m) keeps its walked link,
      # and a startup note says so.
      stair_straight_max_flight: 8.0
      # Surfaces within this of the walked stretch, at heights between the two
      # floors, fit the plane.
      stair_straight_fit_radius: 1.0
      # How far either side of the walked foot entries are tried: the stair's
      # width the planner may use. dp's 2F flight is 2.6 m wide.
      stair_straight_half_width: 2.0
      # Longest level run a line may make between two rises: the ~robot_radius
      # of blocked floor the footprint rule leaves before the first riser and
      # after the last. A landing longer than this ends the flight.
      stair_straight_exit_reach: 0.6
      # A multi-flight stretch (dp's switchback stairwell) is laid as flights
      # and landing corners read off the map (2026-10-21), not as the walk:
      # the walk's height profile gives the landings, each flight's direction
      # comes from the well's wall (the straighter side of the cross-sections;
      # all flights of one well share one orientation), its axis from the
      # cross-sections' middle, and consecutive flights are joined on the
      # landing with explicit corners -- one at the axes' crossing for an L,
      # two (0.5-1 m out, across, in) for a U -- plus a 0.5 m lead-in and
      # lead-out. Nothing on it is smoothed. dp: 4 flights 1.3-1.6 m wide,
      # three U landings, 6 turns, every flight within 0.01 m of its axis.
      # false = the walked link, centred below when stair_centre is on.
      stair_flights: true
      # A level run of the walk at least this long (m) is a landing.
      stair_flights_landing_min_len: 0.5
      # A segment of the walk flatter than this is level (dp's flights ~30
      # deg, its landings under 5).
      stair_flights_landing_slope_deg: 15.0
      # The straight run before the first foot and past the last head (m).
      stair_flights_lead: 0.5
      # A walked link (a switchback stairwell) is centred in the well
      # (2026-10-20): at every point the cross-section square to the walk is
      # measured on the surface map -- columns holding a surface within
      # stair_centre_dz of the point's tread, until a wall or the drop to the
      # neighbouring flight -- and the point moves to its middle, the shifts
      # median-filtered and smoothed along the link. A side longer than
      # stair_centre_max_half_width is open floor, and the point stays. dp's
      # stairwell: 58 of 66 points moved, mean 0.09 m, at most 0.30 m (the
      # second flight, walked along its inner rail). false = the operator's
      # own line.
      stair_centre: true
      stair_centre_dz: 0.25
      stair_centre_max_half_width: 1.5
      stair_centre_max_shift: 0.6

      # ---- search (dynamic) ----
      # Move length x (1 + weight * exp(-scaling * clearance_d)) inside the
      # band, x 1 beyond: the costmap's inflation curve (cost_scaling_factor
      # 1.5) and Smac's cost_travel_multiplier (1.0) in one. A multiplier, not
      # a per-node penalty, so diagonals are not cheaper per metre.
      clearance_cost_weight: 1.0
      clearance_cost_scaling: 1.5
      # Prefer observed floor over hole-filled floor, mildly.
      inferred_cost_multiplier: 1.2
      # Move length x (1 + weight * gaps / footprint columns): prefer ground
      # seen all of, take sparse ground when that is what there is.
      gap_cost_weight: 1.0
      # 1.0 = optimal (3D Euclidean is admissible here). A 50 m plan on
      # dp1f_1012_v2 takes a few ms at 1.0; raise only if that ever matters.
      heuristic_weight: 1.0
      max_iterations: 2000000
      max_planning_time: 2.0
      # Snap: nearest traversable cell within the xy radius (Smac's tolerance)
      # whose top face is within the z window of the height hint. 1.0 covers
      # the 0.48 m lidar-to-floor offset of a goal at the robot's height and
      # is far below the spacing of two floors (~5.7 m here).
      snap_xy_radius: 0.5
      snap_z_window: 1.0
      # Factor on a stair link's 3D length: a level detour up to this many
      # times longer wins over the stairs. >= 1 (keeps the heuristic admissible).
      stair_cost_multiplier: 2.0

      # ---- output ----
      # Line-of-sight shortcut of the cell chain (supercover, step-continuous,
      # never closer to the boundary than the search was), then a resample
      # at interpolation_resolution with z read from the surface. Poses carry
      # z = the floor's top face + path_z_offset; the 2D controllers ignore z.
      shortcut: true
      interpolation_resolution: 0.1
      path_z_offset: 0.0
      # Publish the un-shortcut chain on Octo3D/raw_plan for comparison.
      publish_raw_plan: false

# The global costmap is an internal node created by planner_server
# (constructed as a plain node named "global_costmap").
/**/global_costmap:
  ros__parameters:
    use_sim_time: false

    # Frames (robot_base_frame is overridden by the launch file with
    # <robot_id>/ prefix; global_frame stays "map")
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

    # Update / publish rates
    update_frequency: 1.0
    publish_frequency: 1.0

    # Geometry: the static layer resizes the master costmap to the map, so
    # width/height here are only the pre-map defaults.
    rolling_window: false
    track_unknown_space: true
    resolution: 0.05

    # Robot footprint: rectangle with half-extents 0.35 x 0.22 (0.70 x 0.44 m
    # overall) around base_link for the G23 chassis. It is the SAME rectangle
    # as the controller's local_costmap in controller_server_params.yaml —
    # one robot, one footprint; change both or neither. The two used to drift
    # (local stayed at 0.28 x 0.20 after this one grew), reconciled 2026-10.
    #
    # The padding differs on purpose: 0.03 here vs 0.01 in the local costmap.
    # The rule this encodes is that the global footprint must be the larger
    # one, so that is_path_valid's perimeter test (same rectangle, this
    # padding) is stricter than RPP's (same rectangle, the local padding),
    # and a path it passes is one RPP will drive. That ordering holds only
    # between the two PERIMETER tests. Until 2026-10 is_path_valid tested the
    # centre cell alone and this comment claimed the padding gap made the
    # planner "the conservative side" -- it did not: Smac accepts any centre
    # cost below 253, which bounds the centre's distance to lethal (0.25 m)
    # and says nothing about the corners (0.455 m), so a blocker 0.25-0.45 m
    # off the path was Smac-valid and RPP-refused, and the goal aborted with
    # no detour. The 0.02 m gap absorbs ~3 degrees of heading error, not the
    # 14 degrees RPP tracks with; is_path_valid.heading_margin covers that.
    # Do not equalize the paddings, and never let the local padding exceed
    # this one. (A circular robot_radius=0.22 was tried before the rectangle
    # and was oversized enough to make RPP reject valid paths through ~0.6 m
    # gaps.)
    #
    # Padded half-extents are 0.38 x 0.25, so the inscribed radius is 0.25 m
    # and the circumscribed radius sqrt(0.38^2 + 0.25^2) ~= 0.455 m.
    # inflation_layer.inflation_radius below must stay >= the circumscribed
    # radius: the inscribed core (cost 253) is what the centre test and the
    # keepout filter's own inflation key on, and it is only meaningful while
    # the band around it is at least robot-sized. Grow the footprint or
    # padding, or shrink the inflation radius, and re-check this inequality.
    footprint: "[[0.35,0.22],[0.35,-0.22],[-0.35,-0.22],[-0.35,0.22]]"
    footprint_padding: 0.03

    # Relative topic: resolves to /<robot_id>/map (matches map_server's
    # output in the same namespace)
    map_topic: map

    # Layer stack — order matters: static -> obstacle(mark/clear) -> inflation
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

    # Costmap filters run AFTER the layer stack, on the combined grid (see
    # syncai_costmap_2d's README, "pipeline"): the layers write into a primary
    # grid, that window is copied to the master, and the filters are applied
    # last, so a keepout zone never feeds back into the layers as an obstacle.
    # Two consequences worth knowing before drawing a mask:
    #   - inflation has already run by then, so the KeepoutFilter inflates the
    #     mask itself (2026-10) with THIS costmap's inscribed radius and the
    #     inflation_layer values below — a zone gets the same INSCRIBED band
    #     and gradient as a wall. Draw the forbidden area only, no margin: a
    #     margin in the mask is now applied twice. Until then keepout cells
    #     were bare LETHAL, and Smac's centre-cell check let a path through
    #     any gap between two zones that was one free cell wide. is_path_valid
    #     sees a zone twice over: its inscribed band through the centre test,
    #     its LETHAL core through the footprint perimeter test.
    #   - clear* services never touch filter output: a keepout is a rule, not
    #     an observation.
    # Only the global costmap runs the filter (2026-09). The controller's local
    # costmap does not, so RPP cannot reject a path for grazing a zone edge;
    # the planner alone keeps the robot out. Adding the filter to the local
    # costmap too (nav2's recommendation) is a follow-up once the zones have
    # been driven against for a while.
    filters: ["keepout_filter"]

    keepout_filter:
      plugin: "syncai_costmap_2d::KeepoutFilter"
      enabled: true
      # Relative on purpose: CostmapFilter joins it with the costmap node's
      # PARENT namespace (/<robot_id>/global_costmap -> /<robot_id>), so it
      # meets costmap_filter_info_server's publisher in the robot namespace,
      # the same way StaticLayer's `map` reaches /<robot_id>/map. The mask
      # topic itself is not configured here -- it arrives inside the
      # CostmapFilterInfo message (keepout_filter_mask) and is resolved the
      # same way.
      filter_info_topic: "costmap_filter_info"
      # Only used when the mask frame differs from `map`; ours is stamped
      # `map` by filter_mask_server, so this is the fallback path's tolerance.
      transform_tolerance: 0.1
      # The filter is on unconditionally, so a mask edited later only needs
      # filter_mask_server/load_map, not a planner restart. That costs nothing
      # on a map without a keepout: costmap_filter_info.launch.py writes a
      # blank (all-unknown) mask of the gridmap's geometry and serves it, and
      # unknown mask cells are skipped. "Filter mask was not received" every
      # 2 s therefore means the `keepout` pane is actually down (or the
      # gridmap.yaml it sizes the mask from is unreadable) -- until 2026-09-30
      # it was the expected noise on every map without a mask.

    static_layer:
      plugin: "syncai_costmap_2d::StaticLayer"
      enabled: true
      map_subscribe_transient_local: true

    obstacle_layer:
      plugin: "syncai_costmap_2d::ObstacleLayer"
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 2.0
      combination_method: 1            # 0=Overwrite, 1=Maximum
      observation_sources: scan pointcloud
      scan:
        # Merged 360deg scan from ros2_laser_scan_merger (-> /<robot_id>/scan);
        # absent on the real 3D stack, so this source simply stays silent.
        topic: scan
        # TF frame (overridden by the launch file with <robot_id>/ prefix)
        sensor_frame: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        # true: laser rays that return no hit (inf, e.g. open warehouse space)
        # are treated as range_max so they still raytrace-clear up to
        # raytrace_max_range. With false those rays are dropped, so a removed
        # obstacle whose ray now reads inf never gets cleared -> residual cost.
        inf_is_valid: true

      # 3D LiDAR obstacle source: Point-LIO's per-scan body cloud, used to catch
      # obstacles the 2D scan plane misses (e.g. another robot's chassis).
      pointcloud:
        # pointlio_node publishes body_cloud relative to its namespace, so with
        # the robot_id-namespaced launch this resolves to
        # /<robot_id>/pointlio/body_cloud. Relative name (like `scan` above):
        # the planner_server runs in the <robot_id> namespace, so each robot
        # only marks its own cloud even on a shared DDS domain.
        topic: pointlio/body_cloud
        # Leave sensor_frame empty on purpose: the observation buffer then uses
        # the cloud's own header frame_id (<robot_id>/pointlio_body, Point-LIO's
        # body_frame) as the raytrace origin, so this source needs no per-robot
        # launch-file frame override. The TF chain resolves via the localizer's
        # map -> <robot_id>/pointlio_odom (i.e. only after relocalize).
        sensor_frame: ""
        data_type: "PointCloud2"
        marking: true
        clearing: true
        # Heights are evaluated in the costmap global frame (map) = metres above
        # the floor (the TF chain keeps z; a floor point lands at map z ~ 0).
        # Slice a robot-height band: skip the ground plane, keep the chassis.
        min_obstacle_height: 0.1
        max_obstacle_height: 1.5
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0

    inflation_layer:
      plugin: "syncai_costmap_2d::InflationLayer"
      enabled: true
      # Global costmap only; the controller's local costmap has its own block
      # and is deliberately untouched (RPP's collision check and cost-scaled
      # speed run on that one).
      #
      # This band is what keeps Smac's paths off the walls. Cost decays as
      # 252 * exp(-cost_scaling_factor * (d - inscribed)) out to
      # inflation_radius and is 0 beyond it, and Smac pays
      # (1 + cost_travel_multiplier * cost / 252) per metre. Two regimes:
      #   - a passage narrower than 2 * inflation_radius has cost all the way
      #     across, and the cheapest line is its centre;
      #   - in wider space the band edge is a cliff and the path rides it,
      #     inflation_radius from the wall (robot centre to wall).
      # So inflation_radius is, directly, the wall clearance in open space.
      # 0.5 -> 0.8 (2026-10): at 0.5 the body edge passed ~0.27 m from walls
      # (half-width 0.22 + padding 0.01); at 0.8 it is ~0.57 m.
      # cost_scaling_factor 2.0 -> 1.5 with it, so the cost is still ~42% of
      # lethal at the band edge (exp(-1.5 * 0.57)) instead of fading out
      # (2.0 gives 32%). That keeps the centring pull in narrow passages.
      # The price: a route through a passage narrower than 1.6 m now costs
      # at least ~40% more per metre along it (more the narrower it is), so
      # the planner accepts a somewhat longer way round to avoid one. Nothing
      # here blocks a passage: only >= INSCRIBED (within 0.25 m of a lethal
      # cell: half-width 0.22 + padding 0.03) is lethal to the planner.
      # is_path_valid tests that and, on top, the padded perimeter at the
      # path heading +- heading_margin (see is_path_valid: above), which is
      # what a lethal cell 0.25-0.45 m off the path trips. Also must stay >=
      # the padded footprint's circumscribed radius (~0.455 m, see the
      # footprint comment above).
      inflation_radius: 0.8
      cost_scaling_factor: 1.5
