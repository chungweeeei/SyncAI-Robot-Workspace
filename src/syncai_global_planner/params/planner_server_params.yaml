# Parameters for the syncai_global_planner "planner_server" node and its internal
# global costmap node. The /**/ wildcard keys match the node names in any
# namespace, so the same file works for any robot_id: the launch file reads
# robot_id from config/system.ini and uses it as the node namespace. Topic
# values below are RELATIVE names — they get the namespace prefix
# automatically (e.g. map -> /<robot_id>/map). TF frame names are NOT
# namespaced by ROS, so the launch file overrides robot_base_frame /
# sensor_frame with the <robot_id>/ prefix at launch time — the values below
# are only fallbacks when the node is run without the launch file. The
# costmap's global_frame stays "map".
/**/planner_server:
  ros__parameters:
    use_sim_time: false

    # Warn if a plan takes longer than 1/expected_planner_frequency seconds.
    # This is a warning threshold only — nothing throttles or aborts on it.
    # 20 Hz (50 ms) is a generous ceiling: the BT asks for a plan once per
    # goal and again only when is_path_valid has said the current one is
    # blocked for blocked_time (move.xml), so the warning is a canary for a
    # pathological search, not a cadence anyone is trying to hit. An Octo3D
    # plan (~1 ms for 25 m, ~30 ms 1F -> 2F on dp1f_1012) lands well under it.
    expected_planner_frequency: 20.0

    # Re-send the last plan on `plan` this often (Hz), restamped; 0 = publish
    # only when a plan is made. The BT plans once per goal and on a blocked
    # path only (move.xml), so without this a viewer that subscribes
    # mid-drive never sees the route.
    plan_republish_rate: 1.0

    # A route that no navigation has planned or checked (is_path_valid, 1 Hz
    # while a BT runs) for this long is dropped and an empty `plan` sent (s;
    # 0 = never). task_runner clears a route on a success or a cancel; after
    # a failure it stays up this long, so the operator sees where the robot
    # gave up, and then goes -- until 2026-10-25 it stayed until the next
    # goal (on dp, 1.5 h after the task had ended).
    plan_idle_clear_time: 30.0

    # One planner since 2026-10-28: Octo3D, the OctoMap surface planner for
    # the quadruped (OctomapPlanner3D, below), which move.xml / dock.xml
    # name. Until then GridBased (SmacPlanner2D on the global costmap) was
    # loaded beside it for 2D maps, with NavFn and StraightLine built as
    # fallbacks, and a goal ran the 2D or the *_3d.xml trees by Octo3D's
    # map_available; all of it went with 2D navigation, as did the
    # costmap_wait_timeout and is_path_valid.footprint_check /
    # heading_margin parameters, which only a planner on the costmap used.
    # is_path_valid is answered by Octo3D on its dynamic overlay. With one
    # planner loaded an empty planner_id falls back to it (getPlan()). A map
    # without octomap.bt logs one error and every goal on it fails
    # (PLAN_FAILED).
    planner_plugins: ["Octo3D"]

    # OctomapPlanner3D: A* over the floor surfaces of map/<name>/octomap.bt
    # (the tree clean_map writes beside map.pcd), for the quadruped. The tree
    # is reduced once at startup to a multi-layer 2.5D surface map -- every
    # column's floor surfaces, each judged with the geometry below -- and a
    # path only ever runs over cells that passed, so it cannot leave the
    # ground, climb a wall, cross a stair riser or a kerb, or jump floors; it
    # takes ramps. The one way between floors is a stair the robot walked
    # while mapping: poses.txt next to the tree turns each flight on the track
    # into a stair link (stair_* below). The 2D costmap is used for its frame
    # id only. Offline the
    # same code runs as `octomap_planner_3d_cli map/<name>/octomap.bt --stats`
    # (also --check-poses, --dump-image, --plan); that is where these values
    # were set, on dp1f_1012_v2 (2026-10). The README's OctomapPlanner3D
    # section has the algorithm.
    Octo3D:
      plugin: "syncai_global_planner/OctomapPlanner3D"

      # Set by the launch file to map/<name>/octomap.bt, derived from the
      # directory of [map] pcd (no INI key: the backend's map switch writes
      # [map] name alone). Empty or missing file = every Octo3D plan fails
      # with map_not_loaded, nothing else is affected. A map switch replaces
      # it through /<robot_id>/planner_server/Octo3D/load_map
      # (nav2_msgs/srv/LoadMap, map_url = the new octomap.bt; 2026-10-19),
      # which also writes the new path back here; `ros2 param set` on it is
      # refused, pointing at that service.
      octomap_file: ""
      # The map's track, for the stair links. Empty = poses.txt next to
      # octomap_file (map/<name>/poses.txt, written by every save_maps with
      # patches). Missing = a warning and no links: the floors stay apart.
      # Boot only: a load_map reload always takes poses.txt from beside the
      # new tree.
      poses_file: ""

      # The server hands the planner the planar map -> base_link pose, whose
      # z is always 0, so the robot's real height comes from TF to this frame
      # (the LIO body, which keeps z; overridden by the launch file with the
      # <robot_id>/ prefix) minus lidar_height, the sensor's height above the
      # ground -- the same number clean_map was run with (map_clean.recipe.json
      # lidar_height). Without the TF the request's z is used, which is right
      # on the ground floor and wrong upstairs.
      body_frame: pointlio_body
      lidar_height: 0.481

      # request: the goal's own z picks the floor, within snap_z_window. The
      # backend sends z = 0, which lands on the ground floor (its surface is
      # ~0.5 m below the map origin, the first lidar pose). start: use the
      # robot's floor instead, for sending a 2D goal while it is upstairs.
      goal_z_mode: request

      # ---- surface map (baked in at startup; a change needs a restart) ----
      # Hard clearance: every column within this radius of a cell must hold a
      # usable surface, else the cell is blocked -- the implicit inflation of
      # walls, drop-offs and unfillable holes. 0.25 m = the padded
      # half-width of the footprint (the 2D global costmap's inscribed radius
      # until 2026-10-28, so Octo3D and GridBased refused the same gaps), and
      # the local costmap's terrain_layer robot_radius: change them together.
      robot_radius: 0.25
      # Non-occupied voxels needed above a surface for the body to fit. The
      # lidar top is ~0.55 m up; 6 cells at 0.1 m.
      body_clearance: 0.6
      # Largest height change between neighbouring cells: the legs' step
      # capability, 0.17 m = a standard riser, which the G23 was driven up
      # while mapping dp1f_1012 (0.10 until 2026-10-14, chosen to refuse
      # stairs, which the stair links below now handle). Rounded to whole
      # cells: at res 0.1 this is two cells, so a 0.15 m kerb is one step
      # and a 0.5 m ledge is not.
      max_step_height: 0.17
      # Tilt limit of the plane fitted under the footprint disc. With single
      # risers allowed this is what refuses a stair flight (~30 deg): a disc
      # whose surfaces span at most one step is level ground with a kerb and
      # is not fitted; a flight shows two risers in a 0.5 m disc and is. Also
      # the only guard against a shallow stair with 0.1 m risers (a 19 deg
      # "ramp" at this resolution). A fit, not max-minus-min: a flat floor
      # read cell by cell looks 11 deg tilted across a 0.5 m disc.
      max_slope_deg: 20.0
      # Share of the footprint disc's columns that must hold a usable
      # surface. The rest may be gaps -- columns nothing was ever seen in --
      # never a wall, a drop or an obstacle, which block outright. The lidar
      # sees the floor at grazing angles only, so the observed floor is
      # sparse: with every column required (the rule until 2026-10-14) 13 %
      # of dp1f_1012's own keyframes stood on "untraversable" ground. The
      # missing share is also paid for in cost (gap_cost_weight). 1.0 = the
      # old rule.
      footprint_min_support: 0.8
      # Unknown voxels tolerated in the clearance band (-1 = all). The lidar
      # looks mostly outward from 0.48 m up, so the band is observed only where
      # the robot passed; a strict value punches holes in exactly the
      # corridors the path needs. An occupied voxel in the band always rejects.
      max_unknown_clearance_cells: -1
      # The voxel right above a floor must have been observed free: a floor
      # the robot stood on always has, a ceiling / slab underside seen from
      # below never has. 1 removed every ceiling island of the multi-storey
      # dp1f_1012_v2 (748 -> 153 components); 0 disables.
      min_known_free_above: 1
      # Floor voxels exist only where a scan hit them, and the lidar's lower
      # field of view (-7 deg) cannot see the floor nearer than ~4 m, so the
      # floor under the robot's own track is seen only from afar: ~5 % of
      # the columns under it are empty. A column with no surface whose
      # neighbours within the radius agree on a height from three of the four
      # quadrants around it, with at least min_support of them, and with no
      # occupied voxel near that height, gets an inferred surface. The
      # quadrant rule keeps a floor edge or a balcony from being extended
      # (one-sided support). Two passes close a hole from the rim inward.
      # dp1f_1012_v2: 86 % of the keyframes on a traversable cell with this,
      # 74 % without.
      hole_fill_radius: 0.3
      hole_fill_min_support: 0.5
      hole_fill_passes: 2
      # Reach of the soft clearance cost, from the traversable boundary (which
      # already sits robot_radius from the wall): 0.55 puts the band edge
      # 0.8 m from the wall, the 2D global costmap's inflation_radius (until
      # 2026-10-28), so both planners kept the same distance.
      clearance_cost_radius: 0.55
      # ---- step edges and kerbs (2026-10-29, baked in at startup) ----
      # A step within max_step_height is one piece of ground, and a route
      # used to run along a kerb's edge with a pair of feet on each side: on
      # outdoor_1027 the G23 fell twice at the same kerb (sim, 2026-10-28).
      # Every traversable cell next to a step is a step edge with a cost
      # band this far out (robot_radius and a foot's reach beyond the body),
      # paid for by step_edge_cost_weight below, and the cells on the low
      # side of a step are strung into lines: one at least kerb_min_length
      # long with kerb_min_sure_cells cells of a two-cell step (0.1 m or
      # more of true height, which no slope under max_slope_deg makes; a
      # one-cell step is as often a slope's contour line) and level ground
      # behind it is a kerb, crossed on kerb links only (kerb_* below).
      step_edge_cost_radius: 0.4
      kerb_min_length: 1.0
      kerb_min_sure_cells: 3

      # ---- stair links (baked in at startup) ----
      # The geometry rules refuse every stair (step and slope), and relaxing
      # them map-wide would pass every 0.2 m kerb and drop-off too. Instead a
      # stretch of the map's own track that leaves one floor and arrives on
      # another, at least stair_min_rise higher or lower and at most
      # stair_max_length of track later, becomes a link the search may take
      # both ways and the path follows keyframe by keyframe (loops from turns
      # and waits on the landings cut out). Links end only in components of
      # stair_anchor_min_area or more: a stairwell's landings rarely survive
      # the rules (dp1f_1012: small, walled, the air above never observed),
      # so a link spans the whole stairwell, floor to floor. Stairs the robot
      # never walked stay refused. dp1f_1012 (2026-10-14): one 1F -> 2F link
      # over the switchback stair (four flights, 5.3 m, 39 m of track after
      # the loop cut), plus two over a 0.4 m step on 2F.
      stair_links: true
      # Above a kerb (0.15) and one stair step, below a flight between landings.
      stair_min_rise: 0.3
      # dp1f_1012's stairwell took 32 m of track with the turns on its landings.
      stair_max_length: 60.0
      # Track ground (pose z - lidar_height) to a cell's top face.
      stair_anchor_z_window: 0.3
      # m2. The two storeys of dp1f_1012 are 1200 and 330, the stairwell's
      # islands at most ~11.
      stair_anchor_min_area: 10.0
      # Three-point moving-average passes over a walked link's points after
      # the loop cut: a hand-driven track weaves by centimetres and the body
      # pitches on a flight. 0 = the raw keyframes.
      stair_smooth_passes: 2
      # The track says where a stair is, not how to climb it (2026-10-19): a
      # single flight becomes a row of straight links across its width -- the
      # surfaces beside the walked stretch are fitted with a plane, whose
      # gradient is the uphill direction, and a line is marched up it from
      # every lower-floor cell near the walked foot that reaches the upper
      # floor. The search picks the entry, so a route meets the stair where
      # its own line crosses it and climbs facing the risers. dp's 2F flight:
      # one walked link 9 deg off the stair's axis became 24 straight ones,
      # and a 27 deg turn at the stair head went away. false = one link along
      # the walk (the 2026-10-14 behaviour).
      stair_straight: true
      # Longest stretch of track (m, xy) taken as one straight flight; a
      # switchback stairwell (dp: 30 m, dp1f_1012: 32 m) keeps its walked link,
      # and a startup note says so.
      stair_straight_max_flight: 8.0
      # Surfaces within this of the walked stretch, at heights between the two
      # floors, fit the plane.
      stair_straight_fit_radius: 1.0
      # How far either side of the walked foot entries are tried: the stair's
      # width the planner may use. dp's 2F flight is 2.6 m wide.
      stair_straight_half_width: 2.0
      # Longest level run a line may make between two rises: the ~robot_radius
      # of blocked floor the footprint rule leaves before the first riser and
      # after the last. A landing longer than this ends the flight.
      stair_straight_exit_reach: 0.6
      # A multi-flight stretch (dp's switchback stairwell) is laid as flights
      # and landing corners read off the map (2026-10-21), not as the walk:
      # the walk's height profile gives the landings, each flight's direction
      # comes from the well's wall (the straighter side of the cross-sections;
      # all flights of one well share one orientation), its axis from the
      # cross-sections' middle, and consecutive flights are joined on the
      # landing with explicit corners -- one at the axes' crossing for an L,
      # two (0.5-1 m out, across, in) for a U -- plus a 0.5 m lead-in and
      # lead-out. Nothing on it is smoothed. dp: 4 flights 1.3-1.6 m wide,
      # three U landings, 6 turns, every flight within 0.01 m of its axis.
      # false = the walked link, centred below when stair_centre is on.
      stair_flights: true
      # A level run of the walk at least this long (m) is a landing.
      stair_flights_landing_min_len: 0.5
      # A segment of the walk flatter than this is level (dp's flights ~30
      # deg, its landings under 5).
      stair_flights_landing_slope_deg: 15.0
      # The straight run before the first foot and past the last head (m).
      stair_flights_lead: 0.5
      # The disc the body sweeps turning in place at a U landing's corners:
      # the padded footprint's circumscribed radius (0.38 x 0.25 m, below).
      # Both corners go the same distance out, so the leg between them is
      # square to the flights, at the distance that leaves the most room round
      # the two turns and robot_radius either side of the leg -- walls, newels
      # and anything on the landing read off the octree at body height
      # (2026-10-24; before, 0.5-1 m from the walk, which slanted dp's second
      # leg 0.22 m past the newel). dp's three landings are 0.95-1.05 m deep,
      # under this disc plus the hind legs' half body: every corner is 0.5 m
      # out and 0.02-0.10 m short, and a startup note says so per landing.
      stair_flights_turn_radius: 0.455
      # A walked link (a switchback stairwell) is centred in the well
      # (2026-10-20): at every point the cross-section square to the walk is
      # measured on the surface map -- columns holding a surface within
      # stair_centre_dz of the point's tread, until a wall or the drop to the
      # neighbouring flight -- and the point moves to its middle, the shifts
      # median-filtered and smoothed along the link. A side longer than
      # stair_centre_max_half_width is open floor, and the point stays. dp's
      # stairwell: 58 of 66 points moved, mean 0.09 m, at most 0.30 m (the
      # second flight, walked along its inner rail). false = the operator's
      # own line.
      stair_centre: true
      stair_centre_dz: 0.25
      stair_centre_max_half_width: 1.5
      stair_centre_max_shift: 0.6
      # Stairs the track never took are detected off the surface map
      # (2026-10-25): the surfaces along each large component's edge within
      # stair_detect_floor_band of it belong to that floor, the rest of the
      # rejected surfaces (bar clearance_occupied) form blobs by the step
      # rule, and a blob touching two floors at least stair_min_rise apart
      # is laid as a walked stair is -- straight links or flights and
      # landing corners, read off the map -- from a stand-in walk through
      # its middle; one neither reads, or narrower than
      # stair_detect_min_width, stays unlinked with a startup note. A blob a
      # track link crosses is skipped. dp: the U stair in the middle of the
      # building (1F -> 2F, never walked while mapping) and the straight
      # stair at (12, 25); a route from the first's foot to its head went
      # from 55 m round by the stairwell to 17 m. false = the track's stairs
      # only.
      stair_detect: true
      # Above one riser (0.17, 0.2 in 0.1 m voxels), below two.
      stair_detect_floor_band: 0.25
      # The padded footprint's width (2 x robot_radius) and a little.
      stair_detect_min_width: 0.6
      # Smallest blob read (m2): three steps a metre wide.
      stair_detect_min_area: 0.5
      # Kerb links (2026-10-29): at every cell of a kerb the surface map
      # found (step edges above) a straight crossing square to it, kerb_lead
      # either side (the body is 0.76 m long: half a metre lines the hind
      # feet up before the fore feet reach the edge), over ground that stays
      # level but for the kerb; the search crosses the kerb on these only and
      # the shortcut never spans one, so the path meets a kerb square and
      # once. The kerb's direction at a cell is fitted to its cells within
      # kerb_fit_radius. false = a kerb is crossed cell to cell at any angle,
      # the behaviour before 2026-10-29.
      kerb_links: true
      kerb_lead: 0.5
      kerb_fit_radius: 0.5

      # ---- search (dynamic) ----
      # Move length x (1 + weight * exp(-scaling * clearance_d)) inside the
      # band, x 1 beyond: the costmap's inflation curve (cost_scaling_factor
      # 1.5) and Smac's cost_travel_multiplier (1.0) in one. A multiplier, not
      # a per-node penalty, so diagonals are not cheaper per metre.
      clearance_cost_weight: 1.0
      clearance_cost_scaling: 1.5
      # Prefer observed floor over hole-filled floor, mildly.
      inferred_cost_multiplier: 1.2
      # Move length x (1 + weight * gaps / footprint columns): prefer ground
      # seen all of, take sparse ground when that is what there is.
      gap_cost_weight: 1.0
      # 1.0 = optimal (3D Euclidean is admissible here). A 50 m plan on
      # dp1f_1012_v2 takes a few ms at 1.0; raise only if that ever matters.
      heuristic_weight: 1.0
      max_iterations: 2000000
      max_planning_time: 2.0
      # Snap: nearest traversable cell within the xy radius (Smac's tolerance)
      # whose top face is within the z window of the height hint. 1.0 covers
      # the 0.48 m lidar-to-floor offset of a goal at the robot's height and
      # is far below the spacing of two floors (~5.7 m here).
      snap_xy_radius: 0.5
      snap_z_window: 1.0
      # Nothing within snap_z_window and only one traversable layer within
      # snap_xy_radius: snap to it at any height. A goal at z = 0 (the
      # backend) on ground that slopes away from the map origin otherwise
      # fails goal_unavailable once the ground is 1 m off -- outdoor_1027's
      # far end is 1.4 m below it. Where floors overlap the hint still picks.
      snap_single_layer: true
      # Factor on a stair link's 3D length: a level detour up to this many
      # times longer wins over the stairs. >= 1 (keeps the heuristic admissible).
      stair_cost_multiplier: 2.0
      # Move length x (1 + weight * exp(-scaling * step_d)) inside a step
      # edge's band (step_edge_cost_radius): 2.0 on the edge, 1.14 at the
      # band's 0.4 m edge. A one-cell step, a kerb or a contour line alike,
      # gets step_edge_one_cell of the weight: a route still crosses contour
      # lines as it likes and only stops running along them. What the band
      # beats: outdoor_1027's pavement shortcut saved 0.36 m of 72 over ~4 m
      # along the kerb. A kerb link's length is paid at kerb_cost_multiplier
      # (>= 1): slower than floor, not a flight.
      step_edge_cost_weight: 1.0
      step_edge_cost_scaling: 5.0
      step_edge_one_cell: 0.5
      kerb_cost_multiplier: 1.5

      # ---- dynamic obstacles (2026-10-21) ----
      # The surface map is static, so on its own a replan returns the route
      # a person is standing on, and the global costmap cannot judge a 3D
      # path (it has no layers at all since 2026-10-28; before that,
      # upstairs a path lay over the ground floor's gridmap). This block is
      # the planner's own memory of what the lidar sees that the map does
      # not -- what the 2D global costmap's obstacle layer was to GridBased:
      # every return in the band above the surface it lies on
      # marks that cell (the surface is picked by height, so two floors
      # never see each other's people), rays clear the marks they cross,
      # and marks age out. The search and the shortcut keep off the marks
      # and block_radius round them and pay for the band beyond with the
      # clearance cost above, so a replan detours; is_path_valid asks this
      # planner for its own paths (planner_server asks the planner that
      # made the last plan), so move.xml's IsPathValid / blocked_time /
      # replan work on it as they did on the 2D costmap. See
      # dynamic_overlay.hpp for the three decisions that shape it: only
      # traversable cells are marked (a wall's returns land in the 0.25 m
      # footprint ring, and inflating those would narrow every corridor and
      # close every door under ~0.9 m), returns within self_radius are
      # ignored (the robot's own legs sit in the band), and marks decay (no
      # ray reaches what the robot walked away from).
      dynamic:
        # false = the 2026-10-20 behaviour: no mark, every path valid, no
        # replan on a 3D map. The subscription is not created. Not dynamic.
        enabled: true
        # The cloud the costmaps read: motion-compensated, stamped in the
        # LIO body frame (the lidar). Relative, so /<robot_id>/... . Not
        # dynamic.
        topic: pointlio/body_cloud
        # How long a cloud may wait for map -> body (map <- pointlio_odom <-
        # pointlio_body resolves only after relocalize). Not dynamic.
        transform_tolerance: 0.3
        # Planar distance from the sensor within which a return marks: the
        # 2D global obstacle layer's obstacle_max_range (until 2026-10-28),
        # so a 3D map replanned round a person at the distance a 2D one did.
        obstacle_max_range: 2.5
        # Within which a return's ray clears; a return further out clears
        # along its first 3 m and marks nothing. The obstacle layer's value.
        raytrace_max_range: 3.0
        # Returns closer than this to the sensor, in the plane, are neither
        # marks nor rays. The robot's own feet are in every map as 0.2-0.3 m
        # clusters ~0.54 m from the lidar (0.5 m in the plane): inside the
        # band, and without this they marked the cells under the robot on
        # every scan, so the path's first poses read blocked for good and
        # the BT replanned every 10 s with nothing to change.
        self_radius: 0.6
        # Band above a surface's top face in which a return is an obstacle:
        # (min_obstacle_height, body_clearance) -- the terrain layer's band
        # and the surface map's clearance, one calibration. The top face is
        # quantised to the voxel, so 0.1 keeps the floor's own returns out.
        min_obstacle_height: 0.1
        # Seconds a mark lives unrefreshed and uncleared. Must outlast
        # IsPathValid's blocked_time (10 s) plus a plan plus the stretch of
        # the detour during which the mark is out of view; three times
        # blocked_time. A mark in view is refreshed or raytraced away every
        # scan, so this only governs what the robot cannot see. Longer, and
        # a person the robot walked away from shapes the next goal's route
        # (the new-goal clear_overlay in move.xml guards that too); the
        # 2D obstacle layer (until 2026-10-28) never forgot, only rays
        # cleared it. The terrain
        # layer's 2 s serves the 5 Hz controller, a different job.
        obstacle_memory: 30.0
        # Cells within this distance of a mark are not traversable for the
        # search and read blocked to is_path_valid; it is also the disc
        # round the robot's own cell that the dilation does not block.
        # Between the inscribed radius (0.25, the surface map's own wall
        # inflation) and the circumscribed one (0.455); the 2D footprint-
        # perimeter test at the path heading +-0.35 rad reaches ~0.36 m
        # sideways, so a 3D map refuses a passage beside a person at the
        # width a 2D one does. Beyond it the clearance cost above applies
        # out to clearance_cost_radius, as for a wall.
        block_radius: 0.35

      # ---- keepout zones (2026-10-23) ----
      # What map/<name>/keepout.yaml + keepout.pgm are to the 2D global
      # costmap's KeepoutFilter, which this planner never reads: the zones
      # of a 3D map are map/<name>/keepout.json beside octomap.bt --
      # polygons in the map frame, each with a z band naming its floor
      # (keepout_zones.hpp has the format; a 2D image cannot say which of
      # a site's storeys a pixel forbids). Read with the tree at boot and on
      # every load_map, rasterised on the surface map, and read beside the
      # dynamic overlay's marks by the goal snap, the search, the shortcut
      # and is_path_valid, so a zone is kept off exactly as a person is. A
      # start inside a zone fails start_in_keepout; a stair link with a
      # point in a zone is never taken. Reload an edited file with
      # planner_server/Octo3D/load_keepout (nav2_msgs/LoadMap, map_url =
      # the file, "" = no zones); clear_overlay leaves the zones alone.
      keepout:
        # The file. Empty = keepout.json beside octomap_file, which is what
        # every map uses; load_map always takes the new tree's own and
        # writes it back here, and `ros2 param set` is refused (call
        # load_keepout). Absent = no zones, one info line.
        file: ""
        # Ring round a zone's core within which cells are blocked: the
        # robot's radius, the costmap's inscribed radius that KeepoutFilter
        # inflates the 2D mask with, so a zone closes a gap narrower than
        # the robot exactly as a wall does and the editor draws the forbidden
        # area only, no margin. = robot_radius above; change the two
        # together. The clearance cost applies beyond it as for a wall.
        # Dynamic: re-rasterised on change.
        block_radius: 0.25

      # ---- output ----
      # Line-of-sight shortcut of the cell chain (supercover, step-continuous,
      # never closer to the boundary than the search was), then a resample
      # at interpolation_resolution with z read from the surface. Poses carry
      # z = the floor's top face + path_z_offset; the 2D controllers ignore z.
      shortcut: true
      interpolation_resolution: 0.1
      path_z_offset: 0.0

# The global costmap is an internal node created by planner_server
# (constructed as a plain node named "global_costmap").
#
# It has no layers since 2026-10-28. Octo3D reads no cells; what planner_server
# and Octo3D take from it is its global frame, its TF buffer, the robot pose
# (getRobotPose / transformPoseToGlobalFrame) and its callback group, which
# Octo3D's dynamic-overlay TF filter runs on because it is the thread that
# takes /tf (a thread of its own wedged the planner's TF on robot01). Until
# then it ran static -> obstacle -> inflation plus the keepout filter, the
# costmap GridBased (SmacPlanner2D) planned on and is_path_valid judged 2D
# paths on; that went with 2D navigation, together with map_server and the
# keepout mask server that fed it. `plugins` is left out on purpose: the
# default is no layer (CostmapROS), and an empty YAML list cannot be typed.
# With no layer the grid stays at its 5 x 5 m default and never changes.
/**/global_costmap:
  ros__parameters:
    use_sim_time: false

    # Frames (robot_base_frame is overridden by the launch file with
    # <robot_id>/ prefix; global_frame stays "map")
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3

    update_frequency: 1.0
    publish_frequency: 1.0

    rolling_window: false
    track_unknown_space: true
    resolution: 0.05
