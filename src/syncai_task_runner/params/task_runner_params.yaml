# One node, four action servers (navigate_to_pose from nav2_msgs,
# navigate_to_goal from syncai_common and, since 2026-11, the patrol route's
# navigate_through_poses from nav2_msgs and its syncai_common twin
# navigate_through_goals) built from one navigator template, so every
# parameter below -- goal_blackboard_id, path_blackboard_id, the
# BtActionServer timings -- is shared by all four: same blackboard keys, one
# navigation at a time. default_bt_xml (move.xml) is the first two's; the two
# routes have default_nav_through_poses_bt_xml (patrol.xml).
/**/task_runner:
  ros__parameters:
    use_sim_time: false

    # Frames / topics (base_frame is overridden by the launch file with the
    # <robot_id>/ prefix from config/system.ini; global_frame stays "map")
    global_frame: map
    base_frame: base_link
    odom_topic: odom
    transform_tolerance: 0.1

    # BT engine loop period in ms: 50 ms => the whole tree is ticked at 20 Hz.
    # This value also becomes every BT node's per-tick spin budget (halved).
    bt_loop_duration: 50
    # How long (ms) a BT action/service client waits on its server per goal:
    # an action's goal ack, the cancel and the result in halt(), and a whole
    # service call. A node with its own server_timeout in the XML overrides it.
    # 100 since 2026-11 (nav2's 20 until then). 20 ms is one spin of the node
    # (half of bt_loop_duration, 25 ms, caps one wait), so a single late
    # answer failed the node: an ack late on a CPU Point-LIO saturates ended
    # the goal UNKNOWN "did not acknowledge", and the context
    # ClearEntireCostmap in move.xml / patrol.xml (no server_timeout of their
    # own) failed their RecoveryNode -- and with it the goal, the retries
    # unused -- when the costmap mutex or the planner's executor was busy.
    # The ack and service waits stay non-blocking past 25 ms per tick (the
    # node returns RUNNING), so this costs no tick time. halt() does block:
    # up to this for the cancel and again for the result, so a cancel holds
    # the BT thread up to 200 ms where the 20 ms one gave up first, logging
    # "Failed to get result ... in node halt!" on nearly every cancel because
    # the controller only sees a cancel on its next 50 ms cycle.
    default_server_timeout: 100
    # How long (ms) to wait for an action/service server to appear before failing.
    wait_for_service_timeout: 1000
    # Reload the XML from disk on every goal (handy while editing trees).
    always_reload_bt_xml: false

    # navigate_through_poses: a waypoint the robot has come within this many
    # metres of is passed, and dropped from what a replan plans through (the
    # last one never is; blackboard_keys.hpp, remaining_goals). Wide because
    # a waypoint is passed through, not stopped on: the robot only comes
    # within the path's tracking error of it, more on an MPPI detour round a
    # person. A waypoint missed by this is driven back to only if the path is
    # replanned before the next one is passed. A first value, unmeasured.
    waypoint_passed_radius: 1.0

    # BT node plugins (shared libraries) to load into the factory. Only the
    # nodes ported so far are listed — extend as recovery/condition/control
    # nodes are added. XML tag names must match what each plugin registers.
    # The list is duplicated as the C++ default in syncai_task_runner.cpp;
    # keep the two in sync. The last five are the docking nodes (dock.xml /
    # undock.xml, 2026-10): a library is loaded at startup, but a node and
    # its wait for its server exist only once a tree using the tag is
    # loaded, so they cost nothing at boot -- dock_to_pose and
    # set_motion_key are first waited for at the first dock goal, and a
    # missing one fails that goal (ABORTED, NONE), not this node.
    plugin_lib_names:
      - syncai_compute_path_to_pose_action_bt_node
      - syncai_compute_path_through_poses_action_bt_node
      - syncai_follow_path_action_bt_node
      - syncai_clear_costmap_service_bt_node
      - syncai_pipeline_sequence_bt_node
      - syncai_recovery_node_bt_node
      - syncai_rate_controller_bt_node
      - syncai_is_path_valid_condition_bt_node
      - syncai_globally_updated_goal_condition_bt_node
      - syncai_dock_to_pose_action_bt_node
      - syncai_set_motion_key_service_bt_node
      - syncai_compute_staging_pose_action_bt_node
      - syncai_compute_back_out_pose_action_bt_node
      - syncai_wait_action_bt_node
      - syncai_wait_for_motion_state_action_bt_node
