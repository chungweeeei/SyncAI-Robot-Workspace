/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/robot06/livox/lidar"
            imu_topic:  "/robot06/livox/imu"
            # namespaced so multiple robots can run fast_lio side by side
            odom_frame: "robot06/lidar_odom"
            body_frame: "robot06/lidar_top"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            # Isaac Sim publishes plain PointCloud2 (x,y,z only, no per-point
            # time / ring / intensity), so use the default_handler path:
            # any lidar_type outside 1-4 (AVIA/VELO16/OUST64/MID360) selects it.
            # It treats each frame as an instantaneous snapshot (no motion
            # deskew), which matches how Isaac Sim renders a full scan.
            lidar_type: 5
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            # Sim IMU is assumed co-located with the lidar prim; if you attach
            # the IMU elsewhere on the robot, put the real lidar->IMU offset
            # here and consider re-enabling online estimation.
            extrinsic_est_en:  false
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            # keep TF off: robot06/lidar_top already has a parent in the main
            # TF tree (robot_state_publisher); consume /Odometry instead
            tf_en: false
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            # keep off in sim: interval -1 accumulates every frame in RAM
            pcd_save_en: false
            interval: -1
