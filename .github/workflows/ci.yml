# CI for the robot workspace.
#
# Two jobs, because they answer on very different clocks:
#
#   lint   bare runner, under a minute. Ruff over the Python that is left
#          (syncai_sys_manager + scripts/), and clang-format over the C++ lines
#          a push or PR *changed* -- not over whole files: ~90 of the 228
#          tracked C++ files do not pass `.clang-format` today (the nav2 port and
#          the MPPI / pointlio ports came in unformatted), and reformatting them
#          wholesale is a separate, deliberate commit. Until that commit lands,
#          gating on changed lines keeps new code clean without blocking on old.
#
#   build  the robot image's `dev` target, then `scripts/build.sh` through
#          docker-compose.build.yml -- exactly what a developer runs, so the
#          build that passes here is the one robot01 would load. Both .repos
#          files are imported first: build.sh refuses an empty checkout, and
#          most of dependencies.repos fails nothing when absent (see build.sh),
#          so a build without them would be green and meaningless.
#
# The build runs on an arm64 runner because the robot is a Jetson: the
# Dockerfile's source builds (GTSAM, Sophus, Livox-SDK2, Ceres, Iridescence), the VizionSDK .deb
# and the ros2-rust underlay all have arch-specific paths, and an amd64 build
# would test the one the fleet never runs. arm64 runners are free for public
# repositories, which this is.
#
# The image is built only when the Dockerfile changes. It is pushed to
# ghcr.io/<repo>:dev-<sha256 of the Dockerfile, 16 hex>, and every run first
# tries to pull that tag; a hit skips the build entirely. Until 2026-10 every
# run went through build-push-action against the Actions cache, and even a
# full cache hit paid for downloading the layers and exporting a ~4.5 GB
# tarball into `docker load`, on every push. The tag is content-addressed
# rather than "the Dockerfile changed in this push" (a paths filter), so a
# branch, a re-run or a revert that lands on a Dockerfile some run already
# built pulls it, whichever branch built it.
#
# The hash covers the Dockerfile alone because that is the image's only input
# from the context: every COPY is `--from=` a stage (see .dockerignore for
# what the context would hold). A COPY of a context file added later must add
# that file to the hash, or the image goes stale without anyone noticing.
#
# On a miss the build still uses the Actions cache (mode=max, so the
# intermediate gtsam / sophus / livox / ceres / iridescence / rust-underlay
# stages are cached too -- a `dev`-only edit must not rebuild GTSAM). A run
# that changes one of those stages takes the better part of an hour. The
# cache is ~4.5 GB, so a second big entry can push the repository past the
# 10 GB limit and evict the first -- that shows up as a slow build, not a
# failure. A PR from a fork gets a read-only token, so it builds and loads
# the image without pushing it.
#
# colcon compiles through ccache (2026-10). Before it every run was a clean
# ~11 min build, almost all of it recompiling unchanged sources, with the
# critical path syncai_common -> util -> costmap_2d -> mppi taking most of it,
# so a bigger runner would not have helped. The cache lives in the Actions
# cache and is SAVED only by pushes to main / dev, one entry per branch (the
# previous one is deleted after the save): every run restores the newest of
# its own branch or its PR base, then dev's. Per-PR entries would each be
# another ~1 GB against the 10 GB limit, and LRU would evict the buildx cache
# above first -- it is only read when the Dockerfile changes -- turning the
# next image build into the hour-long one. ccache keys on content, not mtime,
# so a fresh checkout's timestamps do not defeat it, as they would a cached
# build/.
#
# Nothing here talks to a robot: there is no DDS traffic in a build, and the
# one pytest file mocks nmcli.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff / clang-format (changed lines)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: the clang-format check diffs against the PR base or the
      # previous tip of the branch, which a depth-1 clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned for the same reason ruff.toml pins its rule set: the result must
      # not depend on when a tool last released. 14.0.6 is Ubuntu 22.04's
      # clang-format, i.e. what the robot image and ament_clang_format on Humble
      # use; newer majors format a handful of constructs differently.
      - name: Install linters
        run: pipx install ruff==0.17.0 && pipx install clang-format==14.0.6

      - name: ruff check
        run: ruff check .

      # git-clang-format 14 exits 0 even when it has a diff to show, so success
      # is read off its output instead. src/third-party/ and the vcs-imported
      # first-party packages are not tracked here, so a plain `git diff` never
      # sees them.
      - name: clang-format on changed lines
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to diff against (new branch, force push or manual run) -- skipped."
            exit 0
          fi
          out="$(git clang-format --diff "$BASE" -- \
                 'src/*.c' 'src/*.cc' 'src/*.cpp' 'src/*.h' 'src/*.hpp')"
          echo "$out"
          case "$out" in
            *"did not modify any files"*|*"no modified files to format"*) ;;
            *) echo "::error::Changed C++ lines are not clang-format clean." \
                    "Run: git clang-format $BASE  (clang-format 14)"
               exit 1 ;;
          esac

  build:
    name: colcon build + smoke (arm64, robot image)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      # Deleting the superseded ccache entry (see "save the ccache").
      actions: write
    env:
      CCACHE_KEY_PREFIX: ccache-arm64-
    steps:
      - uses: actions/checkout@v4

      # ghcr.io names must be lowercase; the repository's is not.
      - name: Resolve the image tag
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:dev-$(sha256sum Dockerfile | cut -c1-16)" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Any pull failure falls through to the build, not only "manifest
      # unknown": a transient registry error then costs a build, never a red run.
      # Tagged with the name docker-compose.build.yml expects, so its `run`
      # finds the image already loaded and does not try to build it again.
      - name: Pull the robot image
        id: pull
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          if docker pull "$REF"; then
            docker tag "$REF" syncai-robot-base
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $REF yet -- building it."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.pull.outputs.hit != 'true'

      # The source label links the package to this repository, so it inherits
      # the repository's access and the next run's GITHUB_TOKEN can pull it.
      - name: Build the robot image (dev target)
        if: steps.pull.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          # The ghcr ref only: a second, bare `syncai-robot-base` tag would be
          # pushed too, to docker.io/library, and fail the step.
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: type=gha,scope=robot-dev
          cache-to: type=gha,scope=robot-dev,mode=max

      - name: Tag the built image for docker-compose.build.yml
        if: steps.pull.outputs.hit != 'true'
        run: docker tag "${{ steps.image.outputs.ref }}" syncai-robot-base

      # vcstool from the image rather than the runner, so nothing beyond Docker
      # has to exist on it. `export --exact` puts the SHA each `dev` branch
      # resolved to in the log -- dependencies.repos tracks branches, so this is
      # the only record of what a given run actually built. third-party.repos
      # is imported --recursive because direct_visual_lidar_calibration keeps
      # Sophus / nlohmann-json / nanoflann as git submodules; without it those
      # directories are empty and its configure fails on missing headers.
      - name: Import vcs checkouts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/ws" -w /ws syncai-robot-base bash -c '
              set -e
              vcs import --recursive --input third-party.repos
              vcs import --input dependencies.repos
              vcs export --exact src'

      # The key is unique per commit (cache keys are immutable), so it never
      # hits exactly; restore-keys take the newest entry of this branch, or of
      # the PR's base, then dev's. A PR can read its base branch's entries.
      - name: restore the ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CCACHE_KEY_PREFIX }}${{ github.base_ref || github.ref_name }}-
            ${{ env.CCACHE_KEY_PREFIX }}dev-

      # BUILD_ROSDEP=check prints unmet keys without failing (build.sh explains
      # the known noise); a key that really is missing fails colcon below, which
      # is the signal that matters. UID / GID are the runner's, so build/,
      # install/ and log/ stay owned by it -- HOME in the image is
      # world-writable for exactly this (see docker-compose.build.yml).
      #
      # ccache through the environment only, so build.sh and robot01 stay as
      # they are: CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER at a fresh
      # configure, which a CI build/ always is; the cargo packages ignore it.
      # COMPILERCHECK=content rather than the default mtime: the compiler comes
      # from an image that is rebuilt now and then, and a cache must never be
      # trusted across a compiler it did not see. Stats are zeroed first so the
      # step below reports this run's hit rate, not the cache's lifetime.
      - name: colcon build (scripts/build.sh)
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          # `env`, not an assignment: UID is a read-only bash variable.
          env UID="$(id -u)" GID="$(id -g)" \
            docker compose -f docker-compose.build.yml run --rm \
              -v "$RUNNER_TEMP/ccache:/ccache" \
              -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1500M \
              -e CCACHE_COMPILERCHECK=content \
              -e CMAKE_C_COMPILER_LAUNCHER=ccache \
              -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
              --entrypoint bash build -c 'ccache -z && exec scripts/build.sh "$@"' _ \
              --event-handlers console_cohesion+

      - name: ccache stats
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e CCACHE_DIR=/ccache \
            -v "$RUNNER_TEMP/ccache:/ccache" syncai-robot-base ccache -s

      # Saved even when the build failed: the objects compiled before the
      # failure are as good as any. One entry per branch -- the save goes first
      # and the older entries of this branch are deleted after it, so a failed
      # save never leaves the branch with none.
      - name: save the ccache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.ref_name }}-${{ github.sha }}

      - name: delete the superseded ccache entries
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ env.CCACHE_KEY_PREFIX }}${{ github.ref_name }}-
          KEEP: ${{ env.CCACHE_KEY_PREFIX }}${{ github.ref_name }}-${{ github.sha }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 \
              --json key --jq '.[].key' |
            while read -r key; do
              [ "$key" = "$KEEP" ] && continue
              echo "deleting $key"
              gh cache delete --repo "$GITHUB_REPOSITORY" "$key" || true
            done

      # The suite in this repo is this one file; the C++ packages have only the
      # ament linter templates, which are not enforced (see CLAUDE.md, "Tests").
      - name: pytest syncai_sys_manager
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/home/syncrobotic \
            -v "$GITHUB_WORKSPACE:/home/syncrobotic/robot_ws" \
            -w /home/syncrobotic/robot_ws syncai-robot-base bash -c '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /opt/ros2_rust_underlay/install/setup.bash
              source install/setup.bash
              python3 -m pytest -v src/syncai_sys_manager/test/test_wifi_manager.py'

      # --- smoke: does every node come up? ----------------------------------
      # In this job rather than its own, because it needs the install/ the step
      # above just built (a --symlink-install tree that does not survive being
      # uploaded as an artifact). What it checks and why is in the script.
      #
      # Host networking, like robot01, so config/cyclonedds.xml (loopback, one
      # unicast peer) works unchanged. livox_ros_driver2 and driver_manager
      # bind 192.168.1.103 (bringup.yaml host_ip, driver_manager's
      # telemetry_recv_ip) and die on a runner that lacks it, so it is added to
      # lo -- nothing answers on it, which is the no-hardware case the test is
      # about. The INI is mounted over config/system.ini the way compose mounts
      # robotNN.ini, and robot_id ci_smoke is what the script insists on before
      # starting anything. Read-write since 2026-10-19: the script rewrites its
      # `name:` line in place between the 2D and the 3D-only nav pass, as the
      # backend's map switch does on a robot.
      - name: smoke test (every node comes up)
        run: |
          sudo ip addr add 192.168.1.103/32 dev lo
          cat > "$RUNNER_TEMP/system.ini" <<'INI'
          [system]
          robot_id: ci_smoke

          [map]
          name: ci_smoke
          pcd: map/%(name)s/map.pcd
          map: map/%(name)s/gridmap.yaml

          [initial_pose]
          x: 0.0
          y: 0.0
          z: 0.0
          yaw: 0.0

          [sensor.lidar]
          type: mid360
          ip: 192.168.1.172
          INI
          docker run --rm --network host --shm-size 512m \
            --user "$(id -u):$(id -g)" -e HOME=/home/syncrobotic \
            -e CI=true -e ROS_DOMAIN_ID=1 -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            -e CYCLONEDDS_URI=/home/syncrobotic/robot_ws/config/cyclonedds.xml \
            -e ROS_LOG_DIR=/tmp/ros_log -e RCUTILS_COLORIZED_OUTPUT=0 -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/home/syncrobotic/robot_ws" \
            -v "$RUNNER_TEMP/system.ini:/home/syncrobotic/robot_ws/config/system.ini" \
            -w /home/syncrobotic/robot_ws syncai-robot-base \
            .github/scripts/smoke_test.sh

      - name: upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: log/smoke/
