<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Free Viewer</title>
<!-- Template for build_viewer.py, which replaces __META__ / __ROAD__ / __OCC__ / __TRAJ__
     with the packed clouds. Open the generated file, not this one. -->
<style>
  :root {
    --bg: #f4f5f7; --panel: rgba(255,255,255,.92); --text: #1d2330; --muted: #5d6676;
    --line: #d8dce3; --accent: #2f7d4f; --btn: #eef1f4; --btn-hover: #e2e6eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: rgba(28,32,40,.92); --text: #e6e9ef; --muted: #9aa3b2;
      --line: #343a46; --accent: #5cc58a; --btn: #262b35; --btn-hover: #313744;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: rgba(28,32,40,.92); --text: #e6e9ef; --muted: #9aa3b2;
    --line: #343a46; --accent: #5cc58a; --btn: #262b35; --btn-hover: #313744;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: absolute; top: 16px; left: 16px; width: 264px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px;
    backdrop-filter: blur(8px); box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px;
    padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .stats span:nth-child(odd) { color: var(--muted); }
  .stats span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button { flex: 1; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font: inherit; cursor: pointer; }
  button:hover { background: var(--btn-hover); }
  .legend { margin-top: 10px; font-size: 11px; color: var(--muted); }
  .ramp { height: 8px; border-radius: 4px; margin: 4px 0 2px; }
  .ramp-l { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #coord { position: absolute; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  #help { margin-top: 8px; font-size: 11px; color: var(--muted); }
  @media (max-width: 520px) { #panel { top: 8px; left: 8px; right: 8px; width: auto; } #coord { right: 8px; bottom: 8px; } }
</style>
</head>
<body>
<div id="panel">
  <h1 id="title"></h1>
  <div class="sub">OctoMap road-level free space</div>
  <div class="stats" id="stats"></div>
  <div class="row"><label><input type="checkbox" id="showRoad" checked><span class="sw" style="background:linear-gradient(90deg,#1fbf59,#2673f2)"></span>Road free</label></div>
  <div class="row"><label><input type="checkbox" id="showOcc" checked><span class="sw" style="background:#7a7f88"></span>Walls / obstacles</label></div>
  <div class="row"><label><input type="checkbox" id="showTraj" checked><span class="sw" style="background:#e5322d"></span>Mapping trajectory</label></div>
  <div class="row"><label><input type="checkbox" id="heightColor" checked>Colour road by height</label></div>
  <div class="row"><span>Point size</span><input type="range" id="size" min="1" max="6" step="0.5" value="2"></div>
  <div class="row"><span>Wall height cap</span><input type="range" id="wallH" min="0.2" max="2.0" step="0.1" value="2.0"></div>
  <div class="btns"><button id="top">Top</button><button id="persp">3D</button><button id="theme">Light / dark</button></div>
  <div class="legend" id="legend"><div>Road height (m)</div><div class="ramp" style="background:linear-gradient(90deg,#1fbf59,#2673f2)"></div>
    <div class="ramp-l"><span id="zlo"></span><span id="zhi"></span></div></div>
  <div id="help">Left drag rotate · right drag pan · wheel zoom</div>
</div>
<div id="coord">x —  y —</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const META = __META__;
const DATA = { road: "__ROAD__", occ: "__OCC__", traj: "__TRAJ__" };

// int16 centimetres relative to META.center (x, y), absolute z.
function decode(b64) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(u8.buffer), f = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 100;
  return f;
}
const road = decode(DATA.road), occ = decode(DATA.occ), traj = decode(DATA.traj);

document.getElementById("title").textContent = META.name;
const fmt = n => n.toLocaleString("en-US");
document.getElementById("stats").innerHTML = `
  <span>Road free</span><span>${fmt(META.road_n)} voxels</span>
  <span>Road area</span><span>${fmt(META.road_area)} m²</span>
  <span>Wall points</span><span>${fmt(META.occ_n)}</span>
  <span>Resolution</span><span>${META.voxel} m</span>`;
document.getElementById("zlo").textContent = META.zmin.toFixed(2);
document.getElementById("zhi").textContent = META.zmax.toFixed(2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.up.set(0, 0, 1);  // ROS z-up
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;

function applyTheme() {
  scene.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
}

// Road: colour by height (green low -> blue high), or flat green.
const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute("position", new THREE.BufferAttribute(road, 3));
const nR = road.length / 3, cH = new Float32Array(road.length), cF = new Float32Array(road.length);
const lo = new THREE.Color(0x1fbf59), hi = new THREE.Color(0x2673f2), tmp = new THREE.Color();
for (let i = 0; i < nR; i++) {
  const t = Math.min(1, Math.max(0, (road[3 * i + 2] - META.zmin) / (META.zmax - META.zmin || 1)));
  tmp.copy(lo).lerp(hi, t); cH.set([tmp.r, tmp.g, tmp.b], 3 * i); cF.set([lo.r, lo.g, lo.b], 3 * i);
}
roadGeo.setAttribute("color", new THREE.BufferAttribute(cH, 3));
const roadMat = new THREE.PointsMaterial({ size: 2, sizeAttenuation: false, vertexColors: true });
const roadPts = new THREE.Points(roadGeo, roadMat);
scene.add(roadPts);

// Walls: grey. The height cap is a single absolute z (road zmax + slider), not
// per-point local floor, which the packed cloud no longer carries.
const occGeo = new THREE.BufferGeometry();
occGeo.setAttribute("position", new THREE.BufferAttribute(occ, 3));
const occMat = new THREE.PointsMaterial({ size: 2, sizeAttenuation: false, color: 0x7a7f88, transparent: true, opacity: 0.85 });
occMat.onBeforeCompile = s => {
  s.uniforms.zCut = occMat.userData.zCut;
  s.vertexShader = "uniform float zCut;\nvarying float vZ;\n" + s.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvZ = position.z;");
  s.fragmentShader = "uniform float zCut;\nvarying float vZ;\n" + s.fragmentShader.replace("void main() {", "void main() {\n if (vZ > zCut) discard;");
};
occMat.userData.zCut = { value: META.zmax + 2.0 };
const occPts = new THREE.Points(occGeo, occMat);
scene.add(occPts);

// Trajectory, lifted 5 cm so it draws above the road.
const tl = traj.slice(); for (let i = 2; i < tl.length; i += 3) tl[i] += 0.05;
const trajGeo = new THREE.BufferGeometry();
trajGeo.setAttribute("position", new THREE.BufferAttribute(tl, 3));
const trajLine = new THREE.Line(trajGeo, new THREE.LineBasicMaterial({ color: 0xe5322d }));
scene.add(trajLine);

roadGeo.computeBoundingBox();
const bb = roadGeo.boundingBox, ctr = bb.getCenter(new THREE.Vector3()), span = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y);
function topView() {
  controls.target.copy(ctr);
  camera.position.set(ctr.x, ctr.y - 0.001, ctr.z + span * 1.05);
  controls.update();
}
function perspView() {
  controls.target.copy(ctr);
  camera.position.set(ctr.x - span * 0.3, ctr.y - span * 1.0, ctr.z + span * 0.8);
  controls.update();
}
applyTheme(); perspView();

const $ = id => document.getElementById(id);
$("showRoad").onchange = e => roadPts.visible = e.target.checked;
$("showOcc").onchange = e => occPts.visible = e.target.checked;
$("showTraj").onchange = e => trajLine.visible = e.target.checked;
$("heightColor").onchange = e => { roadGeo.setAttribute("color", new THREE.BufferAttribute(e.target.checked ? cH : cF, 3)); $("legend").style.opacity = e.target.checked ? 1 : .35; };
$("size").oninput = e => { roadMat.size = occMat.size = +e.target.value; };
$("wallH").oninput = e => { occMat.userData.zCut.value = META.zmax + +e.target.value; };
$("top").onclick = topView;
$("persp").onclick = perspView;
$("theme").onclick = () => {
  const r = document.documentElement, dark = getComputedStyle(document.body).backgroundColor === "rgb(18, 21, 27)";
  r.dataset.theme = dark ? "light" : "dark"; applyTheme();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

// Map-frame coordinate under the cursor, on the median road plane.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -(META.zmin + META.zmax) / 2), hit = new THREE.Vector3();
renderer.domElement.addEventListener("pointermove", e => {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, hit))
    $("coord").textContent = `map  x ${(hit.x + META.center[0]).toFixed(2)}  y ${(hit.y + META.center[1]).toFixed(2)} m`;
});

addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
