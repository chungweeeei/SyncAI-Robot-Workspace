services:
  robot01:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncai-test-robot
    container_name: robot01
    # Run as the host user so files created in the mounted workspace
    # keep the right ownership. HOME is world-writable in the image.
    user: "${UID:-1000}:${GID:-1000}"
    # Dual-homed:
    #  - syncai-lan (macvlan on the wired factory LAN): the container owns
    #    192.168.0.32, so DDS speaks NAT-free with the Isaac Sim workstation
    #    (unicast-only discovery; each robot peers ONLY with the workstation).
    #  - default bridge: macvlan blocks host<->container traffic, so the
    #    host-side services in this compose file (temporal, postgres) are
    #    reached by service name over the bridge instead.
    # NOTE: without host networking, X11 over SSH forwarding
    # (DISPLAY=localhost:N) no longer reaches the SSH proxy on the host.
    # GUI apps instead target the Jetson's local desktop via the X11 unix
    # socket mounted below (network-independent, works under macvlan).
    networks:
      # The bridge must provide the default route (internet via NAT); the
      # macvlan gateway would be the host itself, which macvlan blocks.
      default:
        gw_priority: 1
      syncai-lan:
        ipv4_address: 192.168.0.32
    # The default docker-default AppArmor profile blocks D-Bus, which nmcli
    # needs to reach the host's NetworkManager via the socket mounted below.
    security_opt:
      - apparmor=unconfined
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Reach compose services over the default bridge (macvlan can't hairpin
      # to host-published ports).
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_HOST=postgres
      # Workspace is mounted at /home/ubuntu/robot_ws, so config lives there.
      - CYCLONEDDS_URI=file:///home/ubuntu/robot_ws/config/cyclonedds.xml
      # DDS bind address consumed by the shared cyclonedds.xml (the dual-homed
      # container must pin DDS to its macvlan IP, not the bridge).
      - DDS_BIND_ADDRESS=192.168.0.32
      # X11 GUI (rviz2 etc.) on the Jetson's LOCAL desktop via the unix
      # socket volume below. :1 is the current desktop session — if GUIs
      # fail after a reboot, check `ls /tmp/.X11-unix` on the host (X0 -> :0)
      # or override per-shell with `docker exec -e DISPLAY=:0 ...`.
      # The xauth cookie is provided via XAUTHORITY below.
      - DISPLAY=:1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      # Mount the colcon workspace (src/ lives here) into the container.
      - .:/home/ubuntu/robot_ws
      # Per-instance identity, overlaid on the fixed path the launch files read.
      - ./config/instances/robot01.ini:/home/ubuntu/robot_ws/config/system.ini:ro
      # X11 unix socket of the host's local desktop (:1). Socket connect
      # needs write access, so no :ro.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # X11 auth cookie for the local desktop. /tmp is wiped on reboot, so
      # regenerate after each host reboot (wildcard family so the container
      # hostname doesn't have to match):
      #   XAUTHORITY=/run/user/1000/gdm/Xauthority xauth nlist :1 \
      #     | sed -e 's/^..../ffff/' | xauth -f /tmp/.docker.xauth nmerge -
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      # Host D-Bus system bus so nmcli inside the container talks to the
      # host's NetworkManager daemon (there is no NM daemon in the container).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      # Host avahi legacy socket so libnss-mdns resolves *.local names for
      # anything using system resolution (ping, getaddrinfo, requests, ...).
      # avahi CLI tools use D-Bus instead and don't need this.
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket:ro
    working_dir: /home/ubuntu/robot_ws
    stdin_open: true
    tty: true
    command: [ "bash" ]

  robot02:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncai-test-robot
    container_name: robot02
    user: "${UID:-1000}:${GID:-1000}"
    # Same dual-homed layout and rationale as robot01; see the notes there.
    networks:
      # See robot01: bridge provides the default route.
      default:
        gw_priority: 1
      syncai-lan:
        ipv4_address: 192.168.0.35
    security_opt:
      - apparmor=unconfined
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_HOST=postgres
      - CYCLONEDDS_URI=file:///home/ubuntu/robot_ws/config/cyclonedds.xml
      - DDS_BIND_ADDRESS=192.168.0.35
      # Local desktop X11; see robot01 notes.
      - DISPLAY=:1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - .:/home/ubuntu/robot_ws
      # Per-instance identity, overlaid on the fixed path the launch files read.
      - ./config/instances/robot02.ini:/home/ubuntu/robot_ws/config/system.ini:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket:ro
    working_dir: /home/ubuntu/robot_ws
    stdin_open: true
    tty: true
    command: [ "bash" ]

  robot03:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncai-test-robot
    container_name: robot03
    user: "${UID:-1000}:${GID:-1000}"
    # Same dual-homed layout and rationale as robot01; see the notes there.
    networks:
      # See robot01: bridge provides the default route.
      default:
        gw_priority: 1
      syncai-lan:
        ipv4_address: 192.168.0.36
    security_opt:
      - apparmor=unconfined
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_HOST=postgres
      - CYCLONEDDS_URI=file:///home/ubuntu/robot_ws/config/cyclonedds.xml
      - DDS_BIND_ADDRESS=192.168.0.36
      # Local desktop X11; see robot01 notes.
      - DISPLAY=:1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - .:/home/ubuntu/robot_ws
      # Per-instance identity, overlaid on the fixed path the launch files read.
      - ./config/instances/robot03.ini:/home/ubuntu/robot_ws/config/system.ini:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /run/avahi-daemon/socket:/run/avahi-daemon/socket:ro
    working_dir: /home/ubuntu/robot_ws
    stdin_open: true
    tty: true
    command: [ "bash" ]

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-default}
    ports:
      - "5432:5432"
    volumes:
      # Bind mount: postgres data lives in ./data/postgres on the host.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      # pgAdmin web UI on the host at http://localhost:5050
      - "5050:80"
    depends_on:
      - postgres

  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: temporal
    environment:
      # Reuse the shared postgres instance; auto-setup creates the
      # temporal / temporal_visibility databases on first start.
      - DB=${TEMPORAL_DB:-postgres12}
      - DB_PORT=${TEMPORAL_DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=${TEMPORAL_POSTGRES_SEEDS:-postgres}
    ports:
      # Temporal frontend gRPC endpoint (SDK clients connect here)
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal_ui:
    image: temporalio/ui:2.42.1
    container_name: temporal_ui
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8081:8080"
    depends_on:
      - temporal

networks:
  # macvlan on the wired factory LAN, shared with the artifact containers
  # (robot01=.32, conveyor01=.33, conveyor02=.34, robot02=.35, robot03=.36).
  # Created externally:
  #   docker network create -d macvlan --subnet=192.168.0.0/24 \
  #     --ip-range=192.168.0.32/28 -o parent=enP2p1s0 syncai-lan
  syncai-lan:
    external: true
