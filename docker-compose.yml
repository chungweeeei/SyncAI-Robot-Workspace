include:
  - docker-compose.robots.yml

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-default}
    ports:
      - "5432:5432"
    volumes:
      # Bind mount: postgres data lives in ./data/postgres on the host.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      # pgAdmin web UI on the host at http://localhost:5050
      - "5050:80"
    depends_on:
      - postgres

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: temporal
    environment:
      # Reuse the shared postgres instance; auto-setup creates the
      # temporal / temporal_visibility databases on first start.
      - DB=${TEMPORAL_DB:-postgres12}
      - DB_PORT=${TEMPORAL_DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=${TEMPORAL_POSTGRES_SEEDS:-postgres}
    ports:
      # Temporal frontend gRPC endpoint (SDK clients connect here)
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal_ui:
    image: temporalio/ui:2.52.1
    container_name: temporal_ui
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8081:8080"
    depends_on:
      - temporal